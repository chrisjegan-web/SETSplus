        .st-swap-btn {
            padding: 7px 14px; border-radius: 20px;
            background: var(--surface); border: 1px solid var(--border);
            color: var(--text-sec); font-size: 12px; font-weight: 600;
        }
        .st-swap-btn:active { background: var(--surface-mid); }
        .st-swap-btn--sub { color: var(--text-muted); font-size: 11px; }

        .st-body--center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .st-ready-eyebrow {
            font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
            color: var(--success); margin-bottom: 14px;
        }
        .st-firstup { font-size: 13px; color: var(--text-muted); margin-top: 14px; }
        .st-ringwrap--ready { display: flex; align-items: center; justify-content: center;
            width: 176px; height: 176px; margin: 22px auto 20px;
            border: 4px solid var(--success-border); border-radius: 50%; }
        .st-clock--ready { position: static; font-size: 68px; color: var(--success); }

        .st-ringwrap { position: relative; width: 176px; height: 176px; margin: 22px auto 20px; }
        .st-ringwrap--big { width: 230px; height: 230px; margin: 16px auto 18px; }
        .st-disc {
            position: absolute; inset: 12px; border-radius: 50%;
            background: var(--success-dim);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .st-disc-img { width: 84%; height: 84%; object-fit: contain; }
        .st-disc--empty { font-size: 60px; }
        .st-clock--overlay {
            position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
            font-size: 30px; background: rgba(15,23,41,0.82); padding: 2px 14px; border-radius: 12px;
        }
        .st-clock--overlay.st-clock--ready { font-size: 34px; color: var(--success); }
        .st-half-marker {
            position: absolute; left: 50%; bottom: 12px;
            transform: translate(-50%, 50%);   /* sits centred on the ring stroke (stroke is inset ~12px) */
            width: 26px; height: 26px; border-radius: 50%;
            background: var(--primary); color: #fff;
            box-shadow: 0 0 0 3px var(--bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 800; z-index: 3;
        }
        .st-swap-eyebrow {
            font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
            color: var(--primary); margin-top: 4px;
        }
        .st-swap-instead { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .st-swap-choices { display: flex; flex-direction: column; gap: 8px; max-width: 300px; margin: 20px auto 0; width: 100%; }
        .st-choice {
            padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 700;
            background: var(--surface); border: 1px solid var(--border); color: var(--text);
        }
        .st-choice:active { background: var(--surface-mid); }
        .st-choice--go { background: var(--success); border-color: var(--success); color: #06231a; }
        .st-choice--sub { background: none; border: none; color: var(--text-muted); font-weight: 600; font-size: 13px; padding: 8px; }

        .st-swap-overlay {
            position: absolute; inset: 0; border-radius: 50%;
            background: rgba(15,23,41,0.86); display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 22px; font-weight: 800; color: var(--success);
            line-height: 1.15; letter-spacing: 0.5px;
        }
        .st-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .st-ring-bg { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 7; }
        .st-ring {
            fill: none; stroke: var(--success); stroke-width: 7; stroke-linecap: round;
            stroke-dasharray: 339.3; transition: stroke-dashoffset 1s linear;
        }
        .st-clock {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 38px; font-weight: 800; color: var(--text); letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
        }

        .st-steps {
            text-align: left; margin: 0 auto; padding-left: 20px; max-width: 340px;
            font-size: 13.5px; color: var(--text-sec); line-height: 1.65;
        }
        .st-steps li { margin-bottom: 7px; }

        .st-controls {
            display: flex; gap: 8px; padding: 10px 16px calc(14px + var(--safe-bottom));
            border-top: 1px solid var(--border);
        }
        .st-btn {
            flex: 1; padding: 15px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text-sec); font-size: 14px; font-weight: 600;
        }
        .st-btn--main { flex: 1.5; background: var(--success); color: #0A0E27; border-color: transparent; font-weight: 700; }
        .st-btn:active { opacity: 0.8; }

        /* ── RUN SESSION — shares st- ring geometry, adds run specifics ─────── */
        .rs-eyebrow { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .rs-clock { font-size: 56px; font-weight: 800; letter-spacing: -1px; color: var(--text); line-height: 1; }
        .rs-clocksub { font-size: 12px; color: var(--text-sec); margin-top: 8px; }
        .rs-ringinner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .rs-nextup { text-align: center; margin-top: 4px; }
        .rs-nextup-main { font-size: 15px; font-weight: 600; color: var(--text); }
        .rs-nextup-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .rs-stats { display: flex; padding: 0 20px; margin-top: 18px; }
        .rs-stat { flex: 1; text-align: center; }
        .rs-stat + .rs-stat { border-left: 0.5px solid var(--border); }
        .rs-statv { font-size: 23px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
        .rs-statl { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-top: 3px; }
        .rs-metricgrid { display: flex; flex-wrap: wrap; gap: 10px; padding: 22px 20px 0; }
        .rs-metric { flex: 1; min-width: calc(50% - 5px); background: var(--surface); border-radius: 14px; padding: 16px; text-align: center; }
        .rs-metric-v { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
        .rs-metric-l { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; }
        .rs-bridge {
            margin: 20px 20px 0; padding: 16px; background: var(--success-dim);
            border: 0.5px solid var(--success-border); border-radius: 14px;
            display: flex; align-items: center; gap: 12px; text-align: left;
        }
        .rs-bridge-icon { font-size: 26px; }
        .rs-bridge-title { font-size: 14px; font-weight: 700; color: var(--success); }
        .rs-bridge-sub { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
        .rs-bridge-go { color: var(--success); font-size: 20px; }
        .rs-done-icon { font-size: 44px; }
        .rs-done-title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-top: 8px; color: var(--text); }
        .rs-done-sub { font-size: 13px; color: var(--text-sec); margin-top: 4px; }
        .rs-target-opt {
            display: flex; align-items: center; gap: 12px; padding: 16px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            margin-bottom: 10px; cursor: pointer;
        }
        .rs-target-opt.rs-target-on { border-color: var(--run-border); background: var(--run-dim); }
        .rs-target-main { flex: 1; }
        .rs-target-label { font-size: 15px; font-weight: 600; color: var(--text); }
        .rs-target-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .rs-target-val { font-size: 16px; font-weight: 700; color: var(--run); }
        .rs-step {
            width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); font-size: 22px; font-weight: 700;
        }
        .rs-topbar { position: relative; height: 7px; border-radius: 4px; overflow: hidden; margin-top: 12px; background: rgba(255,255,255,0.07); }
        .rs-topsegs { position: absolute; inset: 0; display: flex; }
        .rs-topscrim { position: absolute; top: 0; right: 0; bottom: 0; background: rgba(10,14,39,0.62); transition: width 0.9s linear; }
        .rs-topmark { position: absolute; top: -1px; bottom: -1px; width: 2px; margin-left: -1px; background: var(--text); border-radius: 1px; transition: left 0.9s linear; }

        /* ── CUSTOM WORKOUT BUILDER — kept calm; progressive disclosure ─────── */
        .bd-head { padding: calc(16px + var(--safe-top)) 16px 8px; position: relative; flex: 0 0 auto; }
        .bd-head-title { text-align: center; font-size: 16px; font-weight: 700; color: var(--text); }
        .bd-head-btn { position: absolute; top: calc(14px + var(--safe-top)); background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
        .bd-search { width: 100%; box-sizing: border-box; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-mid); color: var(--text); font-size: 14px; outline: none; }
        .bd-pills { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 16px 12px; flex: 0 0 auto; }
        .bd-pill { flex: 0 0 auto; padding: 7px 13px; border-radius: 16px; border: 1px solid var(--border); background: transparent; color: var(--text-sec); font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }
        .bd-pill--on { border-color: var(--primary); background: var(--primary); color: #0A0E27; }
        .bd-list { flex: 1; overflow-y: auto; padding: 0 16px; }
        .bd-row { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 0.5px solid var(--border); }
        .bd-name { font-size: 15px; font-weight: 600; color: var(--text); }
        .bd-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .bd-add { flex: 0 0 auto; width: 66px; padding: 8px 0; border-radius: 10px; border: 1px solid var(--primary); background: var(--primary); color: #0A0E27; font-size: 13px; font-weight: 700; cursor: pointer; }
        .bd-add--on { border-color: var(--success); background: var(--success-dim); color: var(--success); }
        .bd-foot { flex: 0 0 auto; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 0.5px solid var(--border); }
        .bd-hint { text-align: center; color: var(--text-muted); font-size: 14px; padding: 44px 24px; line-height: 1.6; }
        .bd-card { background: var(--surface); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
        .bd-stat { flex: 1; text-align: center; background: var(--surface-mid); border-radius: 9px; padding: 6px 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .bd-stepbtn { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-high); color: var(--text); font-size: 15px; font-weight: 700; cursor: pointer; line-height: 1; }
        .bd-statv { font-size: 15px; font-weight: 700; color: var(--text); min-width: 30px; }
        .bd-statl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        /* ── WARM-UP — rep based, no clock ─────────────────────────────────── */
        .wu-body { flex: 1; overflow-y: auto; scrollbar-width: none; padding: 16px 14px calc(20px + var(--safe-bottom)); }
        .wu-body::-webkit-scrollbar { display: none; }
        .wu-cardio {
            display: flex; gap: 11px; align-items: center;
            background: var(--run-dim); border: 1px solid var(--run-border);
            border-radius: 14px; padding: 14px; margin-bottom: 12px;
            font-size: 13px; color: var(--text-sec);
        }
        .wu-drill {
            display: flex; gap: 12px; align-items: flex-start;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 14px; padding: 14px; margin-bottom: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .wu-drill--done { background: var(--success-dim); border-color: var(--success-border); }
        .wu-check {
            width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0;
            border: 1.5px solid var(--border-mid); display: flex;
            align-items: center; justify-content: center;
            font-size: 13px; color: var(--success); font-weight: 700; margin-top: 1px;
        }
        .wu-drill--done .wu-check { border-color: var(--success); }
        .wu-main { flex: 1; min-width: 0; }
        .wu-name { font-size: 15px; font-weight: 700; color: var(--text); }
        .wu-reps { font-size: 12px; font-weight: 600; color: var(--success); margin: 2px 0 5px; }
        .wu-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

        /* ── THE DAY — a stack of blocks, coloured by what they are ─────────
           Green = stretch. Orange = lift. Blue = run/walk.
           They're in the order you put them in. Tap one, it starts. */
        .today-body { padding: 8px 14px 16px; }

        .blk {
            display: flex; align-items: center; gap: 13px;
            border-radius: 16px; padding: 16px 16px;
            margin-bottom: 9px;
            border: 1px solid var(--border);
            background: var(--surface);
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.08s ease, opacity 0.15s ease;
        }
        .blk:active { transform: scale(0.985); }

        .blk--stretch { background: var(--success-dim); border-color: var(--success-border); }
        .blk--lift    { background: var(--primary-dim); border-color: var(--primary-border); }
        .blk--run     { background: var(--run-dim);     border-color: var(--run-border); }
        .blk--rest    { background: var(--surface);     border-style: dashed; }

        /* The next thing up gets weight — everything else recedes. */
        .blk--next { border-width: 2px; }
        .blk--next.blk--stretch { border-color: var(--success); }
        .blk--next.blk--lift    { border-color: var(--primary); }
        .blk--next.blk--run     { border-color: var(--run); }

        .blk--done { opacity: 0.42; }

        .blk-icon { font-size: 20px; width: 24px; text-align: center; flex-shrink: 0; }
        .blk-main { flex: 1; min-width: 0; }
        .blk-name {
            font-size: 16px; font-weight: 700; color: var(--text);
            letter-spacing: -0.2px; margin-bottom: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .blk-meta {
            font-size: 12px; color: var(--text-sec);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .blk-right { flex-shrink: 0; }
        .blk-arrow { font-size: 19px; color: var(--text-muted); }
        .blk-tick  { font-size: 16px; color: var(--text-sec); }
        .blk-go {
            font-size: 13px; font-weight: 700; padding: 8px 14px;
            border-radius: 9px; color: #0A0E27; background: var(--success);
        }
        .blk--lift .blk-go { background: var(--primary); color: #fff; }
        .blk--run  .blk-go { background: var(--run);     color: #fff; }

        .day-empty { text-align: center; padding: 44px 20px; }
        .day-empty-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
        .day-empty-body { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }

        .hero-cta {
            width: 100%; border: none; border-radius: 14px;
            padding: 16px; font-size: 16px; font-weight: 700; color: #0A0E27;
        }
        .hero-cta:active { opacity: 0.82; }

        /* ── SECONDARY ROWS — Lift/Run/Stretch tabs, and the plan sheet ────── */
        .sec-label {
            font-size: 10px; font-weight: 700; letter-spacing: 1.4px;
            text-transform: uppercase; color: var(--text-muted); margin: 0 4px 10px;
        }
        .sec-row {
            display: flex; align-items: center; gap: 12px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 14px 16px; margin-bottom: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .sec-row:active { background: var(--surface-mid); }
        .sec-row-icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
        .sec-row-main { flex: 1; min-width: 0; }
        .sec-row-label { font-size: 15px; font-weight: 600; color: var(--text); }
        .sec-row-sub {
            font-size: 12px; color: var(--text-muted); margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .sec-row-arrow { font-size: 18px; color: var(--text-muted); flex-shrink: 0; }
        .sec-row--done { opacity: 0.55; }

        .hero { border-radius: 20px; padding: 22px 20px 20px; background: var(--surface);
                border: 1px solid var(--border); margin-bottom: 22px; }
        .hero--lift    { background: var(--primary-dim); border-color: var(--primary-border); }
        .hero--run     { background: var(--run-dim);     border-color: var(--run-border); }
        .hero--stretch { background: var(--success-dim); border-color: var(--success-border); }
        .hero-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 1.4px;
                        text-transform: uppercase; margin-bottom: 10px; color: var(--text-muted); }
        .hero--lift .hero-eyebrow    { color: var(--primary); }
        .hero--run .hero-eyebrow     { color: var(--run); }
        .hero--stretch .hero-eyebrow { color: var(--success); }
        .hero-title { font-size: 30px; font-weight: 800; letter-spacing: -0.7px;
                      color: var(--text); line-height: 1.1; margin-bottom: 6px; }
        .hero-meta { font-size: 13px; color: var(--text-sec); line-height: 1.5; margin-bottom: 18px; }
        .hero--lift .hero-cta    { background: var(--primary); color: #fff; }
        .hero--run .hero-cta     { background: var(--run); color: #fff; }
        .hero--stretch .hero-cta { background: var(--success); }

        /* ── LIFT / RUN / STRETCH SECTION ──────────────────────────────────── */
        /* Sub-header with back nav for inner screens */
        .back-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 22px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: -8px;
        }

        /* Program cards */
        .prog-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .prog-card:active { background: var(--surface-mid); }
        .prog-card--active {
            background: var(--primary-dim);
            border-color: var(--primary-border);
        }
        .prog-card-name { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
        .prog-card-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
        .prog-card-desc { font-size: 13px; color: var(--text-sec); line-height: 1.5; }
        .prog-card-progress {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
        }

        /* History cards */
        .hist-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 8px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .hist-card:active { background: var(--surface-mid); }
        .hist-card-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .hist-card-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
        .hist-card-date { font-size: 12px; color: var(--text-muted); }
        .hist-card-meta { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
        .hist-card-exercises { font-size: 12px; color: var(--text-sec); margin-top: 4px; line-height: 1.5; }

        /* ── WORKOUT SCREEN ──────────────────────────────────────────────────── */
        #screen-workout {
            display: none;
            flex-direction: column;
        }
        #screen-workout.active { display: flex; }

        .workout-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(14px + var(--safe-top)) 20px 12px;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .workout-header-left { display: flex; align-items: center; gap: 10px; }
        .workout-name { font-size: 16px; font-weight: 700; color: var(--text); }
        .workout-timer { font-size: 14px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .workout-end-btn {
            background: none;
            border: 1px solid rgba(239,71,111,0.4);
            color: #EF476F;
            font-size: 13px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
        }

        .wk-foot {
            flex: 0 0 auto; padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
            border-top: 0.5px solid var(--border); background: var(--bg);
        }
        .wk-foot:empty { display: none; }
        .workout-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            padding: 16px 20px 120px;
        }
        .workout-body::-webkit-scrollbar { display: none; }

        /* Exercise block */
        .ex-block { margin-bottom: 24px; }
        .ex-collapsed {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 14px; border-bottom: 1px solid var(--border);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .ex-collapsed:active { background: var(--surface); }
        .ex-collapsed--done { opacity: 0.55; }
        .ex-dot {
            width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
            border: 1.5px solid var(--text-muted); color: var(--text-muted);
            font-size: 11px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }
        .ex-dot--done { border-color: var(--success); color: var(--success); }
        .ex-collapsed-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ex-collapsed--done .ex-collapsed-name { color: var(--text-sec); text-decoration: line-through; text-decoration-color: var(--text-muted); }
        .ex-collapsed-right { font-size: 12px; font-weight: 600; color: var(--text-muted); flex-shrink: 0; }
        .ex-collapsed--done .ex-collapsed-right { color: var(--success); }
        .ex-block--open {
            background: var(--surface); border: 1px solid var(--border);
            border-bottom: 2px solid var(--primary);
            border-radius: var(--radius); padding: 16px; margin-bottom: 8px;
        }
        .ex-block--open.ex-block--done { border-bottom-color: var(--success); }
        .ex-complete {
            margin-top: 8px; padding: 12px; border-radius: var(--radius-sm);
            background: var(--success-dim); border: 1px solid var(--success-border);
            display: flex; align-items: center; gap: 10px;
        }
        .ex-complete-tick { color: var(--success); font-size: 15px; }
        .ex-complete-label { flex: 1; font-size: 13px; font-weight: 600; color: var(--success); }
        .ex-next-btn { background: var(--success); border: none; color: #0A0E27; padding: 9px 16px; border-radius: 9px; font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
        .ex-next-btn--finish { background: var(--primary); }
        .ex-number { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
        .ex-name { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 2px; letter-spacing: -0.3px; }
        .ex-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

        /* Set row */
        .set-row {
            display: grid;
            grid-template-columns: 34px 116px 116px 34px;
            gap: 6px;
            align-items: center;
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            min-height: 52px;
            transition: background 0.1s, border-color 0.1s;
        }
        /* bodyweight (reps only) and completed rows collapse to three columns */
        .set-row--bw { grid-template-columns: 34px 1fr 36px; }
        .set-cols {
            display: grid; grid-template-columns: 34px 116px 116px 34px;
            gap: 6px; padding: 2px 12px 5px;
        }
        .set-cols--bw { grid-template-columns: 34px 1fr 36px; }
        .set-col-h { font-size: 9px; font-weight: 600; letter-spacing: 1px; color: var(--text-muted); text-align: center; }
        .set-row--done {
            background: var(--success-dim);
            border-color: var(--success-border);
            grid-template-columns: 34px 1fr 36px;
        }
        .wk-set-label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
        .wk-set-label--done { color: var(--success); }

        .set-val-group { display: flex; align-items: center; gap: 4px; justify-content: center; }
        .set-adj-btn {
            background: var(--surface-mid);
            border: 1px solid var(--border-mid);
            color: var(--text);
            width: 30px; height: 30px;
            border-radius: 6px;
            font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
        }
        .set-input {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            width: 48px;
            padding: 0;
            font-family: inherit;
        }
        .set-input:focus { outline: none; }

        .set-done-display {
            font-size: 15px;
            font-weight: 600;
            color: var(--success);
            flex: 1;
        }

        .set-done-btn {
            background: var(--primary);
            border: none;
            color: white;
            font-size: 15px;
            font-weight: 700;
            padding: 0;
            border-radius: 8px;
            cursor: pointer;
            width: 34px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .set-done-btn--done {
            background: transparent;
            border: 1px solid var(--success-border);
            color: var(--success);
            font-size: 18px;
            padding: 4px 10px;
        }

        /* Next exercise preview */

        /* Rest timer overlay */
        .rest-overlay {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: linear-gradient(135deg, #1a237e, #283593);
            padding: 12px 20px 20px;
            display: none;
            z-index: 100;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .rest-overlay.active { display: block; }
        .rest-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .rest-info { flex: 1; }
        .rest-label { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .rest-time { font-size: 38px; font-weight: 800; color: white; font-variant-numeric: tabular-nums; line-height: 1; }
        .rest-controls { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
        .rest-adj-row { display: flex; gap: 6px; }
        .rest-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            min-height: 34px;
        }
        .rest-skip-btn {
            background: white;
            border: none;
            color: #1a237e;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Workout complete screen */

        /* Empty state */
        .empty {
            text-align: center;
            padding: 48px 20px;
        }
        .empty-icon { font-size: 44px; margin-bottom: 16px; }
        .empty-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .empty-body { font-size: 13px; color: var(--text-sec); line-height: 1.6; max-width: 260px; margin: 0 auto 24px; }
        /* ── PLAN GRID ───────────────────────────────────────────────────────── */
        .agenda { display: flex; flex-direction: column; gap: 8px; }
        .week-sep { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); padding: 14px 4px 4px; }
        .week-sep--now { color: var(--success); }
        #plan-today { scroll-margin-top: 12px; }
        .plan-tools { margin-top: 18px; }
        .agenda-row { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; }
        .agenda-row:active { background: var(--surface-mid); }
        .agenda-row--today { border: 2px solid var(--success); }
        .agenda-row--done .agenda-item-name { color: var(--text-muted); }
        .agenda-date { flex-shrink: 0; width: 42px; text-align: center; }
        .agenda-dow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
        .agenda-dow--today { color: var(--success); }
        .agenda-num { font-size: 21px; font-weight: 800; color: var(--text); line-height: 1.1; }
        .agenda-row--today .agenda-num { color: var(--success); }
        .agenda-items { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 1px; }
        .agenda-item { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
        .agenda-item-icon { font-size: 14px; flex-shrink: 0; }
        .agenda-item-name { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .agenda-item-sub { color: var(--text-muted); font-size: 11px; flex-shrink: 0; }
        .agenda-item--done .agenda-item-name { text-decoration: line-through; text-decoration-color: var(--text-muted); color: var(--text-muted); }
        .agenda-empty { font-size: 13px; color: var(--text-muted); padding-top: 3px; }
        .agenda-check { position: absolute; top: 10px; right: 12px; font-size: 13px; color: var(--success); font-weight: 700; }
        .stretch-suggest { background: var(--primary-dim); border: 1px solid var(--primary-border); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px; }
        .stretch-suggest-text { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 12px; }
        .stretch-suggest-btns { display: flex; gap: 8px; }
        .stretch-suggest-btns .btn { flex: 1; padding: 10px; }
        .day-add-row { display: flex; align-items: center; gap: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 15px 16px; margin-bottom: 9px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .day-add-row:active { background: var(--surface-mid); }
        .day-add-icon { font-size: 20px; flex-shrink: 0; }
        .day-add-main { flex: 1; min-width: 0; }
        .day-add-label { font-size: 15px; font-weight: 600; color: var(--text); }
        .day-add-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .day-add-arrow { color: var(--text-muted); font-size: 20px; flex-shrink: 0; }
        .sheet-sub-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .sheet-back { background: none; border: none; color: var(--primary); font-size: 22px; cursor: pointer; padding: 0; line-height: 1; }
        .ap-prog-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
        .ap-prog-name { font-size: 17px; font-weight: 800; color: var(--text); }
        .ap-prog-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
        .ap-date { width: 100%; box-sizing: border-box; padding: 13px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 15px; font-weight: 600; font-family: inherit; -webkit-appearance: none; }
        .ap-days { display: flex; gap: 7px; }
        .ap-day { flex: 1; aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--border); background: transparent; color: var(--text-sec); font-size: 14px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .ap-day--on { border-color: var(--success); background: var(--success-dim); color: var(--success); }
        .ap-hint { font-size: 12px; color: var(--text-sec); line-height: 1.5; margin-top: 10px; }
        .ap-toggle { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .ap-toggle-main { flex: 1; min-width: 0; }
        .ap-toggle-label { font-size: 14px; font-weight: 600; color: var(--text); }
        .ap-toggle-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
        .ap-switch { flex-shrink: 0; width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #0A0E27; }
        .ap-switch--on { background: var(--success); border-color: var(--success); }

        /* ── SPLASH ─────────────────────────────────────────────────────────── */
        .splash {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.4s ease;
        }
        .splash.hidden { opacity: 0; pointer-events: none; }
        .splash-mark { font-size: 52px; font-weight: 800; letter-spacing: -1.5px; display: flex; align-items: center; }
        .sp-l { color: var(--text); display: inline-block; opacity: 0; transform: translateX(40px) scale(0.3); }
        .sp-plus { color: var(--primary); display: inline-block; }
        .splash-mark.go .sp-l { animation: spEmerge 0.35s ease-out forwards; }
        .splash-mark.go .sp-l:nth-child(4) { animation-delay: 0.10s; }
        .splash-mark.go .sp-l:nth-child(3) { animation-delay: 0.22s; }
        .splash-mark.go .sp-l:nth-child(2) { animation-delay: 0.34s; }
        .splash-mark.go .sp-l:nth-child(1) { animation-delay: 0.46s; }
        @keyframes spEmerge {
            0%   { opacity: 0; transform: translateX(40px) scale(0.3); }
            50%  { opacity: 1; }
            75%  { transform: translateX(-5px) scale(1.08); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .sp-plus.go { animation: spJump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes spJump {
            0%   { transform: scale(1) translateY(0); }
            25%  { transform: scale(1.4) translateY(-16px); }
            50%  { transform: scale(1.2) translateY(-20px); }
            75%  { transform: scale(1.1) translateY(6px); }
            90%  { transform: scale(0.95) translateY(-2px); }
            100% { transform: scale(1) translateY(0); }
        }
        .sp-plus.glow { animation: spGlow 1.2s ease-in-out infinite alternate; }
        @keyframes spGlow {
            0%   { text-shadow: 0 0 12px rgba(255,107,53,0.45), 0 0 24px rgba(255,107,53,0.2); }
            100% { text-shadow: 0 0 22px rgba(255,107,53,0.85), 0 0 44px rgba(255,107,53,0.45); }
        }
        .splash-tag { font-size: 11px; color: var(--text-muted); letter-spacing: 3px; text-transform: uppercase; margin-top: 10px; opacity: 0; transform: translateY(12px); }
        .splash-tag.go { animation: spTag 0.6s ease-out forwards; }
        @keyframes spTag { to { opacity: 1; transform: translateY(0); } }

        /* ── TAB BAR ────────────────────────────────────────────────────────── */
        .tab-bar {
            background: var(--tab-bg);
            border-top: 1px solid var(--tab-border);
            display: flex; justify-content: space-around; align-items: center;
            padding: 8px 0 calc(8px + var(--safe-bottom));
            flex-shrink: 0;
        }
        .tab-btn {
            background: none; border: none;
            padding: 8px 10px; min-height: 44px;
            display: flex; align-items: center; justify-content: center;
        }
        .tab-label {
            font-size: 13px; font-weight: 500;
            color: var(--tab-inactive); letter-spacing: 0.1px;
            transition: color 0.12s, font-weight 0.12s;
        }
        .tab-btn.active .tab-label { color: var(--tab-active); font-weight: 700; }
    </style>
</head>
<body>

<div class="splash" id="splash">
    <div class="splash-mark" id="splash-mark"><span class="sp-l">S</span><span class="sp-l">E</span><span class="sp-l">T</span><span class="sp-l">S</span><span class="sp-plus" id="sp-plus">+</span></div>
    <div class="splash-tag" id="splash-tag">Train · Stretch · Grow</div>
</div>

<div class="app">
    <div class="screens">

        <!-- ── TODAY ──────────────────────────────────────────────────────── -->
        <div class="screen active" id="screen-today">
            <div class="today-header">
                <button class="settings-gear" onclick="openSettings()" aria-label="Settings">⚙</button>
                <div class="today-wordmark">SETS<span>+</span></div>
                <div class="today-greeting" id="greeting-name">Good evening, Athlete</div>
            </div>
            <div class="today-body" id="today-body"></div>
        </div>

        <!-- ── LIFT ───────────────────────────────────────────────────────── -->
        <div class="screen" id="screen-lift">
            <div class="today-header" id="lift-header">
                <div class="today-wordmark">SETS<span>+</span> <span style="color:var(--text);font-size:26px;font-weight:700;letter-spacing:-0.5px;">Lift</span></div>
            </div>
            <div class="tab-content" id="lift-content"></div>
        </div>

        <!-- ── WORKOUT (active session — tab bar hides) ───────────────────── -->
        <div class="screen" id="screen-workout">
            <div class="workout-header">
                <div class="workout-header-left">
                    <button class="back-btn" onclick="endWorkoutPrompt()">←</button>
                    <div>
                        <div class="workout-name" id="wk-name">Chest & Triceps</div>
                        <div class="workout-timer" id="wk-timer">0:00</div>
                    </div>
                </div>
                <button class="workout-end-btn" onclick="endWorkoutPrompt()">End</button>
            </div>
            <div class="workout-body" id="wk-body"></div>
            <div class="wk-foot" id="wk-foot"></div>
        </div>

        <!-- Rest timer overlay (lives outside screens, always on top) -->
        <div class="rest-overlay" id="rest-overlay">
            <div class="rest-row">
                <div class="rest-info">
                    <div class="rest-label">Rest</div>
                    <div class="rest-time" id="rest-time">2:00</div>
                </div>
                <div class="rest-controls">
                    <div class="rest-adj-row">
                        <button class="rest-btn" onclick="adjustRest(-15)">−15s</button>
                        <button class="rest-btn" onclick="adjustRest(15)">+15s</button>
                    </div>
                    <button class="rest-skip-btn" onclick="skipRest()">Skip rest →</button>
                </div>
            </div>
        </div>

        <!-- ── RUN ────────────────────────────────────────────────────────── -->
        <div class="screen" id="screen-run">
            <div class="today-header" id="run-header">
                <div class="today-wordmark">SETS<span>+</span> <span style="color:var(--text);font-size:26px;font-weight:700;letter-spacing:-0.5px;">Run</span></div>
            </div>
            <div class="tab-content" id="run-content"></div>
        </div>

        <!-- ── STRETCH ────────────────────────────────────────────────────── -->
        <div class="screen" id="screen-stretch">
            <div class="today-header" id="stretch-header">
                <div class="today-wordmark">SETS<span>+</span> <span style="color:var(--text);font-size:26px;font-weight:700;letter-spacing:-0.5px;">Stretch</span></div>
            </div>
            <div class="tab-content" id="stretch-content"></div>
        </div>

        <!-- ── PLAN ───────────────────────────────────────────────────────── -->
        <div class="screen" id="screen-plan">
            <div class="today-header" id="plan-header">
                <div class="today-wordmark">SETS<span>+</span> <span style="color:var(--text);font-size:26px;font-weight:700;letter-spacing:-0.5px;">Plan</span></div>
            </div>
            <div class="tab-content tab-content--plan" id="plan-content"></div>
        </div>

        <div class="screen screen--session" id="screen-stretch-session"></div>
        <div class="screen screen--session" id="screen-run-session"></div>
        <div class="screen screen--session" id="screen-builder"></div>
        <div class="screen screen--session" id="screen-warmup"></div>
        <div class="screen screen--session" id="screen-settings"></div>

    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <button class="tab-btn active" id="tab-today" onclick="switchTab('today')">
            <span class="tab-label">Today</span>
        </button>
        <button class="tab-btn" id="tab-lift" onclick="switchTab('lift')">
            <span class="tab-label">Lift</span>
        </button>
        <button class="tab-btn" id="tab-run" onclick="switchTab('run')">
            <span class="tab-label">Run</span>
        </button>
        <button class="tab-btn" id="tab-stretch" onclick="switchTab('stretch')">
            <span class="tab-label">Stretch</span>
        </button>
        <button class="tab-btn" id="tab-plan" onclick="switchTab('plan')">
            <span class="tab-label">Plan</span>
        </button>
    </div>
</div>

<script>
'use strict';

// ── STATE ─────────────────────────────────────────────────────────────────────
const S = {
    tab:              'today',
    userName:         localStorage.getItem('sp_name') || 'Athlete',
    streak:           parseInt(localStorage.getItem('sp_streak') || '0'),
    prsThisWeek:      parseInt(localStorage.getItem('sp_prs_week') || '0'),

    // Preferences the user can actually change (Settings). Defaults are my best
    // guess; these make them dials rather than hardcoded assumptions.
    getReady:   parseInt(localStorage.getItem('sp_get_ready') || '3'),   // seconds before each hold
    countdownBeeps: localStorage.getItem('sp_countdown_beeps') !== 'off', // tick 3-2-1 into a hold
    soundStretch: localStorage.getItem('sp_sound_stretch') || localStorage.getItem('sp_sound') || 'voice', // per-activity cue mode
    soundRun:     localStorage.getItem('sp_sound_run')     || localStorage.getItem('sp_sound') || 'voice',
    sound:        'voice',   // ACTIVE value — set from soundStretch/soundRun when a session starts
    holdSecs:   parseInt(localStorage.getItem('sp_hold_secs') || '30'),  // default hold length

    // THE PLAN. Keyed by absolute date ('2026-07-21') so it never drifts.
    // Each day is an ORDERED LIST OF BLOCKS:
    //   { type:'lift'|'cardio'|'stretch'|'rest', id, role?, done?, adhoc? }
    // A block carries its own done flag, so the plan IS the log. There is no
    // parallel "done today" state to fall out of sync — it's all derived.
    plan:             JSON.parse(localStorage.getItem('sp_plan') || '{}'),
};

function save() {
    localStorage.setItem('sp_name',      S.userName);
    localStorage.setItem('sp_streak',    S.streak);
    localStorage.setItem('sp_prs_week',  S.prsThisWeek);
    localStorage.setItem('sp_plan',      JSON.stringify(S.plan));
    localStorage.setItem('sp_get_ready', S.getReady);
    localStorage.setItem('sp_countdown_beeps', S.countdownBeeps ? 'on' : 'off');
    localStorage.setItem('sp_sound_stretch', S.soundStretch);
    localStorage.setItem('sp_sound_run',     S.soundRun);
    localStorage.setItem('sp_hold_secs', S.holdSecs);
}

// ── DATES ─────────────────────────────────────────────────────────────────────
// Absolute keys. The old code keyed by (weekOffset * 14 + i), which shifted
// as time passed — anything planned ahead landed on the wrong day.
function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const todayKey = () => dateKey(new Date());

// ── BLOCKS ────────────────────────────────────────────────────────────────────
// A day is an ORDERED LIST. Order added = order shown = order you do it.
// No slots, no times — position in the list IS the sequence of your day.
function getBlocks(key)  { return S.plan[key] || []; }
function todayBlocks()   { return getBlocks(todayKey()); }
function setBlocks(key, blocks) {
    if (blocks.length) S.plan[key] = blocks; else delete S.plan[key];
    save();
}

// Matched stretch routines — the thread, applied at PLAN time.
const POST_STRETCH = {
    chest:'upper', back:'upper', shoulders:'upper', push:'upper', pull:'upper', upper:'upper',
    legs:'lower',  lower:'lower', fullbody:'full',
    walk:'lower',  run:'lower',   c25k:'lower',  c210k:'lower',
};
const preStretchFor  = id => isCardio(id) ? 'pre-run' : 'pre-lift';
const postStretchFor = id => POST_STRETCH[id] || 'full';

// A session arrives with its warm-up and cool-down attached.
function makeBlocks(id) {
    if (id === 'rest') return [{ type:'rest', id:'rest' }];
    const out = [];
    // A walk warms itself up — the first five minutes ARE the warm-up.
    // Adding drills before a stroll is ceremony, not preparation.
    if (id !== 'walk') out.push({ type:'stretch', id:preStretchFor(id), role:'warmup' });
    out.push({ type:SESSIONS[id].kind, id });
    out.push({ type:'stretch', id:postStretchFor(id), role:'cooldown' });
    return out;
}

// Always both stretches, every time. No guessing.
// Once order replaced slots, "the previous block is a stretch" stopped meaning
// "you just stretched" — it might be hours earlier. Predictable beats clever;
// ✕ is one tap.
function addBlocks(key, id) {
    setBlocks(key, [...getBlocks(key), ...makeBlocks(id)]);
}
function removeBlock(key, idx) {
    const b = [...getBlocks(key)]; b.splice(idx, 1); setBlocks(key, b);
}
// Reorder by one step. Boring, but it works with a thumb on a moving train.
function moveBlock(key, idx, dir) {
    const b = [...getBlocks(key)];
    const j = idx + dir;
    if (j < 0 || j >= b.length) return;
    [b[idx], b[j]] = [b[j], b[idx]];
    setBlocks(key, b);
}
function completeBlock(key, idx) {
    const b = [...getBlocks(key)];
    if (b[idx]) { b[idx] = { ...b[idx], done:true }; setBlocks(key, b); }
}
function logUnplanned(id, type) {
    const key = todayKey();
    setBlocks(key, [...getBlocks(key), { type, id, done:true, adhoc:true }]);
    return getBlocks(key).length - 1;
}
// Most weeks repeat. Copying a day is the difference between planning and chore.
function copyDay(fromKey, toKey) {
    setBlocks(toKey, getBlocks(fromKey).map(b => {
        const { done, adhoc, ...rest } = b; return rest;
    }));
}

// ── PROGRAM → PLAN ────────────────────────────────────────────────────────────
// A program is a template for filling the calendar. This turns any program —
// lift (repeats a weekly schedule) or run (week/day sessions) — into one flat,
// ordered list of session blocks, then lays them onto chosen weekdays.
function progIsRun(id)      { return !!RUN_PROGRAMS[id]; }
function progDisplayName(id){ return progIsRun(id) ? RUN_PROGRAMS[id].name : (PROGRAMS.find(p => p.id === id) || {}).name || id; }
function progPerWeek(id) {
    if (progIsRun(id)) return 3;
    const p = PROGRAMS.find(x => x.id === id); return p ? p.schedule.length : 3;
}
function progWeekCount(id) {
    if (progIsRun(id)) return RUN_PROGRAMS[id].weeks;
    const p = PROGRAMS.find(x => x.id === id);
    return p ? (parseInt(p.length) || 8) : 8;
}
function progFlatList(id) {
    const out = [];
    if (progIsRun(id)) {
        const wks = RUN_PROGRAMS[id].weeks;
        for (let w = 1; w <= wks; w++) for (let d = 1; d <= 3; d++)
            out.push({ type:'cardio', id, week:w, day:d });
    } else {
        const p = PROGRAMS.find(x => x.id === id); if (!p) return out;
        for (let w = 0; w < progWeekCount(id); w++)
            p.schedule.forEach(sid => out.push({ type: SESSIONS[sid].kind, id: sid }));
    }
    return out;
}
// Sensible default training weekdays for a given cadence (Mon-first feel).
function defaultTrainingDays(perWeek) {
    const map = { 1:[1], 2:[1,4], 3:[1,3,5], 4:[1,2,4,5], 5:[1,2,3,4,5], 6:[1,2,3,4,5,6], 7:[0,1,2,3,4,5,6] };
    const picks = map[perWeek] || map[3];
    return Array.from({ length:7 }, (_, i) => picks.includes(i));
}
// Lay the whole program onto the calendar from startISO, on the chosen weekdays.
// Sessions are appended (never overwrite a manually-planned day). Each carries
// prog:id so it reads as "from your program" and can be moved as one unit.
function applyProgramToPlan(id, startISO, dayFlags, withStretches) {
    const flat = progFlatList(id);
    if (!flat.length || !dayFlags.some(Boolean)) return 0;
    let d = new Date(startISO + 'T00:00:00'), placed = 0, guard = 0;
    while (placed < flat.length && guard < 1200) {
        guard++;
        if (dayFlags[d.getDay()]) {
            const key = dateKey(d), s = flat[placed], day = [...getBlocks(key)];
            // Lift sessions can bring their matched warm-up + cool-down; cardio never does.
            if (withStretches && SESSIONS[s.id] && SESSIONS[s.id].kind === 'lift') {
                day.push({ type:'stretch', id:preStretchFor(s.id), role:'warmup', prog:id });
                day.push({ ...s, prog:id });
                day.push({ type:'stretch', id:postStretchFor(s.id), role:'cooldown', prog:id });
            } else {
                day.push({ ...s, prog:id });
            }
            setBlocks(key, day);
            placed++;
        }
        d.setDate(d.getDate() + 1);
    }
    return placed;
}
// Move one block to another day, preserving everything (incl. run week/day).
function moveBlockToDay(fromKey, idx, toKey) {
    const blocks = [...getBlocks(fromKey)];
    if (idx < 0 || idx >= blocks.length) return;
    const [blk] = blocks.splice(idx, 1);
    setBlocks(fromKey, blocks);
    setBlocks(toKey, [...getBlocks(toKey), blk]);
}


// ── DERIVED STATE — no parallel flags, no sync bugs ───────────────────────────
const doneOf  = t => todayBlocks().find(b => b.type === t && b.done);
const liftDone    = () => !!doneOf('lift');
const cardioDone  = () => !!doneOf('cardio');
const stretchDone = () => !!doneOf('stretch');
// "Upper Body" the lift and "Upper Body" the stretch routine would sit in the
// same stack under the same name. Stretches are named by their ROLE instead.
function blockName(b) {
    if (b.type === 'rest') return 'Rest';
    if (b.type === 'stretch') {
        if (b.role === 'warmup')   return 'Warm-up';
        if (b.role === 'cooldown') return 'Cool-down';
        if (isCustomStretch(b.id))  return (customById(b.id) || {}).name || 'Custom routine';
        if (isAreaRoutine(b.id))    return areaRoutineName(b.id);
        if (isCollection(b.id))     return collectionName(b.id);
        return (STRETCH_PROGRAMS.find(p => p.id === b.id) || {}).name || b.id;
    }
    return (SESSIONS[b.id] || {}).name || b.id;
}
function lastLiftName()   { const b = doneOf('lift');   return b ? blockName(b) : null; }
function lastCardioId()   { const b = doneOf('cardio'); return b ? b.id : null; }

// ── HELPERS ───────────────────────────────────────────────────────────────────
function greeting() {
    const h = new Date().getHours();
    return h < 12 ? 'Good morning,' : h < 17 ? 'Good afternoon,' : 'Good evening,';
}

function getWeekDates(offset) {
    const today = new Date();
    const dow = today.getDay();
    const mon = new Date(today);
    mon.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1) + (offset * 7));
    return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(mon);
        d.setDate(mon.getDate() + i);
        return d;
    });
}

// The main (non-stretch) session planned for today, if any.
function getTodayScheduled() {
    const b = todayBlocks().find(x => x.type === 'lift' || x.type === 'cardio');
    return b ? { id:b.id, ...SESSIONS[b.id] } : null;
}


function blockMeta(b) {
    if (b.type === 'stretch') {
        if (b.role === 'warmup') return { icon:'🔥', accent:'stretch', meta:'Dynamic drills · ~5 min' };
        const r = routineFor(b);
        return { icon:'🧘', accent:'stretch', meta:`${r.length} stretches · ~${routineMinutes(r)} min` };
    }
    const s = SESSIONS[b.id] || {};
    if (b.type === 'rest')   return { icon:'😴', accent:'rest', meta:'Nothing planned' };
    if (b.type === 'cardio') return { icon:b.id === 'walk' ? '🚶' : '🏃', accent:'run', meta:`${s.muscles} · ~${s.time} min` };
    return { icon:'🏋️', accent:'lift', meta:`${s.muscles} · ${(s.exercises||[]).length} exercises · ~${s.time} min` };
}

function nextBlock() {
    const blocks = todayBlocks();
    const i = blocks.findIndex(b => !b.done && b.type !== 'rest');
    return i === -1 ? null : { block: blocks[i], idx: i };
}

function startBlock(idx) {
    const b = todayBlocks()[idx];
    if (!b || b.type === 'rest') return;
    if (b.type === 'lift')    return beginWorkout(b.id, idx);
    if (b.type === 'cardio')  return doStartRun(b.id, idx);
    if (b.type === 'stretch') return doStartStretch(b.id, idx);
}

// Today IS the day. A stack of blocks, in the order you put them there,
// coloured by what they are. Nothing else — no hero, no summary, no coaching.
function renderToday() {
    const h     = new Date().getHours();
    const greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    document.getElementById('greeting-name').textContent = `${greet}, ${S.userName}`;

    const blocks = todayBlocks();
    const next   = nextBlock();

    if (!blocks.length) {
        document.getElementById('today-body').innerHTML = `
            <div class="day-empty">
                <div class="day-empty-title">Nothing planned today</div>
                <div class="day-empty-body">Build your day and it shows up here.</div>
                <button class="hero-cta" style="background:var(--surface-mid);color:var(--text);" onclick="switchTab('plan')">Plan today</button>
            </div>`;
        return;
    }

    // Matched-stretch nudge: only when a workout's just been done and a cool-down fits.
    const ctx = getStretchContext();
    const showMatch = ctx.type === 'post-lift' || ctx.type === 'post-run';
    const matchBanner = showMatch ? `
        <div class="match-banner" onclick="doStartStretch('${ctx.type}')">
            <div class="match-icon">🧘</div>
            <div class="match-main">
                <div class="match-title">${ctx.label}</div>
                <div class="match-sub">A stretch matched to what you just did · ~8 min</div>
            </div>
            <div class="match-go">Start ›</div>
        </div>` : '';

    document.getElementById('today-body').innerHTML = matchBanner + blocks.map((b, i) => {
        const m      = blockMeta(b);
        const isNext = next && next.idx === i;
        return `
            <div class="blk blk--${m.accent} ${b.done ? 'blk--done' : ''} ${isNext ? 'blk--next' : ''}"
                 ${b.done || b.type === 'rest' ? '' : `onclick="startBlock(${i})"`}>
                <div class="blk-icon">${m.icon}</div>
                <div class="blk-main">
                    <div class="blk-name">${blockName(b)}</div>
                    <div class="blk-meta">${m.meta}</div>
                </div>
                <div class="blk-right">${b.done ? '<span class="blk-tick">✓</span>'
                                        : isNext ? '<span class="blk-go">Start</span>'
                                        : '<span class="blk-arrow">›</span>'}</div>
            </div>`;
    }).join('');
}

            <div class="prog-day-main">
                <div class="prog-day-name">${s ? s.name : sid}${isNext ? ' <span class="prog-day-tag">next</span>' : ''}</div>
                <div class="prog-day-sub">${s ? `${s.exercises.length} exercises · ~${s.time} min` : ''}</div>
            </div>
            <div class="sec-row-arrow">›</div>
        </div>`;
    }).join('');

    el.innerHTML = `<div class="today-body">
        <div style="font-size:12px;font-weight:600;color:${prog.below ? 'var(--warning)' : 'var(--success)'};margin-bottom:4px;">${prog.below ? '⚠ ' : '✓ '}${prog.freq}</div>
        <div style="font-size:13px;color:var(--text-sec);line-height:1.5;margin-bottom:16px;">${prog.desc}</div>

        <div class="sec-label">The week · ${prog.days}</div>
        ${days}

        <button class="btn btn-primary" style="width:100%;margin-top:18px;" onclick="openAddProgram('${prog.id}')">Add to plan</button>
        <div style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:10px;line-height:1.5;">Lays the whole program onto your calendar. Or just tap any day above to do that session now.</div>
    </div>`;
}
function startFromProgram(id, dayIdx) {
    const prog = PROGRAMS.find(p => p.id === id);
    if (prog) beginWorkout(prog.schedule[dayIdx]);
}

// ── START ─────────────────────────────────────────────────────────────────────
function renderLiftStart(el) {
    // Mirrors the Stretch landing: Programs (weekly plans) on top, then single
    // workouts and muscle groups as grids, then Custom/History as small buttons.
    const history = getLiftHistory();
    const customs = getCustomWorkouts();

    const tile = id => {
        const s = SESSIONS[id];
        if (!s) return '';
        return `<div class="area-tile area-tile--lift" onclick="beginWorkout('${id}')">
            <div class="area-name">${s.name}</div>
            <div class="area-count">${s.exercises.length} exercises</div>
        </div>`;
    };
    const progCard = prog => {
        const active = L.activeProgram === prog.id;
        return `<div class="prog-tile ${active?'prog-tile--active':''}" onclick="openProgramDetail('${prog.id}')">
            <div class="prog-tile-name">${prog.name}</div>
            <div class="prog-tile-days">${prog.days.replace('/week','')}</div>
            <div class="prog-tile-freq">${active ? '● Following' : '✓ ' + prog.freq.replace('Each muscle ','').replace(' a week','/wk')}</div>
        </div>`;
    };

    el.innerHTML = `<div class="today-body">
        <div class="sec-label" style="margin-top:2px;">Programs</div>
        <div style="font-size:11px;color:var(--text-muted);margin:-4px 0 10px;line-height:1.5;">A weekly plan — train each muscle group at least twice a week.</div>
        <div class="prog-row">${PROGRAMS.map(progCard).join('')}</div>

        <div class="sec-label" style="margin-top:22px;">Single workouts</div>
        <div class="wk-grid wk-grid--3">${['push','pull','upper','lower','fullbody','core'].map(tile).join('')}</div>

        <div class="sec-label" style="margin-top:22px;">By muscle group</div>
        <div class="wk-grid wk-grid--3">${['chest','back','arms','legs','shoulders','glutes'].map(tile).join('')}</div>

        <div class="mini-btn-row">
            <button class="mini-btn-wide" onclick="setLiftView('custom')">
                <span class="mini-btn-icon">✏️</span> Custom${customs.length ? ` · ${customs.length}` : ''}
            </button>
            <button class="mini-btn-wide" onclick="setLiftView('history')">
                <span class="mini-btn-icon">📊</span> History
            </button>
        </div>
    </div>`;
}
function renderLiftPrograms(el) {
    let html = '<div style="padding:16px 20px 32px;">';
    if (L.activeProgram) {
        const prog = PROGRAMS.find(p => p.id === L.activeProgram);
        const nextId = getNextProgramSession();
        const nextSess = nextId ? SESSIONS[nextId] : null;
        html += `<div class="prog-card prog-card--active" style="margin-bottom:16px;">
            <div class="prog-card-name">${prog.name}</div>
            <div class="prog-card-meta">${prog.days} · Week ${Math.floor(L.programDay/prog.schedule.length)+1}</div>
            ${nextSess ? `<div style="font-size:13px;color:var(--text-sec);">Next: <strong style="color:var(--text);">${nextSess.name}</strong></div>
            <div class="prog-card-progress">Day ${(L.programDay%prog.schedule.length)+1} of ${prog.schedule.length}</div>
            <button class="btn btn-primary" style="margin-top:12px;" onclick="L.sessionId='${nextId}';setLiftView('start')">Start next session →</button>` : ''}
        </div>
        <button class="btn btn-ghost" style="margin-bottom:20px;" onclick="L.activeProgram=null;renderLift()">Leave this program</button>`;
    }
    html += `<div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:10px;">${L.activeProgram?'Switch program':'Programs'}</div>`;
    PROGRAMS.forEach(prog => {
        const active = L.activeProgram === prog.id;
        html += `<div class="prog-card ${active?'prog-card--active':''}" onclick="selectProgram('${prog.id}')">
            <div class="prog-card-name">${prog.name}</div>
            <div class="prog-card-meta">${prog.days} · ${prog.length}</div>
            ${prog.freq ? `<div style="font-size:11px;font-weight:600;margin-top:4px;color:${prog.below?'var(--warning)':'var(--success)'};">${prog.below?'⚠ ':'✓ '}${prog.freq}</div>` : ''}
            <div class="prog-card-desc">${prog.desc}</div>
            ${prog.note ? `<div style="font-size:11px;color:var(--text-muted);margin-top:8px;padding-top:8px;border-top:0.5px solid var(--border);line-height:1.5;">${prog.note}</div>` : ''}
            ${active ? '<div class="prog-card-progress">Currently following ✓</div>' : ''}
        </div>`;
    });
    html += '</div>';
    el.innerHTML = html;
}

function selectProgram(id) {
    L.activeProgram = id;
    L.programDay    = 0;
    L.sessionId     = PROGRAMS.find(p => p.id === id).schedule[0];
    renderLift();
    toast(`${getProgramName(id)} selected`);
}

function getNextProgramSession() {
    if (!L.activeProgram) return null;
    const prog = PROGRAMS.find(p => p.id === L.activeProgram);
    return prog ? prog.schedule[L.programDay % prog.schedule.length] : null;
}

function getProgramName(id) {
    const p = PROGRAMS.find(p => p.id === id);
    return p ? p.name : id;
}

// ── CUSTOM ────────────────────────────────────────────────────────────────────
function renderLiftCustom(el) {
    const customs = getCustomWorkouts();
    let html = '<div style="padding:16px 20px 32px;">';
    html += `<button class="btn btn-primary" style="margin-bottom:20px;" onclick="openBuilder()">+ Build a new workout</button>`;
    if (customs.length === 0) {
        html += `<div class="empty"><div class="empty-icon">✏️</div><div class="empty-title">No custom workouts yet</div>
            <div class="empty-body">Build your own routine from the full library of 318 exercises. Choose your exercises, sets, reps and order.</div></div>`;
    } else {
        html += `<div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:10px;">Your workouts</div>`;
        customs.forEach(c => {
            html += `<div class="wk-card" onclick="beginWorkout('${c.id}')">
                <div class="wk-card-body"><div class="wk-card-name">${c.name}</div><div class="wk-card-meta">${c.exercises.length} exercises · last done ${c.lastDone||'never'}</div></div>
                <div class="wk-card-arrow">›</div></div>`;
        });
    }
    html += '</div>';
    el.innerHTML = html;
}

function getCustomWorkouts() {
    try { return JSON.parse(localStorage.getItem('sp_custom_workouts') || '[]'); } catch { return []; }
}
