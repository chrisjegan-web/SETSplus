               value="${CS_SEARCH.replace(/"/g,'&quot;')}" oninput="csSearch(this.value)">
        <div id="cs-library"></div>
    </div>`;
    renderLibraryList();
}

// The library list re-renders on its own so typing doesn't rebuild the whole screen
// (which would blur the search box on every keystroke).
function renderLibraryList() {
    const box = document.getElementById('cs-library');
    if (!box) return;
    const q = CS_SEARCH.trim();

    // Match on stretch name, target muscles, or the area the category belongs to.
    const catAreas = {};
    AREAS.forEach(a => a.cats.forEach(c => { (catAreas[c] = catAreas[c] || []).push(a.name.toLowerCase()); }));
    const matches = (cat, s) => {
        if (!q) return true;
        const hay = [s.n, displayName(s), s.t, cat, ...(catAreas[cat] || [])].join(' ').toLowerCase();
        return q.split(/\s+/).every(term => hay.includes(term));
    };

    const rows = STRETCH_ORDER.filter(c => STRETCH_POOL[c]).map(cat => {
        const hits = STRETCH_POOL[cat].filter(s => matches(cat, s));
        if (!hits.length) return '';
        return `<div class="sec-label" style="margin-top:14px;">${cat}</div>` + hits.map(s => {
            const key = cat + '|' + s.n;
            const on  = CS.picked.includes(key);
            const open = CS_OPEN === key;
            return `<div class="lib-item">
                <div class="sec-row ${on ? 'lib-row--on' : ''}" onclick="csToggle('${key.replace(/'/g,"\\'")}')">
                    <div class="sec-row-icon">${on ? '<span style="color:var(--success)">✓</span>' : '+'}</div>
                    <div class="sec-row-main">
                        <div class="sec-row-label">${displayName(s)}</div>
                        <div class="sec-row-sub">${s.t} · ${s.d}s${s.b ? ' each side' : ''}</div>
                    </div>
                    <button class="lib-info" onclick="csToggleInfo('${key.replace(/'/g,"\\'")}', event)">${open ? '×' : 'i'}</button>
                </div>
                ${open ? `<ol class="lib-steps">${s.i.map(x => `<li>${x}</li>`).join('')}</ol>` : ''}
            </div>`;
        }).join('');
    }).join('');

    box.innerHTML = rows || `<div class="sheet-empty" style="margin-top:14px;">No stretches match "${CS_SEARCH}"</div>`;
}

function renderStretchHistory(el) {
    const history = getStretchHistory();
    let html = '<div style="padding:16px 20px 32px;">';

        html += `<div class="empty"><div class="empty-icon">🧘</div><div class="empty-title">No sessions yet</div>
            <div class="empty-body">Your stretch sessions appear here after you complete them.</div></div>`;
    } else {
        history.forEach(h => {
            html += `<div class="hist-card">
                <div class="hist-card-row">
                    <div><div class="hist-card-name">${h.name}</div><div class="hist-card-date">${h.date} · ${h.duration} min</div></div>
                </div>
            </div>`;
        });
    }
    html += '</div>';
    el.innerHTML = html;
}

function getStretchHistory() {
    try { return JSON.parse(localStorage.getItem('sp_stretch_history_sessions') || '[]').slice(0,10); } catch { return []; }
}

// Start a stretch. A warm-up block goes to the dynamic drills; everything else
// gets the timed static routine, matched to whatever it's attached to.
function doStartStretch(id, blockIdx) {
    const block = (blockIdx !== undefined && blockIdx !== null) ? todayBlocks()[blockIdx] : null;

    if (block && block.role === 'warmup') {
        const blocks = todayBlocks();
        const nxt = blocks.slice(blockIdx + 1).find(b => b.type === 'lift' || b.type === 'cardio');
        if (nxt && WARMUPS[nxt.id]) return startWarmup(nxt.id, 'Warm-up', blockIdx);
        // No dynamic set for this session? Then no warm-up. Falling back to the
        // static pool would run 30s holds before a max effort — the exact thing
        // a warm-up must not do. Better to do nothing than the wrong thing.
        toast('No warm-up drills for this session yet');
        return;
    }

    const b = block || { id, role:null };
    const routine = routineFor(b);
    const title = block              ? blockName(block)
                : isCustomStretch(id) ? (customById(id) || {}).name || 'Custom routine'
                : isAreaRoutine(id)   ? areaRoutineName(id)
                : isCollection(id)    ? collectionName(id)
                : (STRETCH_PROGRAMS.find(p => p.id === id) || {}).name || 'Stretch';
    ST.stretchId = id;
    startStretchSession(routine, title, blockIdx);
}

// Deliberately small. Only things a person genuinely changes — timing and sound

    document.getElementById('screen-settings').classList.remove('active');

}
function setPref(key, val) { S[key] = val; save(); renderSettings(); }

    const seg = (key, opts) => `<div class="set-seg">${opts.map(o => {

    }).join('')}</div>`;

    document.getElementById('screen-settings').innerHTML = `
        <div class="st-top">

        </div>

            <div class="set-label" style="margin-top:22px;">Run sound</div>

            ${seg('soundRun', [{l:'Voice',v:'voice'},{l:'Tones',v:'tones'},{l:'Silent',v:'silent'}])}

            <div class="set-label" style="margin-top:22px;">Countdown ticks</div>

}

// ═══ STRETCH SESSION ══════════════════════════════════════════════════════════
// A cool-down is a TIMER. One stretch at a time, counts down, auto-advances.
// Bilateral stretches run the clock twice — once per side — because that's how
// the reviewed library defines them.
const ST = { active:false, routine:[], i:0, side:0, left:0, timer:null, paused:false, blockIdx:null };

function startStretchSession(routine, title, blockIdx) {
    if (!routine.length) { toast('No stretches found'); return; }
    S.sound = S.soundStretch;
    ST.active = true; ST.routine = routine; ST.i = 0; ST.side = 0;
    ST.blockIdx = (blockIdx === undefined) ? null : blockIdx;
    // Remember where we came from so the X / completion returns there, not always Today.
    ST.originTab = (blockIdx !== undefined && blockIdx !== null) ? 'today' : S.tab;
    ST.paused = false; ST.title = title;
    ST.phase = 'idle';   // waiting for the user to tap Begin
    noteShown(routine.map(s => s.n));
    document.getElementById('screen-stretch-session').classList.add('active');
    document.querySelector('.tab-bar').style.display = 'none';
    renderStretchSession();
}

// User taps Begin — now the first get-ready countdown starts.
function beginStretchRoutine() {
    loadStretch();
}



function loadStretch() {
    const s = ST.routine[ST.i];
    if (!s) return endStretchSession(true);
    ST.showSteps = false;   // start each stretch calm; user opens steps if they want
    if (S.getReady > 0) {
        // Get-ready lead-in: time to move into position.
        ST.phase = 'ready';
        ST.left = S.getReady;
    } else {
        // No lead-in configured — straight into the hold.
        ST.phase = 'hold';
        ST.left = S.holdSecs;
    }
    renderStretchSession();
    runStretchTimer();
}

function runStretchTimer() {
    clearInterval(ST.timer);
    ST.timer = setInterval(() => {
        if (ST.paused) return;

        // ── GET READY: count into the hold ──
        if (ST.phase === 'ready') {
            ST.left--;
            const el = document.getElementById('st-clock');
            if (el) el.textContent = ST.left > 0 ? ST.left : 'Go';
            if (ST.left > 0 && S.sound === 'tones') beep(660, 50);
            if (ST.left <= 0) {
                beep(880, 140);
                ST.phase = 'hold';
                ST.left = holdTotal();     // full duration (×2 for bilateral)
                renderStretchSession();
            }
            return;
        }

        // ── SWAP PAUSE: mid-bilateral, "switch sides" showing, brief hold before side 2 ──
        if (ST.phase === 'swap') {
            ST.left--;
            const el = document.getElementById('st-clock');
            if (el) el.textContent = ST.left > 0 ? ST.left : 'Go';
            if (ST.left > 0 && S.sound === 'tones') beep(660, 50);
            if (ST.left <= 0) {
                beep(880, 140);
                ST.phase = 'hold';
                ST.side = 1;
                ST.left = ST.holdRemain;    // resume side two's remaining time
                updateSwapOverlay(false);   // hide the swap message, resume ring
            }
            return;
        }

        // ── HOLD ──
        ST.left--;
        const s = ST.routine[ST.i];
        const total = holdTotal();
        const elapsed = total - ST.left;

        // Bilateral: at the exact halfway point, pause for the side switch.
        if (s.b && ST.side === 0 && elapsed >= S.holdSecs) {
            speak('Switch sides');
            beep(880, 200);
            ST.holdRemain = ST.left;                     // remember side-two's time
            ST.phase = 'swap';
            ST.left = S.getReady > 0 ? S.getReady : 3;   // brief count-in for the switch
            updateSwapOverlay(true);
            return;
        }

        // Update clock (show the current side's remaining time, not the combined)
        const el = document.getElementById('st-clock');
        if (el) {
            const sideLeft = s.b ? (ST.side === 0 ? ST.left - S.holdSecs : ST.left) : ST.left;
            el.textContent = fmtClock(Math.max(0, sideLeft));
        }
        // Ring sweeps continuously across the whole bilateral duration.
        const ring = document.getElementById('st-ring');
        if (ring) ring.style.strokeDashoffset = 339.3 * (1 - ST.left / total);

        if (ST.left <= 3 && ST.left > 0) beep(660, 60);
        if (ST.left <= 0) { beep(880, 180); nextStretch(); }
    }, 1000);
}

// Total hold time for the current stretch — doubled for bilateral (one continuous sweep).
function holdTotal() {
    const s = ST.routine[ST.i];
    return (s && s.b) ? S.holdSecs * 2 : S.holdSecs;
}

// Show/hide the "switch sides" message inside the ring without rebuilding the screen.
function updateSwapOverlay(show) {
    const ov = document.getElementById('st-swap-overlay');
    if (ov) ov.style.display = show ? 'flex' : 'none';
    const clock = document.getElementById('st-clock');
    if (clock) clock.style.opacity = show ? '0' : '1';
    // update the side label live
    const lbl = document.getElementById('st-side-label');
    if (lbl && !show) lbl.textContent = 'second side';
}

function nextStretch() {
    clearInterval(ST.timer);
    // Bilateral side-switching now happens inline within the hold (continuous ring),
    // so reaching here always means: move on to the next stretch.
    ST.side = 0; ST.i++;
    if (ST.i >= ST.routine.length) return endStretchSession(true);
    loadStretch();
}

function prevStretch() {
    clearInterval(ST.timer);
    // From a get-ready screen, Back goes to the previous stretch. From a hold,
    // first Back restarts the current stretch's get-ready.
    if (ST.phase === 'hold') { loadStretch(); return; }
    if (ST.side === 1) { ST.side = 0; } else if (ST.i > 0) { ST.i--; ST.side = 0; } else { loadStretch(); return; }
    loadStretch();
}

                    return `${canEasier ? `<button class="st-swap-btn" onclick="swapStretch('easier')">↓ Easier</button>` : ''}
                            <button class="st-swap-btn" onclick="swapStretch('any')">↺ Swap</button>

function toggleSteps() { ST.showSteps = !ST.showSteps; renderStretchSession(); }

// Impatient? Skip the get-ready and start the hold now.
function skipReady() {
    if (ST.phase !== 'ready') return;
    ST.phase = 'hold';
    ST.left = S.holdSecs;
    beep(880, 140);
    renderStretchSession();
}


// Alternatives for the same muscle, not already in this routine.
function altsFor(s) {
    return (STRETCH_POOL[s.cat] || []).filter(x =>
        x.n !== s.n && !isExcluded(x.k) && !ST.routine.some(r => r.n === x.n));
}

// Swap toward a target difficulty. 'easier' finds the gentlest option below the
// current one; 'deeper' the hardest above; 'any' just a different one.
// Now that the library has real depth, "this is too much today" has an answer.
// Tapping Swap / Easier / Deeper PROPOSES a replacement — it doesn't commit or
// auto-start. The user sees the pick and chooses Start / Try another / Keep original.
function swapStretch(dir) {
    const s = ST.routine[ST.i];
    const alts = altsFor(s);
    if (!alts.length) { toast('No other stretch for that muscle'); return; }
    clearInterval(ST.timer);
    ST.swapDir = dir || 'any';
    ST.swapOriginal = s;              // so "Keep original" can restore it
    ST.swapTried = [];                // pool of ones already shown, to cycle through
    proposeSwap();
}

// Pick the next candidate for the current direction, avoiding ones already tried.
function proposeSwap() {
    const s = ST.swapOriginal;
    const cur = s.diff || 1;
    let pool = altsFor(s).filter(x => !ST.swapTried.some(t => t.n === x.n));

    if (ST.swapDir === 'easier') pool = pool.filter(x => (x.diff||1) <= cur);
    if (ST.swapDir === 'deeper') pool = pool.filter(x => (x.diff||1) >= cur && x.n !== s.n);

    // If we've exhausted the directional pool, fall back to any remaining alternative.
    if (!pool.length) pool = altsFor(s).filter(x => !ST.swapTried.some(t => t.n === x.n));
    // If EVERYTHING'S been tried, cycle back to the full set rather than dead-ending
    // on "Try another" — the user can keep browsing round.
    if (!pool.length) {
        const full = altsFor(s);
        if (!full.length) {
            // Genuinely nothing (all excluded / already in routine): keep current view.
            if (!ST.swapProposal) { toast('No alternatives for that muscle'); keepOriginal(); }
            else toast('That\'s all of them — pick one or keep original');
            return;
        }
        ST.swapTried = [];   // start the cycle over
        pool = full;
    }

    let pick;
    if (ST.swapDir === 'easier') pick = pool.sort((a,b) => (b.diff||1)-(a.diff||1))[0];
    else if (ST.swapDir === 'deeper') pick = pool.sort((a,b) => (a.diff||1)-(b.diff||1))[0];
    else pick = pool.map(x => ({ x, sc: stretchScore(x.n) })).sort((a,b) => b.sc - a.sc)[0].x;

    ST.swapTried.push(pick);
    ST.swapProposal = pick;
    ST.phase = 'swapPick';
    renderStretchSession();
}

// User accepted the proposed swap.
function acceptSwap() {
    ST.routine[ST.i] = ST.swapProposal;
    ST.side = 0;
    noteShown([ST.swapProposal.n]);
    ST.swapProposal = null;
    loadStretch();                   // fresh get-ready into the new stretch
}

// Keep the original — resume exactly where we left off.
function keepOriginal() {
    ST.swapProposal = null;
    ST.phase = 'hold';
    renderStretchSession();
    runStretchTimer();               // resume the timer where ST.left is
}

// Don't like it, ever. Swap it out now and never suggest it again.
function excludeStretch() {
    const s = ST.routine[ST.i];
    addExclusion(s.k);
    toast(`${displayName(s)} won't be suggested again`);
    clearInterval(ST.timer);
    const alts = altsFor(s);   // altsFor already filters excluded, so s is gone
    if (!alts.length) { nextStretch(); return; }
    // Show the replacement rather than blind-loading it — same as Swap.
    ST.swapDir = 'any';
    ST.swapOriginal = s;
    ST.swapTried = [];
    proposeSwap();
}

function endStretchSession(completed) {
    clearInterval(ST.timer);
    ST.active = false;
    document.getElementById('screen-stretch-session').classList.remove('active');
    document.querySelector('.tab-bar').style.display = '';
    if (completed) {
        const hist = getStretchHistory();
        hist.unshift({ name:ST.title, date:new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}),
                       duration:routineMinutes(ST.routine) });
        localStorage.setItem('sp_stretch_history_sessions', JSON.stringify(hist.slice(0, 20)));
        if (ST.blockIdx !== null) completeBlock(todayKey(), ST.blockIdx);
        else                      logUnplanned(ST.stretchId || 'full', 'stretch');
        S.streak++;
        save();
        toast(`${ST.title} complete 🧘`);
    }
    switchTab(ST.originTab || 'today');
}

// ═══ WARM-UP SESSION ══════════════════════════════════════════════════════════
// NOT a timer. Dynamic drills are rep-based — you tick them off at your pace.
// Static holds before lifting reduce power output, so this is deliberately a
// different screen with different content.
const WU = { active:false, drills:[], done:[], blockIdx:null };

function startWarmup(sessionId, title, blockIdx) {
    const w = WARMUPS[sessionId];

}

function toggleDrill(i) { WU.done[i] = !WU.done[i]; renderWarmup(); }

function endWarmup(completed) {

function fmtClock(s) {
    const m = Math.floor(Math.max(0, s) / 60), r = Math.max(0, s) % 60;
    return `${m}:${String(r).padStart(2, '0')}`;
}

// Short tone at the end of a hold — you're looking at the floor, not the phone.
let _ac;
// Spoken cue via the browser's built-in speech synthesis. Only when sound = 'voice'.
// No files, works offline; voice quality is the device's own (good on iOS).
function speak(text) {
    if (S.sound !== 'voice') return;
    try {
        speechSynthesis.cancel();               // don't stack utterances
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.95; u.pitch = 1.0; u.volume = 1.0;
        speechSynthesis.speak(u);
    } catch (e) {}
}

function beep(freq, ms) {
    if (S.sound !== 'tones') return;
    try {
        _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
        const o = _ac.createOscillator(), g = _ac.createGain();
        o.connect(g); g.connect(_ac.destination);
        o.frequency.value = freq; o.type = 'sine';
        g.gain.setValueAtTime(0.18, _ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, _ac.currentTime + ms / 1000);
        o.start(); o.stop(_ac.currentTime + ms / 1000);
    } catch (e) {}
}

// Attention tone for runs — plays in Voice AND Tones (anything but Silent), so
// voice cues get a beep to grab your ears before the words land.
function runTone(freq, ms) {
    if (S.sound === 'silent') return;
    try {
        _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
        const o = _ac.createOscillator(), g = _ac.createGain();
        o.connect(g); g.connect(_ac.destination);
        o.frequency.value = freq; o.type = 'sine';
        g.gain.setValueAtTime(0.18, _ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, _ac.currentTime + ms / 1000);
        o.start(); o.stop(_ac.currentTime + ms / 1000);
    } catch (e) {}
}

// ── PLAN ──────────────────────────────────────────────────────────────────────
const DAY_NAMES   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function mondayOf(d) {
    const m = new Date(d); const dow = m.getDay();
    m.setDate(m.getDate() - (dow === 0 ? 6 : dow - 1)); m.setHours(0,0,0,0); return m;
}
// A continuous span of days: from the Monday of last week (a little history to
// scroll back through) out to at least 8 weeks ahead, extended to cover the
// furthest planned day (so an imported program is fully visible).
function planRange() {
    const today = new Date(); today.setHours(0,0,0,0);
    const start = mondayOf(today); start.setDate(start.getDate() - 7);
    let endMs = today.getTime() + 56 * 86400000;
    Object.keys(S.plan).forEach(k => {
        const t = new Date(k + 'T00:00:00').getTime();
        if (getBlocks(k).length && t > endMs) endMs = t;
    });
    const end = mondayOf(new Date(endMs)); end.setDate(end.getDate() + 6);   // finish the week
    const days = [];
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) days.push(new Date(d));
    return days;
}

function renderPlan(anchorToday) {
    const today    = new Date();
    const todayStr = today.toDateString();
    const days     = planRange();
    const monToday = mondayOf(today).getTime();

    let out = '', lastWeek = null;
    days.forEach(d => {
        const key     = dateKey(d);
        const wk      = Math.round((mondayOf(d).getTime() - monToday) / (7 * 86400000));
        if (wk !== lastWeek) {
            lastWeek = wk;
            const label = wk === 0 ? 'This week' : wk === 1 ? 'Next week' : wk === -1 ? 'Last week'
                        : `Week of ${d.getDate()} ${MONTH_SHORT[d.getMonth()]}`;
            out += `<div class="week-sep ${wk === 0 ? 'week-sep--now' : ''}">${label}</div>`;
        }
        const blocks  = getBlocks(key);
        const isToday = d.toDateString() === todayStr;
        const allDone = blocks.length > 0 && blocks.every(b => b.done || b.type === 'rest');

        const items = blocks.length ? blocks.map(b => {
            const m = blockMeta(b);
            const sub = (b.type === 'cardio' && b.week) ? `W${b.week} D${b.day}` : '';
            return `<div class="agenda-item ${b.done ? 'agenda-item--done' : ''}">
                <span class="agenda-item-icon">${m.icon}</span>
                <span class="agenda-item-name">${blockName(b)}</span>
                ${sub ? `<span class="agenda-item-sub">${sub}</span>` : ''}
            </div>`;
        }).join('') : `<div class="agenda-empty">+ Tap to add</div>`;

        out += `<div class="agenda-row ${isToday ? 'agenda-row--today' : ''} ${allDone && !isToday ? 'agenda-row--done' : ''}"${isToday ? ' id="plan-today"' : ''} onclick="openDaySheet('${key}')">
            <div class="agenda-date">
                <div class="agenda-dow ${isToday ? 'agenda-dow--today' : ''}">${DAY_NAMES[d.getDay()]}</div>
                <div class="agenda-num">${d.getDate()}</div>
            </div>
            <div class="agenda-items">${items}</div>
            ${allDone && !isToday ? '<div class="agenda-check">✓</div>' : ''}
        </div>`;
    });

    const screen = document.getElementById('screen-plan');
    const prevScroll = screen ? screen.scrollTop : 0;

    document.getElementById('plan-content').innerHTML = `
        <div class="agenda">${out}</div>
        <div class="plan-tools">
            <button class="mini-btn-wide" onclick="openRepeat(null,null)"><span class="mini-btn-icon">↻</span> Repeat a session across days</button>
            ${Object.keys(S.plan).length ? `<button class="plan-clear-link" onclick="openClearPlan()">Clear from plan…</button>` : ''}
        </div>`;

    // On open, land on today (past sits above, scrollable up). On in-place
    // re-renders (add/remove a block) keep the scroll where it was — don't snap.
    if (anchorToday) {
        const row = document.getElementById('plan-today');
        if (row && row.scrollIntoView) row.scrollIntoView({ block: 'start' });
    } else if (screen) {
        screen.scrollTop = prevScroll;
    }
}

// ── DAY SHEET — build the day ────────────────────────────────────────────────
// Tap a thing, it appends. That's it. Reorder with ▲▼ if you got it wrong,
// ✕ to drop it, "Copy from" to steal a day you already built.
// Day-sheet state: which sub-view is showing, and the pending matched-stretch offer.
let _suggestStretch = null, _sheetKey = null, _sheetView = 'menu', _cardioOpen = false, _moveIdx = -1, _blockActions = -1;
function openDaySheet(key) {
    if (key !== _sheetKey) {
        _sheetView = 'menu'; _cardioOpen = false; _blockActions = -1;
        if (!_suggestStretch || _suggestStretch.key !== key) _suggestStretch = null;

    disarmClear();

    const d = new Date(key + 'T00:00:00');
    const dayLabel = `${DAY_NAMES[d.getDay()]} ${d.getDate()} ${MONTH_SHORT[d.getMonth()]}`;

    let inner = '';

    if (_sheetView === 'lift') {
        const liftTile = id => SESSIONS[id] ? `<div class="area-tile area-tile--lift" onclick="addToDay('${key}','${id}')">
                <div class="area-name">${SESSIONS[id].name}</div>
                <div class="area-count">${SESSIONS[id].exercises.length} exercises</div>
            </div>` : '';
        inner = `<div class="sheet-sub-head"><button class="sheet-back" onclick="sheetBack()">←</button><div class="sheet-title">Add a lift</div></div>
            <div class="sec-label" style="margin-top:2px;">Programs</div>
            <div class="prog-row">${PROGRAMS.map(p => `<div class="prog-tile" onclick="closeDaySheet();openAddProgram('${p.id}','${key}')">
                <div class="prog-tile-name">${p.name}</div>
                <div class="prog-tile-days">${p.days.replace('/week','')}</div>
                <div class="prog-tile-freq">✓ ${p.freq.replace('Each muscle ','').replace(' a week','/wk')}</div>
            </div>`).join('')}</div>
            <div class="sec-label" style="margin-top:20px;">Single workouts</div>

    } else if (_sheetView === 'stretch') {
        inner = `<div class="sheet-sub-head"><button class="sheet-back" onclick="sheetBack()">←</button><div class="sheet-title">Add a stretch</div></div>
            <div class="chip-wrap">${STRETCH_PROGRAMS.map(p =>

    } else if (_sheetView === 'move') {
        const blk = getBlocks(key)[_moveIdx];
        inner = `<div class="sheet-sub-head"><button class="sheet-back" onclick="sheetBack()">←</button><div class="sheet-title">Move to…</div></div>`;
        if (!blk) { inner += `<div class="sheet-empty">Nothing to move.</div>`; }
        else {
            inner += `<div style="font-size:13px;color:var(--text-sec);margin-bottom:14px;">Move <strong style="color:var(--text);">${blockName(blk)}</strong> to:</div>`;
            const today = new Date(); today.setHours(0,0,0,0);
            for (let i = 0; i < 14; i++) {
                const dd = new Date(today); dd.setDate(today.getDate() + i);
                const tk = dateKey(dd);
                if (tk === key) continue;
                const n = getBlocks(tk).length;
                inner += `<div class="day-add-row" onclick="doMoveBlock('${key}','${tk}')">
                    <div class="day-add-icon">📅</div>
                    <div class="day-add-main"><div class="day-add-label">${DAY_NAMES[dd.getDay()]} ${dd.getDate()} ${MONTH_SHORT[dd.getMonth()]}</div></div>
                    <div class="day-add-arrow" style="font-size:12px;color:${n ? 'var(--text-muted)' : 'var(--success)'};">${n ? n + ' on' : 'empty'}</div>
                </div>`;
            }
        }
    } else if (_sheetView === 'copy') {
        const sources = Object.keys(S.plan).filter(k => k !== key && getBlocks(k).length).sort().reverse().slice(0, 8);
        inner = `<div class="sheet-sub-head"><button class="sheet-back" onclick="sheetBack()">←</button><div class="sheet-title">Copy a day</div></div>`;
        inner += sources.length
            ? `<div class="chip-wrap">${sources.map(k => {
                const dd = new Date(k + 'T00:00:00'); const n = getBlocks(k).length;
                return `<div class="add-chip" onclick="copyDay('${k}','${key}');sheetBack();renderPlan();renderToday();toast('Day copied')">

    } else {
        // ── MENU: the day's contents + a few calm category rows ──
        const blocks = getBlocks(key);
        const list = blocks.length ? blocks.map((b, i) => {
            const m = blockMeta(b);
            const open = _blockActions === i;
            const canRepeat = b.type === 'lift' || b.type === 'cardio';
            return `<div class="blk blk--${m.accent} blk--edit ${b.done ? 'blk--done' : ''} ${open ? 'blk--acting' : ''}">
                <div class="blk-row" onclick="toggleBlockActions(${i})">
                    <div class="blk-icon">${m.icon}</div>
                    <div class="blk-main"><div class="blk-name">${blockName(b)}</div><div class="blk-meta">${b.role ? 'Matched' : m.meta}</div></div>

                    <button class="blk-act" ${i === 0 ? 'disabled' : ''} onclick="moveBlock('${key}',${i},-1);openDaySheet('${key}');renderPlan();renderToday();">▲<span>Up</span></button>
                    <button class="blk-act" ${i === blocks.length-1 ? 'disabled' : ''} onclick="moveBlock('${key}',${i},1);openDaySheet('${key}');renderPlan();renderToday();">▼<span>Down</span></button>
                    <button class="blk-act blk-act--del" onclick="removeBlock('${key}',${i});openDaySheet('${key}');renderPlan();renderToday();">✕<span>Remove</span></button>
                </div>` : ''}
            </div>`;
        }).join('') : `<div class="sheet-empty">Nothing planned yet.</div>`;

        const suggest = _suggestStretch && _suggestStretch.key === key ? `
            <div class="stretch-suggest">
                <div class="stretch-suggest-text">Added <strong>${SESSIONS[_suggestStretch.id].name}</strong>. Add its matched warm-up &amp; cool-down stretch?</div>

        const row = (icon, label, sub, onclick) => `<div class="day-add-row" onclick="${onclick}">
            <div class="day-add-icon">${icon}</div>

            ${chip('walk','🚶')}${chip('run','🏃')}${chip('c25k','📈')}</div>` : '';

        const hasSources = Object.keys(S.plan).some(k => k !== key && getBlocks(k).length);

        inner = `<div class="sheet-head"><button class="sheet-nav" onclick="stepDay('${key}',-1)">‹</button><div class="sheet-title" style="flex:1;">${dayLabel}</div><button class="sheet-nav" onclick="stepDay('${key}',1)">›</button><button class="sheet-close" onclick="closeDaySheet()">✕</button></div>
            ${suggest}
            ${list}
            <div class="sec-label" style="margin-top:16px;">Add to this day</div>
            ${row('🏋️','Lift','12 workouts', `sheetGo('lift')`)}
            <div class="day-add-row" onclick="toggleCardio()">
                <div class="day-add-icon">🏃</div>
                <div class="day-add-main"><div class="day-add-label">Cardio</div><div class="day-add-sub">Walk · Run · C25K</div></div>
                <div class="day-add-arrow">${_cardioOpen ? '⌄' : '›'}</div>
            </div>
            ${cardioInline}
            ${row('🧘','Stretch','Programs &amp; routines', `sheetGo('stretch')`)}
            ${row('😴','Rest day','', `addToDay('${key}','rest')`)}
            ${hasSources ? row('📋','Copy another day','', `sheetGo('copy')`) : ''}
            ${blocks.length ? `<button class="btn btn-ghost" id="clear-day-btn" style="margin-top:16px;" onclick="clearDay('${key}')">Clear day</button>` : ''}`;
    }

    // Re-render by swapping the backdrop's contents while it stays mounted and
    // opaque — no teardown, no opacity fade, so no flash of the screen behind.
    // Only create + fade on the very first open.
    const sheetHTML = `<div class="sheet" onclick="event.stopPropagation()">${inner}</div>`;
    let sheet = document.getElementById('day-sheet');
    if (sheet) {
        sheet.innerHTML = sheetHTML;
    } else {
        sheet = document.createElement('div');
        sheet.id = 'day-sheet';
        sheet.className = 'sheet-backdrop';
        sheet.innerHTML = sheetHTML;
        sheet.onclick = closeDaySheet;
        document.body.appendChild(sheet);
        requestAnimationFrame(() => sheet.classList.add('sheet-backdrop--on'));
    }
}

// Sheet navigation — sub-screens keep each choice focused (one thing at a time).
function sheetGo(view) { _sheetView = view; openDaySheet(_sheetKey); }
function sheetBack() { _sheetView = 'menu'; _cardioOpen = false; openDaySheet(_sheetKey); }

// ── REPEAT A SESSION ACROSS WEEKDAYS ──────────────────────────────────────────
// "I walk every morning" / "weights Mon & Thu" — pick weekdays, fill a month.
let _rep = null;
function openRepeat(id, fromKey) {
    const days = [false,false,false,false,false,false,false];
    if (fromKey) days[new Date(fromKey + 'T00:00:00').getDay()] = true;
    _rep = { id: id || null, preset: !!id, days, stretches: id ? isLift(id) : false };
    closeDaySheet();
    renderRepeat();
}
function closeRepeat() { const s = document.getElementById('repeat-setup'); if (s) s.remove(); _rep = null; }
function repBack() { if (_rep.id && !_rep.preset) { _rep.id = null; renderRepeat(); } else closeRepeat(); }
function repSetId(id) { _rep.id = id; _rep.stretches = isLift(id); renderRepeat(); }
function repToggleDay(i) { _rep.days[i] = !_rep.days[i]; renderRepeat(); }
function repToggleStretch() { _rep.stretches = !_rep.stretches; renderRepeat(); }
function repApply() {
    const n = repeatFill(_rep.id, _rep.days, _rep.stretches);
    closeRepeat();
    switchTab('plan'); renderPlan(); renderToday();
    toast(n ? `Added to ${n} day${n === 1 ? '' : 's'}` : 'Pick at least one day');
}
// Fill the next ~4 weeks: on each chosen weekday, add the session (skipping days
// that already have it, so repeating twice doesn't double up). Lifts can bring
// their matched stretches; cardio never does.
function repeatFill(id, dayFlags, stretches) {
    if (!id || !dayFlags.some(Boolean)) return 0;
    const today = new Date(); today.setHours(0,0,0,0);
    let added = 0;
    for (let i = 0; i < 28; i++) {
        const d = new Date(today); d.setDate(today.getDate() + i);
        if (!dayFlags[d.getDay()]) continue;
        const key = dateKey(d), day = [...getBlocks(key)];
        if (day.some(b => b.id === id && b.type !== 'stretch')) continue;   // dedup
        if (stretches && isLift(id)) {
            day.push({ type:'stretch', id:preStretchFor(id), role:'warmup', rep:id });
            day.push({ type: SESSIONS[id].kind, id, rep:id });
            day.push({ type:'stretch', id:postStretchFor(id), role:'cooldown', rep:id });
        } else {
            day.push({ type: SESSIONS[id].kind, id, rep:id });
        }
        setBlocks(key, day);
        added++;
    }
    return added;
}
function renderRepeat() {
    let content;
    if (!_rep.id) {
        const chip = (sid, icon) => `<div class="add-chip" onclick="repSetId('${sid}')"><span>${icon}</span><span>${SESSIONS[sid].name}</span></div>`;
        const liftTile = sid => `<div class="area-tile area-tile--lift" onclick="repSetId('${sid}')">
            <div class="area-name">${SESSIONS[sid].name}</div><div class="area-count">${SESSIONS[sid].exercises.length} exercises</div></div>`;
        content = `<div class="sec-label">Cardio</div>
            <div class="chip-wrap">${chip('walk','🚶')}${chip('run','🏃')}</div>
            <div class="sec-label" style="margin-top:18px;">Lifts</div>
            <div class="wk-grid wk-grid--3">${['push','pull','upper','lower','fullbody','core','chest','back','arms','legs','shoulders','glutes'].map(liftTile).join('')}</div>`;
    } else {
        const id = _rep.id;
        const dayBtns = AP_DOW.map((lbl, i) => `<button class="ap-day ${_rep.days[i] ? 'ap-day--on' : ''}" onclick="repToggleDay(${i})">${lbl}</button>`).join('');
        const chosen = _rep.days.filter(Boolean).length;
        content = `<div class="ap-prog-card"><div class="ap-prog-name">${SESSIONS[id].name}</div><div class="ap-prog-meta">Repeats across the next 4 weeks</div></div>
            <div class="sec-label" style="margin-top:20px;">On these days</div>
            <div class="ap-days">${dayBtns}</div>
            <div class="ap-hint">Adds ${SESSIONS[id].name} to ${chosen} weekday${chosen === 1 ? '' : 's'} for the next month</div>
            ${isLift(id) ? `<div class="ap-toggle" onclick="repToggleStretch()"><div class="ap-toggle-main"><div class="ap-toggle-label">Matched stretches</div><div class="ap-toggle-sub">Warm-up before each, cool-down after</div></div><div class="ap-switch ${_rep.stretches ? 'ap-switch--on' : ''}">${_rep.stretches ? '✓' : ''}</div></div>` : ''}
            <button class="btn btn-primary" style="width:100%;margin-top:22px;" onclick="repApply()">Add to plan</button>`;
    }
    const body = `<div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-sub-head"><button class="sheet-back" onclick="repBack()">←</button><div class="sheet-title">Repeat a session</div></div>
        ${content}</div>`;
    let el = document.getElementById('repeat-setup');
    if (el) { el.innerHTML = body; return; }
    el = document.createElement('div');
    el.id = 'repeat-setup';
    el.className = 'sheet-backdrop';
    el.innerHTML = body;
    el.onclick = closeRepeat;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('sheet-backdrop--on'));
}

// ── CLEAR FROM PLAN ───────────────────────────────────────────────────────────
// Bulk-add (programs, repeats) needs a bulk-undo. Programs and repeats tag their
// blocks, so we can list them as groups and strip one cleanly — or reset it all.
function planGroups() {
    const g = {};
    Object.values(S.plan).forEach(bl => bl.forEach(b => {
        if (b.type === 'stretch') return;
        if (b.prog)      { const k = 'prog:' + b.prog; (g[k] = g[k] || { kind:'prog', id:b.prog, count:0 }).count++; }
        else if (b.rep)  { const k = 'rep:' + b.rep;   (g[k] = g[k] || { kind:'rep',  id:b.rep,  count:0 }).count++; }
    }));
    return Object.values(g);
}
function removeGroup(kind, id) {
    Object.keys(S.plan).forEach(key => setBlocks(key, getBlocks(key).filter(b => b[kind] !== id)));
    renderPlan(); renderToday();
    if (document.getElementById('clear-plan')) openClearPlan();
    toast('Removed from plan');
}
function clearAllPlan() {
    spConfirm('Clear your entire plan? Every planned day will be emptied.', 'Clear all', () => {
        S.plan = {}; save();
        closeClearPlan(); renderPlan(); renderToday(); toast('Plan cleared');
    });
}
function closeClearPlan() { const s = document.getElementById('clear-plan'); if (s) s.remove(); }
function openClearPlan() {
    const groups = planGroups();
    const rows = groups.length ? groups.map(gr => {
        const name = gr.kind === 'prog' ? progDisplayName(gr.id) : `${(SESSIONS[gr.id] || {}).name} · repeating`;
        const unit = gr.kind === 'prog' ? 'session' : 'day';
        return `<div class="clear-row">
            <div class="clear-row-main"><div class="clear-row-name">${name}</div><div class="clear-row-sub">${gr.count} ${unit}${gr.count > 1 ? 's' : ''} on the plan</div></div>
            <button class="clear-row-btn" onclick="removeGroup('${gr.kind}','${gr.id}')">Remove</button>
        </div>`;
    }).join('') : `<div class="sheet-empty">No programs or repeats to remove.</div>`;
    const body = `<div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-sub-head"><button class="sheet-back" onclick="closeClearPlan()">←</button><div class="sheet-title">Clear from plan</div></div>
        <div class="sec-label">Programs &amp; repeats</div>
        ${rows}
        <div class="sec-label" style="margin-top:24px;">Everything</div>
        <button class="btn btn-ghost clear-all-btn" onclick="clearAllPlan()">Clear entire plan</button>
        <div style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:10px;">Empties every planned day. Can’t be undone.</div>
    </div>`;
    let el = document.getElementById('clear-plan');
    if (el) { el.innerHTML = body; return; }
    el = document.createElement('div');
    el.id = 'clear-plan';
    el.className = 'sheet-backdrop';
    el.innerHTML = body;
    el.onclick = closeClearPlan;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('sheet-backdrop--on'));
}

// Step to the previous/next day without leaving the day view — plan a whole week
// in one flow, then close to see it all on the Plan list.
function stepDay(key, dir) {
    const d = new Date(key + 'T00:00:00'); d.setDate(d.getDate() + dir);
    openDaySheet(dateKey(d));
}
function doMoveBlock(fromKey, toKey) {
    const dd = new Date(toKey + 'T00:00:00');
    moveBlockToDay(fromKey, _moveIdx, toKey);
    _moveIdx = -1; _sheetView = 'menu';
    openDaySheet(fromKey); renderPlan(); renderToday();

}

// Adding a session no longer auto-attaches stretches — instead we SUGGEST the
// matched ones, so the pairing is offered, not imposed. Rest is just rest.
function addToDay(key, id) {
    if (id === 'rest') {
        addBlocks(key, id);
        _suggestStretch = null;
    } else {
        setBlocks(key, [...getBlocks(key), { type: SESSIONS[id].kind, id }]);
        // Matched stretches are a lifting thing. Walks warm themselves; runs carry
        // their warm-up/cool-down inside the session. So only lifts get the prompt.
        _suggestStretch = isLift(id) ? { key, id } : null;
    }
    _sheetView = 'menu'; _cardioOpen = false;   // adding returns you to the day
    openDaySheet(key); renderPlan(); renderToday();
}
// Accept: bookend the just-added session with its matched warm-up (before) and
// cool-down (after). Walks warm themselves, so they only get a cool-down.
function acceptStretchSuggest(key) {
    if (!_suggestStretch || _suggestStretch.key !== key) return;
    const id = _suggestStretch.id;
    const blocks = [...getBlocks(key)];
    let si = -1;
    for (let i = blocks.length - 1; i >= 0; i--) {
        if (blocks[i].id === id && blocks[i].type !== 'stretch' && !blocks[i].role) { si = i; break; }
    }
    if (si >= 0) {
        blocks.splice(si + 1, 0, { type:'stretch', id:postStretchFor(id), role:'cooldown' });
        if (id !== 'walk') blocks.splice(si, 0, { type:'stretch', id:preStretchFor(id), role:'warmup' });
        setBlocks(key, blocks);
    }
    _suggestStretch = null;
    openDaySheet(key); renderPlan(); renderToday();
}
function dismissStretchSuggest(key) {
    _suggestStretch = null;
    openDaySheet(key);
}
function addStretchToDay(key, id) {
    setBlocks(key, [...getBlocks(key), { type:'stretch', id }]);
    _sheetView = 'menu';
    openDaySheet(key); renderPlan(); renderToday();
}

function closeDaySheet() {
    const s = document.getElementById('day-sheet');
    if (s) s.remove();
    _suggestStretch = null; _sheetKey = null; _sheetView = 'menu'; _cardioOpen = false; _blockActions = -1;
    disarmClear();
}

// ── ADD PROGRAM TO PLAN — setup (start date + training weekdays) ───────────────

        ${!progIsRun(id) ? `<div class="ap-toggle" onclick="apToggleStretch()">

    </div>`;

    // Swap in place when already open (toggling days/stretch) — no flash.

    el = document.createElement('div');
    el.id = 'add-program';
    el.className = 'sheet-backdrop';

// ── Clearing a day is rare and unrecoverable, so it costs a deliberate tap.
// Everywhere else we strip taps out; here we put one back. The rule isn't
// "fewer taps", it's "the right taps" — and destructive + frictionless is wrong.
let _clearArmed = null, _clearTimer = null;

function disarmClear() {
    _clearArmed = null;
    clearTimeout(_clearTimer);
}

function clearDay(key) {
    if (_clearArmed === key) {
        disarmClear();
        setBlocks(key, []);
        openDaySheet(key); renderPlan(); renderToday();
        toast('Day cleared');
        return;
    }
    _clearArmed = key;
    const btn = document.getElementById('clear-day-btn');
    if (btn) { btn.textContent = 'Tap again to clear'; btn.classList.add('btn-danger'); }
    // Don't leave it armed — walking away should not leave a loaded gun.
    clearTimeout(_clearTimer);
    _clearTimer = setTimeout(() => {
        _clearArmed = null;
        const b = document.getElementById('clear-day-btn');
        if (b) { b.textContent = 'Clear day'; b.classList.remove('btn-danger'); }
    }, 3000);
}

// ── TABS ──────────────────────────────────────────────────────────────────────
const TABS = ['today','lift','run','stretch','plan'];

function switchTab(id) {
    TABS.forEach(t => {
        document.getElementById('screen-' + t).classList.toggle('active', t === id);
        document.getElementById('tab-' + t).classList.toggle('active', t === id);
    });
    S.tab = id;
    if (id === 'today')   renderToday();
    if (id === 'lift')    renderLift();
    if (id === 'run')     renderRun();
    if (id === 'stretch') renderStretch();
    if (id === 'plan')    renderPlan(true);
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let _toastT;
function toast(msg) {
    let el = document.getElementById('sp-toast');
    if (!el) {
        el = document.createElement('div');
        el.id = 'sp-toast';
        Object.assign(el.style, {
            position:'fixed', bottom:'80px', left:'50%', transform:'translateX(-50%)',
            background:'#1a2240', border:'1px solid rgba(255,255,255,0.12)',
            color:'white', padding:'10px 18px', borderRadius:'20px',
            fontSize:'13px', fontWeight:'600', zIndex:'9999',
            pointerEvents:'none', whiteSpace:'nowrap', transition:'opacity 0.25s',
            fontFamily:'-apple-system,sans-serif'
        });
        document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(_toastT);
    _toastT = setTimeout(() => { el.style.opacity = '0'; }, 2400);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
    switchTab('today');
    runSplash();
});

// Restores V1's opening flourish: SETS letters emerge right-to-left, then the +
// jumps and settles with an elastic bounce and a soft click as it lands.
function runSplash() {
    const mark = document.getElementById('splash-mark');
    const plus = document.getElementById('sp-plus');
    const tag  = document.getElementById('splash-tag');
    const splash = document.getElementById('splash');
    if (!mark || !plus || !splash) { if (splash) splash.classList.add('hidden'); return; }

    setTimeout(() => mark.classList.add('go'), 80);          // letters emerge
    setTimeout(() => plus.classList.add('go'), 760);         // plus jumps
    setTimeout(() => {                                       // plus lands
        splashClick();
        plus.classList.add('glow');
        tag.classList.add('go');
    }, 1130);
    setTimeout(() => splash.classList.add('hidden'), 2000);  // fade out after it settles
}

// Soft "thock" as the + lands — short, low, and quiet. Respects sound settings:
// silent stays silent. Uses its own context so it never blocks the boot.
function splashClick() {
    if (S.soundStretch === 'silent' && S.soundRun === 'silent') return;  // both off → stay quiet
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine'; o.frequency.setValueAtTime(320, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.09);
        g.gain.setValueAtTime(0.14, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.11);
        o.start(); o.stop(ctx.currentTime + 0.12);
    } catch (e) {}
}
</script>
