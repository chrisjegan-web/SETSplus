// Parse the compact library into objects the picker + session engine use.
const EXLIB = [];
Object.keys(EX_RAW).forEach(cat => {
    EX_RAW[cat].split(';').forEach(row => {
        const [name,equip,mus,w,r,s,rest,note] = row.split('|');
        EXLIB.push({ name, cat, equip, muscles:(mus||'').split(',').join(' · '),
            weight:+w, reps:+r, sets:+s, rest:+rest, caution:note || '' });
    });
});
const EX_CATS = Object.keys(EX_RAW);

// ── CUSTOM WORKOUT BUILDER ────────────────────────────────────────────────────
// Deliberately calm: the picker shows nothing until you search or pick a category,
// then it's one clean list; naming/tuning happens on a separate review screen.
const B = { items: [], name: '', q: '', cat: 'All', screen: 'pick' };
function saveCustomWorkouts(list) { localStorage.setItem('sp_custom_workouts', JSON.stringify(list)); }

function openBuilder() {
    B.items = []; B.name = ''; B.q = ''; B.cat = 'All'; B.screen = 'pick';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-builder').classList.add('active');
    document.querySelector('.tab-bar').style.display = 'none';
    renderBuilder();
}
function closeBuilder() {
    document.getElementById('screen-builder').classList.remove('active');
    document.querySelector('.tab-bar').style.display = '';
    L.view = 'custom';
    switchTab('lift');
}
function renderBuilder() { B.screen === 'review' ? renderBuilderReview() : renderBuilderPick(); }

function bdInWorkout(name) { return B.items.some(it => it.name === name); }

function bdListHtml() {
    // Progressive disclosure — no wall of 318 until they've asked for something.
    if (B.q.trim() === '' && B.cat === 'All')
        return `<div class="bd-hint">Search by exercise or muscle above,<br>or tap a category to browse.</div>`;
    const q = B.q.trim().toLowerCase();
    let h = '', count = 0;
    EXLIB.forEach((e, idx) => {
        if (B.cat !== 'All' && e.cat !== B.cat) return;
        if (q && !e.name.toLowerCase().includes(q) && !e.muscles.toLowerCase().includes(q)) return;
        count++;
        const on = bdInWorkout(e.name);
        h += `<div class="bd-row">
            <div style="flex:1;min-width:0;">
                <div class="bd-name">${e.name}${e.caution ? ` <span onclick="bdCaution(${idx})" style="color:var(--primary);cursor:pointer;">\u26a0</span>` : ''}</div>
                <div class="bd-sub">${e.muscles} · <span style="color:${e.equip === 'Bodyweight' ? 'var(--success)' : 'var(--primary)'};">${e.equip}</span></div>
            </div>
            <button class="bd-add ${on ? 'bd-add--on' : ''}" onclick="bdToggle(${idx})">${on ? '\u2713 Added' : '+ Add'}</button>
        </div>`;
    });
    const qq = B.q.trim();
    if (qq && !EXLIB.some(e => e.name.toLowerCase() === qq.toLowerCase()) && !bdInWorkout(qq)) {
        h += `<div class="bd-row"><div style="flex:1;min-width:0;"><div class="bd-name" style="color:var(--text-sec);">Add \u201c${qq}\u201d</div><div class="bd-sub">Your own exercise</div></div>
            <button class="bd-add" onclick="bdAddCustomFromInput()">+ Add</button></div>`;
    } else if (!count) {
        h += `<div class="bd-hint">Nothing matches.</div>`;
    }
    return h;
}

function renderBuilderPick() {
    const el = document.getElementById('screen-builder');
    const cats = ['All', ...EX_CATS];
    const pills = cats.map(c => `<button class="bd-pill ${c === B.cat ? 'bd-pill--on' : ''}" onclick="bdFilter('${c}')">${c}</button>`).join('');
    el.innerHTML = `
        <div class="bd-head">
            <button class="bd-head-btn" style="left:14px;" onclick="closeBuilder()">\u2715</button>
            <div class="bd-head-title">Build workout</div>
        </div>
        <div style="padding:4px 16px 10px;flex:0 0 auto;">
            <input class="bd-search" id="bd-q" placeholder="Search ${EXLIB.length} exercises\u2026" value="${B.q}" oninput="bdSearch(this.value)">
        </div>
        <div class="bd-pills" id="bd-pills">${pills}</div>
        <div class="bd-list" id="bd-list">${bdListHtml()}</div>
        <div class="bd-foot">${bdFootHtml()}</div>`;
}

function bdFootHtml() {
    const n = B.items.length;
    return `<button class="btn" id="bd-review" ${n ? '' : 'disabled'} style="width:100%;border:none;font-weight:700;background:${n ? 'var(--primary)' : 'var(--surface-mid)'};color:${n ? '#0A0E27' : 'var(--text-muted)'};" ${n ? 'onclick="bdGoReview()"' : ''}>${n ? `Review &amp; save (${n}) \u2192` : 'Add exercises to continue'}</button>`;
}
function bdUpdateFoot() { const f = document.getElementById('bd-review'); if (f) f.parentElement.innerHTML = bdFootHtml(); }

function bdSearch(v) { B.q = v; document.getElementById('bd-list').innerHTML = bdListHtml(); bdUpdateFoot(); }
function bdFilter(c) { B.cat = c; renderBuilderPick(); }
function bdCaution(idx) { const e = EXLIB[idx]; if (e && e.caution) toast(e.caution); }
function bdToggle(idx) {
    const e = EXLIB[idx];
    const k = B.items.findIndex(it => it.name === e.name);
    if (k >= 0) B.items.splice(k, 1);
    else B.items.push({ name:e.name, muscles:e.muscles, sets:e.sets, reps:e.reps, weight:e.weight, isBodyweight: e.equip === 'Bodyweight' || e.weight === 0 });
    document.getElementById('bd-list').innerHTML = bdListHtml();
    bdUpdateFoot();
}
function bdAddCustomFromInput() {
    const q = B.q.trim();
    if (q && !bdInWorkout(q)) B.items.push({ name:q, muscles:'Custom', sets:3, reps:10, weight:0, isBodyweight:false });
    B.q = '';
    renderBuilderPick();
}
function bdGoReview() { B.screen = 'review'; renderBuilder(); }
function bdBackToPick() { B.screen = 'pick'; renderBuilder(); }
function bdSetName(v) { B.name = v; }

function renderBuilderReview() {
    const el = document.getElementById('screen-builder');
    let cards = '';
    B.items.forEach((x, i) => {
        const wStat = x.isBodyweight
            ? `<div class="bd-stat"><div class="bd-statv">BW</div></div>`
            : `<div class="bd-stat"><button class="bd-stepbtn" onclick="bdStep(${i},'weight',-2.5)">\u2212</button><div><div class="bd-statv">${x.weight}</div><div class="bd-statl">kg</div></div><button class="bd-stepbtn" onclick="bdStep(${i},'weight',2.5)">+</button></div>`;
        cards += `<div class="bd-card">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;">
                <div style="flex:1;min-width:0;font-size:15px;font-weight:700;color:var(--text);">${x.name}</div>
                ${i > 0 ? `<button class="bd-head-btn" style="position:static;font-size:15px;" onclick="bdMove(${i},-1)">\u2191</button>` : ''}
                ${i < B.items.length - 1 ? `<button class="bd-head-btn" style="position:static;font-size:15px;" onclick="bdMove(${i},1)">\u2193</button>` : ''}
                <button class="bd-head-btn" style="position:static;font-size:17px;" onclick="bdRemove(${i})">\u2715</button>
            </div>
            <div class="bd-sub" style="margin-bottom:10px;">${x.muscles}</div>
            <div style="display:flex;gap:8px;">
                <div class="bd-stat"><button class="bd-stepbtn" onclick="bdStep(${i},'sets',-1)">\u2212</button><div><div class="bd-statv">${x.sets}</div><div class="bd-statl">sets</div></div><button class="bd-stepbtn" onclick="bdStep(${i},'sets',1)">+</button></div>
                <div class="bd-stat"><button class="bd-stepbtn" onclick="bdStep(${i},'reps',-1)">\u2212</button><div><div class="bd-statv">${x.reps}</div><div class="bd-statl">reps</div></div><button class="bd-stepbtn" onclick="bdStep(${i},'reps',1)">+</button></div>
                ${wStat}
            </div>
        </div>`;
    });
    el.innerHTML = `
        <div class="bd-head">
            <button class="bd-head-btn" style="left:14px;" onclick="bdBackToPick()">\u2190</button>
            <div class="bd-head-title">Review &amp; save</div>
        </div>
        <div class="bd-list" style="padding:8px 16px 0;">
            <input class="bd-search" style="font-weight:600;margin-bottom:14px;" placeholder="Name your workout" value="${B.name}" oninput="bdSetName(this.value)">
            <div style="font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;">${B.items.length} exercise${B.items.length > 1 ? 's' : ''}</div>
            ${cards}
        </div>
        <div class="bd-foot">
            <button class="btn" style="width:100%;background:var(--success);color:#0A0E27;border:none;font-weight:700;" onclick="saveBuilderWorkout()">Save workout</button>
        </div>`;
}

function bdStep(i, field, delta) {
    const x = B.items[i];
    if (field === 'sets')   x.sets   = Math.max(1, x.sets + delta);
    if (field === 'reps')   x.reps   = Math.max(1, x.reps + delta);
    if (field === 'weight') x.weight = Math.max(0, Math.round((x.weight + delta) * 10) / 10);
    renderBuilderReview();
}
function bdMove(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= B.items.length) return;
    const t = B.items[i]; B.items[i] = B.items[j]; B.items[j] = t;
    renderBuilderReview();
}
function bdRemove(i) {
    B.items.splice(i, 1);
    B.items.length ? renderBuilderReview() : bdBackToPick();
}
function saveBuilderWorkout() {
    if (!B.items.length) { toast('Add at least one exercise'); return; }
    const name = B.name.trim() || 'My workout';
    const list = getCustomWorkouts();
    list.unshift({ id: 'cw_' + Date.now(), name, exercises: B.items.map(x => ({ ...x })), lastDone: null });
    saveCustomWorkouts(list);
    toast('Workout saved \u2713');
    closeBuilder();
}


// ── HISTORY ───────────────────────────────────────────────────────────────────
function renderLiftHistory(el) {
    const history = getLiftHistory();
    let html = '<div style="padding:16px 20px 32px;">';
    if (history.length === 0) {
        html += `<div class="empty"><div class="empty-icon">📊</div><div class="empty-title">No sessions yet</div>
            <div class="empty-body">Your completed sessions appear here — every exercise, set and weight. Useful before a session to know what you did last time.</div></div>`;
    } else {
        html += `<div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:10px;">Recent sessions</div>`;
        history.forEach(h => {
            html += `<div class="hist-card">
                <div class="hist-card-row">
                    <div><div class="hist-card-name">${h.name}</div><div class="hist-card-date">${h.date} · ${h.duration} min · ${h.sets} sets</div></div>
                    <span style="color:var(--text-muted);font-size:16px;">›</span>
                </div>
                <div class="hist-card-exercises">${h.exercises ? h.exercises.map(e=>e.name).join(' · ') : ''}</div>
                ${h.prs > 0 ? `<div style="font-size:11px;color:var(--warning);margin-top:6px;font-weight:600;">🏆 ${h.prs} PR${h.prs>1?'s':''}</div>` : ''}
            </div>`;
        });
    }
    html += '</div>';
    el.innerHTML = html;
}

function getLiftHistory() {
    try { return JSON.parse(localStorage.getItem('sp_lift_history') || '[]').slice(0,10); } catch { return []; }
}

// ── WORKOUT TRACKING ──────────────────────────────────────────────────────────
function beginWorkout(sessionId, blockIdx) {
    W.blockIdx = (blockIdx === undefined) ? null : blockIdx;
    const sess = SESSIONS[sessionId] || getCustomWorkouts().find(c => c.id === sessionId);
    if (!sess) { toast('Session not found'); return; }

    W.active    = true;
    W.started   = false;          // clock waits for an explicit Start
    W.openEx    = 0;              // accordion opens on the first exercise
    W.sessionId = sessionId;
    W.startTime = null;
    W.exercises = sess.exercises.map(ex => ({
        ...ex,
        sets: Array.from({ length:ex.sets }, () => ({ weight:ex.weight, reps:ex.reps, done:false }))
    }));

    document.querySelector('.tab-bar').style.display = 'none';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-workout').classList.add('active');

    document.getElementById('wk-name').textContent = sess.name;
    clearInterval(W.timerInterval);
    const t = document.getElementById('wk-timer');
    if (t) t.textContent = 'Ready';     // honest: nothing is being timed yet
    renderWorkoutBody();
    renderWorkoutFoot();
}

// Explicit start — you land on the workout, look it over, adjust weights, then begin.
function startWorkoutNow() {
    if (W.started) return;
    W.started   = true;
    W.startTime = Date.now();
    startWTimer();
    renderWorkoutFoot();
}

function renderWorkoutFoot() {
    const f = document.getElementById('wk-foot');
    if (!f) return;
    f.innerHTML = W.started ? '' :
        `<button class="btn btn-primary" style="width:100%;" onclick="startWorkoutNow()">Start workout</button>`;
}

function startWTimer() {
    clearInterval(W.timerInterval);
    W.timerInterval = setInterval(() => {
        const e = Math.floor((Date.now() - W.startTime) / 1000);
        const el = document.getElementById('wk-timer');
        if (el) el.textContent = `${Math.floor(e/60)}:${String(e%60).padStart(2,'0')}`;
    }, 1000);
}

function renderWorkoutBody() {
    const body = document.getElementById('wk-body');
    if (!body) return;
    const total = W.exercises.length;
    // keep openEx pointing at something sensible
    if (W.openEx == null || W.openEx < 0 || W.openEx >= total) W.openEx = 0;

    let html = '';
    W.exercises.forEach((ex, ei) => {
        const exDone = ex.sets.every(s => s.done);
        const open   = ei === W.openEx;

        if (!open) {
            // Collapsed one-liner: number/✓, name (struck through if done), target on the right.
            const target = ex.isBodyweight ? `${ex.sets.length} × ${ex.reps}` : `${ex.sets.length} × ${ex.reps}`;
            html += `<div class="ex-collapsed ${exDone ? 'ex-collapsed--done' : ''}" onclick="openExercise(${ei})">
                <div class="ex-dot ${exDone ? 'ex-dot--done' : ''}">${exDone ? '✓' : ei+1}</div>
                <div class="ex-collapsed-name">${ex.name}</div>
                <div class="ex-collapsed-right">${exDone ? '✓' : target}</div>
            </div>`;
            return;
        }

        // Expanded block
        html += `<div class="ex-block ex-block--open ${exDone ? 'ex-block--done' : ''}">
            <div class="ex-number">Exercise ${ei+1} of ${total}</div>
            <div class="ex-name">${ex.name}</div>
            <div class="ex-meta">${ex.muscles}</div>
            <div class="set-cols ${ex.isBodyweight ? 'set-cols--bw' : ''}">
                <div></div>${ex.isBodyweight ? '' : '<div class="set-col-h">KG</div>'}<div class="set-col-h">REPS</div><div></div>
            </div>`;
        ex.sets.forEach((set, si) => {
            if (set.done) {
                html += `<div class="set-row set-row--done">
                    <div class="wk-set-label wk-set-label--done">Set ${si+1}</div>
                    <div class="set-done-display">${ex.isBodyweight ? `${set.reps} reps` : `${set.weight}kg × ${set.reps}`}</div>
                    <button class="set-done-btn set-done-btn--done" onclick="undoSet(${ei},${si})">✓</button>
                </div>`;
            } else {
                html += `<div class="set-row ${ex.isBodyweight ? 'set-row--bw' : ''}">
                    <div class="wk-set-label">Set ${si+1}</div>
                    ${!ex.isBodyweight ? `
                    <div class="set-val-group">
                        <button class="set-adj-btn" onpointerdown="holdStep(event,'W',${ei},${si},-0.5)">−</button>
                        <input class="set-input" id="w-${ei}-${si}" type="number" value="${set.weight}" step="0.5" min="0" onchange="setW(${ei},${si},this.value)">
                        <button class="set-adj-btn" onpointerdown="holdStep(event,'W',${ei},${si},0.5)">+</button>
                    </div>` : ''}
                    <div class="set-val-group">
                        <button class="set-adj-btn" onpointerdown="holdStep(event,'R',${ei},${si},-1)">−</button>
                        <input class="set-input" id="r-${ei}-${si}" type="number" value="${set.reps}" min="1" onchange="setR(${ei},${si},this.value)">
                        <button class="set-adj-btn" onpointerdown="holdStep(event,'R',${ei},${si},1)">+</button>
                    </div>
                    <button class="set-done-btn" onclick="doneSet(${ei},${si})">✓</button>
                </div>`;
            }
        });

        // Manual advance: finishing the last set reveals a "complete" bar with Next —
        // nothing moves on its own, so you can rest, stretch, get a drink, come back.
        if (exDone) {
            const nextUnfinished = W.exercises.findIndex((e, k) => k !== ei && !e.sets.every(s => s.done));
            html += `<div class="ex-complete">
                <span class="ex-complete-tick">✓</span>
                <span class="ex-complete-label">${ex.name} complete</span>
                ${nextUnfinished >= 0
                    ? `<button class="ex-next-btn" onclick="nextExercise()">Next exercise →</button>`
                    : `<button class="ex-next-btn ex-next-btn--finish" onclick="endWorkoutPrompt()">Finish workout</button>`}
            </div>`;
        }
        html += '</div>';
    });
    body.innerHTML = html;
}

// Advance to the next unfinished exercise (wraps if you did them out of order).
function nextExercise() {
    clearRest();   // the carried-over countdown ends when you move on
    let nx = W.exercises.findIndex((e, k) => k > W.openEx && !e.sets.every(s => s.done));
    if (nx < 0) nx = W.exercises.findIndex(e => !e.sets.every(s => s.done));
    if (nx >= 0) { W.openEx = nx; renderWorkoutBody();
        const b = document.getElementById('wk-body'); if (b) b.scrollTop = 0; }
}
function openExercise(ei) { clearRest(); W.openEx = ei; renderWorkoutBody(); }
// Stop and hide the rest timer. The timer only ever means "rest since your last
// completed set", so switching exercises clears it until you finish a set again.
function clearRest() {
    clearInterval(W.restInterval);
    W.restInterval = null;
    W.restRemaining = 0;
    const o = document.getElementById('rest-overlay');
    if (o) o.classList.remove('active');
}

// One tap steps once; holding the button repeats and accelerates (so 5kg → 40kg
// is a hold, not forty taps). Pointer events cover touch, pen and mouse.
let _holdTimer = null, _holdDelay = 0;
function holdStep(e, kind, ei, si, d) {
    if (e && e.preventDefault) e.preventDefault();
    const step = () => (kind === 'W' ? adjW : adjR)(ei, si, d);
    step();
    clearTimeout(_holdTimer);
    _holdDelay = 380;
    const repeat = () => {
        step();
        _holdDelay = Math.max(45, _holdDelay * 0.82);
        _holdTimer = setTimeout(repeat, _holdDelay);
    };
    _holdTimer = setTimeout(repeat, _holdDelay);
    const stop = () => {
        clearTimeout(_holdTimer); _holdTimer = null;
        window.removeEventListener('pointerup', stop);
        window.removeEventListener('pointercancel', stop);
    };
    window.addEventListener('pointerup', stop);
    window.addEventListener('pointercancel', stop);
}

function adjW(ei, si, d) {
    W.exercises[ei].sets[si].weight = Math.max(0, parseFloat((W.exercises[ei].sets[si].weight + d).toFixed(1)));
    const el = document.getElementById(`w-${ei}-${si}`);
    if (el) el.value = W.exercises[ei].sets[si].weight;
}
function setW(ei, si, v) { W.exercises[ei].sets[si].weight = Math.max(0, parseFloat(v)||0); }
function adjR(ei, si, d) {
    W.exercises[ei].sets[si].reps = Math.max(1, W.exercises[ei].sets[si].reps + d);
    const el = document.getElementById(`r-${ei}-${si}`);
    if (el) el.value = W.exercises[ei].sets[si].reps;
}
function setR(ei, si, v) { W.exercises[ei].sets[si].reps = Math.max(1, parseInt(v)||1); }

function doneSet(ei, si) {
    if (!W.started) startWorkoutNow();   // logging a set IS starting — never a dead end
    const wEl = document.getElementById(`w-${ei}-${si}`);
    const rEl = document.getElementById(`r-${ei}-${si}`);
    if (wEl) W.exercises[ei].sets[si].weight = parseFloat(wEl.value)||0;
    if (rEl) W.exercises[ei].sets[si].reps   = parseInt(rEl.value)||1;
    W.exercises[ei].sets[si].done = true;
    renderWorkoutBody();
    showRestTimer(W.exercises[ei].rest || 90);
    // No auto-advance — the exercise stays open with a "complete" bar; the user
    // taps Next when they're ready. Calm and unhurried by design.
}

function undoSet(ei, si) {
    W.exercises[ei].sets[si].done = false;
    skipRest();
    renderWorkoutBody();
}

function showRestTimer(secs) {
    W.restRemaining = secs;
    document.getElementById('rest-overlay').classList.add('active');
    updateRestDisplay();
    clearInterval(W.restInterval);
    W.restInterval = setInterval(() => {
        W.restRemaining--;
        if (W.restRemaining <= 0) { skipRest(); return; }
        updateRestDisplay();
    }, 1000);
}

function updateRestDisplay() {
    const el = document.getElementById('rest-time');
    if (el) el.textContent = `${Math.floor(W.restRemaining/60)}:${String(W.restRemaining%60).padStart(2,'0')}`;
}

function adjustRest(d) { W.restRemaining = Math.max(5, W.restRemaining + d); updateRestDisplay(); }
function skipRest() { clearRest(); }

function endWorkoutPrompt() {
    const sets = W.exercises.reduce((a, ex) => a + ex.sets.filter(s => s.done).length, 0);
    endWorkout(sets > 0);
}

function endWorkout(doSave) {
    clearInterval(W.timerInterval);
    skipRest();
    if (doSave && W.sessionId) {
        const dur  = W.startTime ? Math.max(1, Math.round((Date.now() - W.startTime) / 60000)) : 1;
        const sess = SESSIONS[W.sessionId] || getCustomWorkouts().find(c => c.id === W.sessionId) || { name:'Workout' };
        const sets = W.exercises.reduce((a, ex) => a + ex.sets.filter(s => s.done).length, 0);
        const hist = getLiftHistory();
        hist.unshift({ id:W.sessionId, name:sess.name, date:new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}), duration:dur, exercises:W.exercises, sets, prs:0 });
        localStorage.setItem('sp_lift_history', JSON.stringify(hist.slice(0,20)));
        if (W.blockIdx !== null) completeBlock(todayKey(), W.blockIdx);
        else                     logUnplanned(W.sessionId, 'lift');
        save();
        S.streak++;
        if (L.activeProgram) L.programDay++;
        save();
    }
    W.active = false; W.started = false; W.startTime = null; W.exercises = [];
    document.querySelector('.tab-bar').style.display = '';
    document.getElementById('screen-workout').classList.remove('active');
    L.view = 'start';
    switchTab(doSave ? 'stretch' : 'lift');
    if (doSave) toast('Session saved — time to stretch 🧘');
}

// ── RUN STATE ─────────────────────────────────────────────────────────────────
const R = { view:'start', program:'c25k', viewWeek:null };

function renderRun() {
    const el  = document.getElementById('run-content');
    const hdr = document.getElementById('run-header');
    if (!el) return;

    // Header
    if (R.view === 'start') {
        hdr.innerHTML = `<div class="today-wordmark">SETS<span style="color:var(--primary);">+</span> <span style="color:var(--text);font-size:26px;font-weight:700;letter-spacing:-0.5px;">Run</span></div>`;
    } else {
        const titles = { programs:'Programs', program: RUN_PROGRAMS[R.program] ? RUN_PROGRAMS[R.program].name : '', custom:'Custom', history:'History' };
        hdr.innerHTML = `<div style="display:flex;align-items:center;gap:10px;">
            <button class="back-btn" onclick="runBack()">←</button>
            <div class="today-wordmark" style="font-size:22px;">SETS<span style="color:var(--primary);">+</span> <span style="color:var(--text);font-size:18px;font-weight:700;">${titles[R.view]||''}</span></div>
        </div>`;
    }

    if (R.view === 'start')    renderRunStart(el);
    if (R.view === 'programs') renderRunProgramsList(el);
    if (R.view === 'program')  renderRunProgram(el);
    if (R.view === 'custom')   renderRunCustom(el);
    if (R.view === 'history')  renderRunHistory(el);
}

function runBack() { R.view = (R.view === 'program') ? 'programs' : 'start'; renderRun(); }
function setRunView(v) { R.view = v; renderRun(); }

function renderRunStart(el) {
    const hist    = getRunHistory();
    const sched   = getTodayScheduled();
    const onC25K  = isCardio(sched?.id) && sched.id === 'c25k';
    const isSched = sched && isCardio(sched.id);

    const heroId    = isSched ? sched.id : 'run';
    const heroSess  = SESSIONS[heroId];
    const eyebrow   = cardioDone() ? 'Done today · go again?'
                    : isSched        ? 'Scheduled today'
                    :                  'Ready when you are';
    const meta      = heroId === 'c25k'
                    ? `Week ${progOf('c25k').week} · Day ${progOf('c25k').day} · ~${heroSess.time} min`
                    : `${heroSess.muscles} · ~${heroSess.time} min`;

    el.innerHTML = `<div class="today-body">
        <div class="hero hero--run">
            <div class="hero-eyebrow">${eyebrow}</div>
            <div class="hero-title">${heroSess.name}</div>
            <div class="hero-meta">${meta}</div>
            <button class="hero-cta" onclick="doStartRun('${heroId}')">Start</button>
        </div>

        <div class="sec-label">Or</div>
        ${heroId !== 'run'  ? `<div class="sec-row" onclick="doStartRun('run')">
            <div class="sec-row-icon">🏃</div>
            <div class="sec-row-main"><div class="sec-row-label">Free run</div>
            <div class="sec-row-sub">No target · just go</div></div>
            <div class="sec-row-arrow">›</div></div>` : ''}
        ${heroId !== 'walk' ? `<div class="sec-row" onclick="doStartRun('walk')">
            <div class="sec-row-icon">🚶</div>
            <div class="sec-row-main"><div class="sec-row-label">Walk</div>
            <div class="sec-row-sub">Easy aerobic</div></div>
            <div class="sec-row-arrow">›</div></div>` : ''}
        <div class="sec-row" onclick="setRunView('programs')">
            <div class="sec-row-icon">📋</div>
            <div class="sec-row-main"><div class="sec-row-label">Programs</div>
            <div class="sec-row-sub">Couch to 5K · Couch to 10K</div></div>
            <div class="sec-row-arrow">›</div></div>
        <div class="sec-row" onclick="setRunView('history')">
            <div class="sec-row-icon">📊</div>
            <div class="sec-row-main"><div class="sec-row-label">History</div>
            <div class="sec-row-sub">${hist[0] ? `Last: ${hist[0].date}` : 'No sessions yet'}</div></div>
            <div class="sec-row-arrow">›</div>
        </div>
    </div>`;
}

// ── PROGRAMS LIST + WEEK EXPLORER ─────────────────────────────────────────────
function setProgramWeek(w) { R.viewWeek = w; renderRun(); }
function openProgram(pid) { R.program = pid; R.viewWeek = progOf(pid).week; setRunView('program'); }
function dismissGraduation() { localStorage.setItem('sp_grad_dismissed', '1'); renderRun(); }

// The Programs shelf: a graduation offer (once you finish 5K) + a card per program.
function renderRunProgramsList(el) {
    const c210 = progOf('c210k');
    const grad = progComplete('c25k') && c210.week === 1 && c210.day === 1
                 && localStorage.getItem('sp_grad_dismissed') !== '1';
    const gradCard = grad ? `
        <div style="margin:14px 18px 20px;padding:18px;border-radius:16px;background:var(--primary-dim);border:1px solid var(--primary-border);">
            <div style="font-size:30px;">\ud83c\udf89</div>
            <div style="font-size:18px;font-weight:800;margin-top:6px;color:var(--text);">You ran your first 5K</div>
            <div style="font-size:13px;color:var(--text-sec);margin-top:4px;line-height:1.5;">You can now run 30 minutes non-stop — exactly the base you need for 10K. Ready to build up?</div>
            <div style="display:flex;gap:10px;margin-top:14px;">
                <button class="btn btn-run" style="flex:1.6;" onclick="openProgram('c210k')">Start Couch to 10K</button>
                <button class="btn btn-ghost" style="flex:1;" onclick="dismissGraduation()">Not now</button>
            </div>
        </div>` : '';

    const card = pid => {
        const p = RUN_PROGRAMS[pid], pr = progOf(pid), done = progComplete(pid);
        const started = pr.week > 1 || pr.day > 1;
        const accent = done ? 'var(--success)' : 'var(--run)';
        const status = done
            ? '<div style="font-size:12px;font-weight:700;color:var(--success);">\u2713 Graduated</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;">Run again \u203a</div>'
            : `<div style="font-size:12px;font-weight:700;color:var(--run);">${started ? 'In progress' : 'Ready'}</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;">Week ${pr.week} \u203a</div>`;
        return `<div class="sec-row" style="border-left:3px solid ${accent};align-items:flex-start;" onclick="openProgram('${pid}')">
            <div class="sec-row-icon">${p.icon}</div>
            <div class="sec-row-main"><div class="sec-row-label">${p.name}</div>
                <div class="sec-row-sub">${p.blurb}</div>
                ${p.note ? `<div style="font-size:11px;color:var(--text-muted);margin-top:8px;padding-top:8px;border-top:0.5px solid var(--border);">${p.note}</div>` : ''}
            </div>
            <div style="text-align:right;">${status}
                <button class="btn btn-ghost" style="margin-top:8px;padding:6px 11px;font-size:11px;" onclick="event.stopPropagation();openAddProgram('${pid}')">+ Plan</button>
            </div>
        </div>`;
    };

    el.innerHTML = `<div class="today-body">
        ${gradCard}
        <div class="sec-label">Your programs</div>
        ${card('c25k')}
        ${card('c210k')}
        <div style="text-align:center;font-size:11px;color:var(--text-muted);padding:14px 0 8px;">Half-marathon plan can slot in here later</div>
    </div>`;
}

// Human summary of a day's intervals, from the real segment data.
function c25kDaySummary(w, d) {
    const iv = c25kIntervals(w, d);
    const fm = s => { const m = s / 60; return (Number.isInteger(m) ? m : m.toFixed(1)) + ' min'; };
    if (iv.length === 1 && iv[0].k === 'run') return fm(iv[0].s) + ' continuous run';
    let pairs = iv.length >= 4;
    for (let i = 0; i < iv.length; i += 2) {
        if (!(iv[i] && iv[i].k === 'run' && iv[i+1] && iv[i+1].k === 'walk' &&
              iv[i].s === iv[0].s && iv[i+1].s === iv[1].s)) { pairs = false; break; }
    }
    if (pairs) return (iv.length / 2) + ' \u00d7 (' + fm(iv[0].s) + ' run / ' + fm(iv[1].s) + ' walk)';
    return iv.map(x => fm(x.s) + ' ' + (x.k === 'run' ? 'run' : 'walk')).join(' \u00b7 ');
}

// The session drawn as a proportional run/walk bar — "what happens each day", literally.

function getRunHistory() {
    try { return JSON.parse(localStorage.getItem('sp_run_history') || '[]').slice(0,10); } catch { return []; }

// ═══ RUN SESSION ══════════════════════════════════════════════════════════════
// A live cardio session: C25K guided intervals OR a free run/walk. Built calm,
// mirroring the Stretch engine — ONE render function, phase-switched, so the
// get-ready and active screens can never drift apart (that was a real V2 bug).
//
// TIMING IS anchored to the wall clock, not a decrementing counter. Each tick
// recomputes remaining time from Date.now(), so if iOS throttles setInterval in
// a pocket the clock catches up on resume instead of silently drifting. A screen
// Wake Lock keeps the display on for the run, which is also what keeps the timer
// and GPS alive on iOS (a backgrounded PWA gets no location and frozen timers).

// ── C25K canonical program (NHS / Cool Running structure) ─────────────────────
// Facts, not copied prose: the interval *durations* are the published method.
// Weeks 1–4 and 7–9 repeat the same session all three days; weeks 5 and 6
// deliberately diverge (the famous jump to a continuous run), so it's per-day.
function c25kIntervals(w, d) {
    const Rn = s => ({ k:'run',  s }), Wk = s => ({ k:'walk', s });
    const rep = (n, block) => { let a = []; for (let i = 0; i < n; i++) a = a.concat(block.map(x => ({ ...x }))); return a; };
    switch (w) {
        case 1: return rep(8, [Rn(60), Wk(90)]);
        case 2: return rep(6, [Rn(90), Wk(120)]);
        case 3: return rep(2, [Rn(90), Wk(90), Rn(180), Wk(180)]);
        case 4: return [Rn(180), Wk(90), Rn(300), Wk(150), Rn(180), Wk(90), Rn(300)];
        case 5: return d === 1 ? [Rn(300), Wk(180), Rn(300), Wk(180), Rn(300)]
                     : d === 2 ? [Rn(480), Wk(300), Rn(480)]
                     :           [Rn(1200)];
        case 6: return d === 1 ? [Rn(300), Wk(180), Rn(480), Wk(180), Rn(300)]
                     : d === 2 ? [Rn(600), Wk(180), Rn(600)]
                     :           [Rn(1500)];
        case 7: return [Rn(1500)];
        case 8: return [Rn(1680)];
        default: return [Rn(1800)];   // week 9 (and any beyond = graduation pace)
    }
}
// Every C25K session = 5-min brisk-walk warm-up + intervals + 5-min cool-down walk.
function c25kSegments(w, d) {
    return [{ k:'walk', s:300, warm:true }, ...c25kIntervals(w, d), { k:'walk', s:300, cool:true }];
}

// ── COUCH TO 10K — the 9-week bridge (assumes you can already run 30 min) ──────
// Structure from the established C25K→10K bridge (Motera "Option B" / Bridge to 10K):
// all continuous easy runs, 3/week, one long run, building 30 → ~60 min, then a 10K.
// { m:minutes } · e:1 = easy day · race:1 = race day (distance-target 10K).
const C210K = {
    1: [{ m:30 }, { m:30 }, { m:30 }],
    2: [{ m:30 }, { m:30 }, { m:35 }],
    3: [{ m:35 }, { m:25, e:1 }, { m:40 }],
    4: [{ m:40 }, { m:25, e:1 }, { m:45 }],
    5: [{ m:45 }, { m:30, e:1 }, { m:50 }],
    6: [{ m:50 }, { m:30, e:1 }, { m:55 }],
    7: [{ m:58 }, { m:30, e:1 }, { m:35, e:1 }],
    8: [{ m:40, e:1 }, { m:30, e:1 }, { m:25, e:1 }],
    9: [{ m:20, e:1 }, { m:15, e:1 }, { race:1 }],
};
function c210kSegments(w, d) {
    const day = C210K[w][d - 1];
    if (day.race) return [{ k:'walk', s:300, warm:true }, { k:'run', s:null, open:true, race:true }];
    return [{ k:'walk', s:300, warm:true }, { k:'run', s:day.m * 60, easy:day.e }, { k:'walk', s:300, cool:true }];
}

// ── PROGRAM REGISTRY — makes the explorer/session/progress program-aware ───────
const RUN_PROGRAMS = {
    c25k:  { id:'c25k',  name:'Couch to 5K',  short:'5K',  icon:'\ud83c\udfc3', weeks:9,
             blurb:'9 weeks \u00b7 beginner to 5K', weekKey:'sp_c25k_week',  dayKey:'sp_c25k_day',  note:null },
    c210k: { id:'c210k', name:'Couch to 10K', short:'10K', icon:'\ud83c\udfc5', weeks:9,
             blurb:'9-week bridge \u00b7 builds 5K \u2192 10K', weekKey:'sp_c210k_week', dayKey:'sp_c210k_day',
             note:'Best once you can run 30 min non-stop', gatedBy:'c25k' },
};
function progOf(pid) {
    const p = RUN_PROGRAMS[pid];
    return { week: Math.max(1, parseInt(localStorage.getItem(p.weekKey) || '1')),
             day:  Math.max(1, parseInt(localStorage.getItem(p.dayKey)  || '1')) };
}
function saveProg(pid, week, day) {
    localStorage.setItem(RUN_PROGRAMS[pid].weekKey, week);
    localStorage.setItem(RUN_PROGRAMS[pid].dayKey,  day);
}
function progComplete(pid) { return progOf(pid).week > RUN_PROGRAMS[pid].weeks; }
function programSegments(pid, w, d) { return pid === 'c210k' ? c210kSegments(w, d) : c25kSegments(w, d); }

function programDaySummary(pid, w, d) {
    if (pid === 'c25k') return c25kDaySummary(w, d);
    const day = C210K[w][d - 1];
    if (day.race) return 'Race day \u00b7 run 10K';
    return (day.e ? 'Easy ' : '') + day.m + ' min continuous run';
}
function programDayBar(pid, w, d) {
    const segs = programSegments(pid, w, d);
    const tot  = segs.reduce((a, s) => a + (s.open ? 3600 : s.s), 0);
    let h = '<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-mid);">';
    segs.forEach(s => {
        const col = s.k === 'run' ? 'var(--run)' : (s.warm || s.cool) ? 'rgba(6,214,160,0.4)' : 'var(--success)';
        h += `<div style="flex:${s.open ? 3600 : s.s};background:${col};"></div>`;
    });
    const cap = segs.some(s => s.race) ? 'to 10K \u00b7 5-min walk warm-up' : `${Math.round(tot/60)} min total \u00b7 incl. 5-min walk warm-up + cool-down`;
    return h + `</div><div style="font-size:11px;color:var(--text-muted);margin-top:6px;">${cap}</div>`;
}

const RS = {
    active:false, mode:null, type:null, segs:[], si:0, phase:'ready',
    segEndAt:0, startAt:0, pausedTotal:0, pauseStart:0, paused:false,
    target:null, week:1, day:1, timer:null, lastBeep:0,
    dist:0, lastFix:null, watchId:null, gps:'off', wakeLock:null,
    originTab:'run', blockIdx:null, logged:false, setup:{ kind:null, min:20, km:3 },
};

// Entry point (called from Start buttons and from a scheduled Today block).
function doStartRun(type, blockIdx) {
    const scheduled = (blockIdx !== undefined && blockIdx !== null);
    RS.blockIdx  = scheduled ? blockIdx : null;
    RS.originTab = scheduled ? 'today' : S.tab;
    if (RUN_PROGRAMS[type]) { const pr = progOf(type); return startProgramSession(type, pr.week, pr.day); }
    // Free run / walk. Scheduled blocks just go; from the Run tab we offer a target first.
    if (scheduled) return startRunSession(type, { open:true });
    RS.type = type; RS.setup = { kind:null, min:20, km:3 };
    openRunScreen('setup');
}

// A guided program session (C25K or C210K) at a specific week/day.
function startProgramSession(pid, week, day) {
    S.sound = S.soundRun;
    RS.active = true; RS.mode = 'program'; RS.program = pid; RS.type = pid;
    RS.week = week; RS.day = day; RS.si = 0; RS.paused = false;
    RS.pausedTotal = 0; RS.dist = 0; RS.lastFix = null; RS.gps = 'off';
    RS.logged = false; RS.lastBeep = 0;
    RS.segs = programSegments(pid, week, day);
    RS.target = RS.segs.some(s => s.race) ? { kind:'dist', value:10000 } : null;   // race day = 10K
    RS.phase = 'ready';
    openRunScreen('ready');
    acquireWake();
}
function startProgram(pid, week, day) { RS.blockIdx = null; RS.originTab = 'run'; startProgramSession(pid, week, day); }

// A free run/walk (open-ended, optional target).
function startRunSession(type, opts) {
    S.sound = S.soundRun;
    opts = opts || {};
    RS.active = true; RS.mode = 'free'; RS.type = type; RS.program = null; RS.si = 0; RS.paused = false;
    RS.pausedTotal = 0; RS.dist = 0; RS.lastFix = null; RS.gps = 'off';
    RS.logged = false; RS.lastBeep = 0; RS.target = opts.target || null;
    RS.segs = [{ k:type, s:null, open:true }];   // open-ended single segment
    RS.phase = 'ready';
    openRunScreen('ready');
    acquireWake();
}

function openRunScreen(phase) {
    RS.phase = phase;
    document.getElementById('screen-run-session').classList.add('active');
    document.querySelector('.tab-bar').style.display = 'none';
    renderRunSession();
}

// ── TARGET SETUP (free run/walk) ──────────────────────────────────────────────
function rsSetTarget(kind) { RS.setup.kind = (RS.setup.kind === kind) ? null : kind; renderRunSession(); }
function rsStep(field, delta) {
    if (field === 'min') RS.setup.min = Math.max(5,  RS.setup.min + delta);
    if (field === 'km')  RS.setup.km  = Math.max(1,  Math.round((RS.setup.km + delta) * 10) / 10);
    renderRunSession();
}
function rsBeginFromSetup() {
    let target = null;
    if (RS.setup.kind === 'time') target = { kind:'time', value:RS.setup.min * 60 };
    if (RS.setup.kind === 'dist') target = { kind:'dist', value:RS.setup.km * 1000 };
    startRunSession(RS.type, { target });
}

// ── RUN CONTROL ───────────────────────────────────────────────────────────────
function beginRun() {
    // You're already on your feet for a run, so "Start now" begins immediately —
    // segment boundaries are tracked on an absolute wall-clock timeline so an iOS
    // background throttle can't drift the intervals or skip a beat.
    RS.startAt = Date.now(); RS.pausedTotal = 0; RS.si = 0; RS.lastBeep = 0; RS.headsUp = false;
    RS.phase = 'active';
    const s0 = RS.segs[0];
    RS.segEndAt = s0.open ? 0 : Date.now() + s0.s * 1000;   // absolute end of segment 0
    startGPS();
    runTone(880, 180); speak(segCue(s0));
    renderRunSession();
    runTimer();
}

function segCue(seg) {
    if (seg.warm) return 'Warm up walk';
    if (seg.cool) return 'Cool down walk';
    const last = RS.si === RS.segs.length - 1;
    if (seg.k === 'run')  return last ? 'Last one, run now' : 'Run now';
    return 'Walk now';
}

// Spoken ~5s before a change, announcing what's next.
function nextCue(seg) {
    if (seg.cool) return 'Almost there, cool-down next';
    if (seg.open || seg.race) return 'Get ready to run';
    return seg.k === 'run' ? 'Get ready to run' : 'Get ready to walk';
}

function runTimer() {
    clearInterval(RS.timer);
    RS.timer = setInterval(() => {
        if (!RS.active || RS.paused) return;
        const seg = RS.segs[RS.si];

        if (!seg.open && RS.segEndAt) {
            const remain = Math.round((RS.segEndAt - Date.now()) / 1000);
            // ~5s spoken heads-up about what's coming — so you don't need to look.
            if (remain === 5 && !RS.headsUp) {
                RS.headsUp = true;
                const nx = RS.segs[RS.si + 1];
                runTone(520, 120);
                speak(nx ? nextCue(nx) : 'Almost done');
            }
            // Final three-second countdown — attention tone in BOTH Voice and Tones.
            if (remain <= 3 && remain > 0 && remain !== RS.lastBeep) { runTone(660, 60); RS.lastBeep = remain; }
            if (remain <= 0) {
                // Absolute-timeline catch-up: advance through EVERY segment the wall
                // clock has already passed. One tick after a long background throttle
                // lands on the correct segment (or finishes) instead of crawling one
                // segment per second.
                while (true) {
                    if (RS.si + 1 >= RS.segs.length) { finishRun(); return; }
                    RS.si++;
                    const nx = RS.segs[RS.si];
                    if (nx.open) { RS.segEndAt = 0; break; }
                    RS.segEndAt = RS.segEndAt + nx.s * 1000;   // extend from the previous boundary
                    if (Date.now() < RS.segEndAt) break;        // caught up — land here
                }
                RS.lastBeep = 0; RS.headsUp = false;
                runTone(880, 180); speak(segCue(RS.segs[RS.si]));
                renderRunSession();
                return;
            }
        }
        // Free-run auto-finish on a met target.
        if (seg.open && RS.target) {
            if (RS.target.kind === 'time' && getElapsed() >= RS.target.value) { finishRun(); return; }
            if (RS.target.kind === 'dist' && RS.dist   >= RS.target.value) { finishRun(); return; }
        }
        updateRunTick();
    }, 1000);
}

function getElapsed() {
    if (!RS.startAt) return 0;
    const end = RS.paused ? RS.pauseStart : Date.now();   // clock holds while paused
    return Math.floor((end - RS.startAt - RS.pausedTotal) / 1000);
}

function pauseRun() {
    if (RS.paused) {                          // resume
        const delta = Date.now() - RS.pauseStart;
        RS.pausedTotal += delta;
        if (RS.segEndAt) RS.segEndAt += delta;   // shift the segment end so the clock doesn't jump
        RS.paused = false;
    } else {
        RS.pauseStart = Date.now(); RS.paused = true;
    }
    renderRunSession();
}

function finishRun() {
    if (RS.logged) return;
    clearInterval(RS.timer);
    stopGPS();
    RS.phase = 'complete';
    RS.logged = true;
    const dur = Math.max(1, Math.round(getElapsed() / 60));
    if (RS.blockIdx !== null) completeBlock(todayKey(), RS.blockIdx);
    else                      logUnplanned(RS.type, 'cardio');
    if (RS.mode === 'program' && RS.program) {
        const pr = progOf(RS.program);
        if (RS.week === pr.week && RS.day === pr.day) {   // advance ONLY on your current day
            let nd = pr.day + 1, nw = pr.week;            // replays/previews don't move the pointer
            if (nd > 3) { nw++; nd = 1; }
            saveProg(RS.program, nw, nd);
        }
    }
    const hist = getRunHistory();
    hist.unshift({
        type:RS.type,
        date:new Date().toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }),
        duration:dur,
        distance: RS.dist > 50 ? Math.round(RS.dist / 10) / 100 : null,
        week: RS.mode === 'program' ? RS.week : null,
        day:  RS.mode === 'program' ? RS.day  : null,
    });
    localStorage.setItem('sp_run_history', JSON.stringify(hist.slice(0, 20)));
    S.streak++;
    save();
    renderRunSession();
}

// Leaving the complete screen — either straight out, or into the matched cool-down.
function leaveRunSession(toStretch) {
    clearInterval(RS.timer);
    stopGPS();
    releaseWake();
    RS.active = false;
    document.getElementById('screen-run-session').classList.remove('active');
    document.querySelector('.tab-bar').style.display = '';
    if (toStretch) { doStartStretch('post-run'); return; }
    switchTab(RS.originTab || 'today');
}

// The ✕. Confirm only if there's real progress to lose (mirrors nothing silently).
function exitRun() {
    if (RS.phase !== 'complete' && getElapsed() > 60) {
        spConfirm('End this run? It won\u2019t be saved.', 'End run', () => leaveRunSession(false));
    } else {
        leaveRunSession(false);
    }
}
// Small in-app confirmation — replaces the browser's native confirm() so
// destructive actions match the app's look, not a system popup. Reusable.
function spConfirm(message, confirmLabel, onConfirm) {
    const el = document.createElement('div');
    el.className = 'confirm-backdrop';
    el.innerHTML = `<div class="confirm-box" onclick="event.stopPropagation()">
        <div class="confirm-msg">${message}</div>
        <div class="confirm-btns">
            <button class="btn btn-ghost">Keep going</button>
            <button class="btn btn-primary">${confirmLabel}</button>
        </div>
    </div>`;
    const close = () => el.remove();
    const btns = el.querySelectorAll('.confirm-btns .btn');
    el.onclick = close;
    btns[0].onclick = close;
    btns[1].onclick = () => { close(); onConfirm(); };
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('confirm-backdrop--on'));
}

// ── GPS LAYER (decorates the timed session; the workout works without it) ──────
function startGPS() {
    if (!navigator.geolocation) { RS.gps = 'unavailable'; return; }
    RS.gps = 'acquiring';
    try {
        RS.watchId = navigator.geolocation.watchPosition(onFix, onGpsErr,
            { enableHighAccuracy:true, maximumAge:2000, timeout:12000 });
    } catch (e) { RS.gps = 'unavailable'; }
}
function stopGPS() {
    if (RS.watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(RS.watchId);
    RS.watchId = null;
}
function onGpsErr() { RS.gps = 'denied'; updateRunTick(); }
function onFix(p) {
    const c = p.coords;
    RS.gps = 'on';
    if (c.accuracy != null && c.accuracy > 40) return;     // reject junk fixes
    if (RS.lastFix) {
        const d = haversine(RS.lastFix.lat, RS.lastFix.lng, c.latitude, c.longitude);
        if (d > 0.5 && d < 75) RS.dist += d;               // ignore GPS jitter + teleport spikes
    }
    RS.lastFix = { lat:c.latitude, lng:c.longitude };
    updateRunTick();
}
function haversine(la1, lo1, la2, lo2) {
    const Rm = 6371000;
    const toR = x => x * Math.PI / 180;
    const dLa = toR(la2 - la1), dLo = toR(lo2 - lo1);
    const a = Math.sin(dLa/2)**2 + Math.cos(toR(la1)) * Math.cos(toR(la2)) * Math.sin(dLo/2)**2;
    return Rm * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ── WAKE LOCK (keep the screen — and therefore the timer — alive on iOS) ──────
async function acquireWake() {
    try { if ('wakeLock' in navigator) RS.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function releaseWake() {
    try { if (RS.wakeLock) RS.wakeLock.release(); } catch (e) {}
    RS.wakeLock = null;
}
document.addEventListener('visibilitychange', () => {
    if (RS.active && !RS.wakeLock && document.visibilityState === 'visible') acquireWake();
});

// ── FORMATTERS ────────────────────────────────────────────────────────────────
function fmtPace(secPerKm) {
    if (!isFinite(secPerKm) || secPerKm <= 0) return '\u2014';
    const m = Math.floor(secPerKm / 60), s = Math.round(secPerKm % 60);
    return m + '\u2019' + String(s).padStart(2, '0') + '"';
}
function runDistKm()  { return RS.dist / 1000; }
function runPaceSec() { const km = runDistKm(); return km > 0.02 ? getElapsed() / km : 0; }

// ── PER-TICK DOM UPDATE (cheap — no full re-render each second) ────────────────
function updateRunTick() {
    const seg = RS.segs[RS.si];
    const clock = document.getElementById('rs-clock');
    if (clock) {
        if (seg && seg.open) clock.textContent = RS.target && RS.target.kind === 'dist'
            ? runDistKm().toFixed(2) : fmtClock(getElapsed());
        else clock.textContent = fmtClock(Math.max(0, Math.round((RS.segEndAt - Date.now()) / 1000)));
    }
    const ring = document.getElementById('rs-ring');
    if (ring) ring.style.strokeDashoffset = 339.29 * (1 - runFrac());
    const d = document.getElementById('rs-dist');  if (d) d.textContent = runDistKm().toFixed(2);
    const pc = document.getElementById('rs-pace');  if (pc) pc.textContent = fmtPace(runPaceSec());
    const e = document.getElementById('rs-elapsed'); if (e) e.textContent = fmtClock(getElapsed());
    const scrim = document.getElementById('rs-topscrim');
    if (scrim) {
        const f = runOverallFrac();
        scrim.style.width = Math.round((1 - f) * 100) + '%';
        const mk = document.getElementById('rs-topmark');
        if (mk) { mk.style.left = (f * 100).toFixed(2) + '%'; mk.style.display = (f <= 0 || f >= 1) ? 'none' : ''; }
    }
}

// Ring fraction: current segment for timed segs; toward target (or a slow sweep) when open.
function runFrac() {
    const seg = RS.segs[RS.si];
    if (seg && !seg.open) {
        const remain = Math.max(0, (RS.segEndAt - Date.now()) / 1000);
        return Math.min(1, Math.max(0, 1 - remain / seg.s));
    }
    if (RS.target) {
        if (RS.target.kind === 'time') return Math.min(1, getElapsed() / RS.target.value);
        if (RS.target.kind === 'dist') return Math.min(1, RS.dist / RS.target.value);
    }
    return (getElapsed() % 120) / 120;   // calm slow sweep when open-ended, no target
}

// Overall progress through the WHOLE c25k session (for the segmented top bar).
function runOverallFrac() {
    if (RS.mode !== 'program') return runFrac();
    const total = RS.segs.reduce((a, s) => a + s.s, 0);
    if (!total) return 0;
    let done = 0;
    for (let i = 0; i < RS.si; i++) done += RS.segs[i].s;
    const seg = RS.segs[RS.si];
    if (seg && !seg.open) {
        const remain = Math.max(0, (RS.segEndAt - Date.now()) / 1000);
        done += Math.max(0, seg.s - remain);
    }
    return Math.min(1, done / total);
}

// The top bar. For c25k it's the SAME run/walk segments as the week explorer's day
// bar, so the two read as one thing — with a scrim revealing how far you've got.
function runTopBar(ready, color) {
    if (RS.mode === 'program') {
        const frac  = ready ? 0 : runOverallFrac();
        const spans = RS.segs.map(s => {
            const col = s.k === 'run' ? 'var(--run)' : (s.warm || s.cool) ? 'rgba(6,214,160,0.4)' : 'var(--success)';
            return `<div style="flex:${s.s};background:${col};"></div>`;
        }).join('');
        return `<div class="rs-topbar">
            <div class="rs-topsegs">${spans}</div>
            <div class="rs-topscrim" id="rs-topscrim" style="width:${Math.round((1 - frac) * 100)}%;"></div>
            <div class="rs-topmark" id="rs-topmark" style="left:${(frac * 100).toFixed(2)}%;${frac <= 0 || frac >= 1 ? 'display:none;' : ''}"></div>
        </div>`;
    }
    const pct = ready ? 0 : Math.round(runFrac() * 100);
    return `<div class="st-bar" style="margin-top:12px;"><div class="st-bar-fill" style="width:${pct}%;background:${ready ? 'var(--primary)' : color};"></div></div>`;
}

// ── SESSION RENDER — ONE function, phase-switched (ready + active share a layout)
function renderRunSession() {
    const el = document.getElementById('screen-run-session');
    if (!el) return;

    if (RS.phase === 'setup')    return renderRunSetup(el);
    if (RS.phase === 'complete') return renderRunComplete(el);
    return renderRunActive(el);   // 'ready' and 'active' — deliberately one layout
}

function renderRunSetup(el) {
    const t = RS.type === 'walk' ? 'Walk' : 'Run';
    const opt = (kind, label, sub, valId, valTxt, field, unit) => `
        <div class="rs-target-opt ${RS.setup.kind === kind ? 'rs-target-on' : ''}" onclick="rsSetTarget('${kind}')">
            <div class="rs-target-main"><div class="rs-target-label">${label}</div><div class="rs-target-sub">${sub}</div></div>
            ${RS.setup.kind === kind ? `<div style="display:flex;align-items:center;gap:8px;" onclick="event.stopPropagation()">
                <button class="rs-step" onclick="rsStep('${field}',${field==='km'?-0.5:-5})">\u2013</button>
                <div class="rs-target-val" style="min-width:64px;text-align:center;">${valTxt}</div>
                <button class="rs-step" onclick="rsStep('${field}',${field==='km'?0.5:5})">+</button>
            </div>` : `<div class="rs-target-val" style="opacity:0.5;">Set</div>`}
        </div>`;
    el.innerHTML = `
        <div class="st-top">
            <button class="st-x" onclick="leaveRunSession(false)">\u2715</button>
            <div class="st-count">Set up</div>
            <div class="st-title">${t}</div>
        </div>
        <div class="st-body" style="text-align:left;">
            <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin:6px 4px 14px;">Target (optional)</div>
            <div class="rs-target-opt ${RS.setup.kind === null ? 'rs-target-on' : ''}" onclick="rsSetTarget(null)">
                <div class="rs-target-main"><div class="rs-target-label">No target</div><div class="rs-target-sub">Just go \u2014 finish when you like</div></div>
            </div>
            ${opt('time', 'Time', 'Finish at a set duration', 'min', RS.setup.min + ' min', 'min')}
            ${opt('dist', 'Distance', 'Finish at a set distance (needs GPS)', 'km', RS.setup.km.toFixed(1) + ' km', 'km')}
        </div>
        <div class="st-controls">
            <button class="st-btn st-btn--main" style="background:var(--run);" onclick="rsBeginFromSetup()">Start ${t.toLowerCase()}</button>
        </div>`;
}

function renderRunActive(el) {
    const seg   = RS.segs[RS.si] || RS.segs[0];
    const ready = RS.phase === 'ready';
    const running = seg.k === 'run' && !ready;
    const color = ready ? 'var(--primary)' : (seg.k === 'run' ? 'var(--run)' : 'var(--success)');
    const eyebrow = ready ? 'Get ready' : segEyebrow(seg);

    // Header + overall progress bar (whole session; the ring is just this segment).
    const title = RS.mode === 'program' ? RUN_PROGRAMS[RS.program].name : (RS.type === 'walk' ? 'Walk' : 'Free run');
    const right = RS.mode === 'program' ? `Wk ${RS.week} \u00b7 D${RS.day}`
                : RS.target ? (RS.target.kind === 'time' ? `Target ${Math.round(RS.target.value/60)} min` : `Target ${(RS.target.value/1000).toFixed(1)} km`)
                : '';

    // Ring centre
    let clockTxt, clockSub;
    if (ready) { clockTxt = (RS.type === 'walk' ? '\ud83d\udeb6' : '\ud83c\udfc3'); clockSub = ''; }
    else if (seg.open) {
        clockTxt = (RS.target && RS.target.kind === 'dist') ? runDistKm().toFixed(2) : fmtClock(getElapsed());
        clockSub = (RS.target && RS.target.kind === 'dist') ? `of ${(RS.target.value/1000).toFixed(1)} km` : 'elapsed';
    } else {
        clockTxt = fmtClock(seg.s);
        clockSub = 'of ' + segDurLabel(seg);
    }

    // Next-up preview
    const next = RS.segs[RS.si + 1];
    const workSegs = RS.segs.filter(x => !x.warm && !x.cool);
    const workIdx  = RS.segs.slice(0, RS.si + 1).filter(x => !x.warm && !x.cool).length;
    let nextMain, nextSub;
    if (ready) { nextMain = 'Starting: ' + segNoun(seg); nextSub = RS.mode === 'program' ? 'Ease into it' : 'Tap start when ready'; }
    else if (RS.mode === 'program') {
        nextMain = next ? 'Next: ' + segNoun(next) + (next.open ? '' : ' ' + segDurLabel(next)) : 'Then you\u2019re done';
        if (RS.program === 'c25k') nextSub = (!seg.warm && !seg.cool && workSegs.length) ? `${workIdx} of ${workSegs.length} intervals` : (seg.warm ? 'Warming up' : 'Cooling down');
        else nextSub = seg.warm ? 'Warming up' : seg.cool ? 'Cooling down' : (seg.race ? 'Run your 10K \u00b7 easy pace' : 'Conversational pace');
    } else { nextMain = RS.target ? nextFreeHint() : 'Go as long as you like'; nextSub = 'Steady, easy pace'; }

    const ringStroke = ready
        ? '' // coral get-ready shows just the countdown, no progress arc
        : `<circle cx="60" cy="60" r="54" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
                   stroke-dasharray="339.29" style="stroke-dashoffset:${339.29 * (1 - runFrac())};transition:stroke-dashoffset 0.9s linear;" id="rs-ring"/>`;

    // Stats row (GPS layer). For free-run we surface elapsed/pace/speed; for C25K distance/pace/elapsed.
    const gpsNote = RS.gps === 'denied' ? 'GPS off' : RS.gps === 'acquiring' ? 'finding GPS\u2026' : null;
    const stat = (v, l, id) => `<div class="rs-stat"><div class="rs-statv" ${id?`id="${id}"`:''}>${v}</div><div class="rs-statl">${l}</div></div>`;
    let statsRow;
    if (RS.mode === 'free') {
        const kmh = getElapsed() > 0 ? (runDistKm() / (getElapsed() / 3600)) : 0;
        statsRow = stat(fmtClock(getElapsed()), 'elapsed', 'rs-elapsed')
                 + stat(fmtPace(runPaceSec()), 'pace /km', 'rs-pace')
                 + stat(kmh.toFixed(1), 'km/h', 'rs-dist');
    } else {
        statsRow = stat(runDistKm().toFixed(2), 'km', 'rs-dist')
                 + stat(fmtPace(runPaceSec()), 'pace /km', 'rs-pace')
                 + stat(fmtClock(getElapsed()), 'elapsed', 'rs-elapsed');
    }

    el.innerHTML = `
        <div class="st-top">
            <button class="st-x" onclick="exitRun()">\u2715</button>
            <div class="st-count">${title}</div>
            <div class="st-title">${right}</div>
            ${runTopBar(ready, color)}
        </div>
        <div class="st-body st-body--calm">
            <div class="rs-eyebrow" style="color:${color};padding-top:6px;">${eyebrow}</div>
            <div class="st-ringwrap st-ringwrap--big">
                <svg viewBox="0 0 120 120" class="st-svg">
                    <circle cx="60" cy="60" r="54" class="st-ring-bg"/>
                    ${ringStroke}
                </svg>
                <div class="rs-ringinner">
                    <div class="rs-clock" id="rs-clock" ${ready ? `style="font-size:60px;line-height:1.1;"` : ''}>${clockTxt}</div>
                    ${clockSub ? `<div class="rs-clocksub">${clockSub}</div>` : ''}
                </div>
            </div>
            <div class="rs-nextup">
                <div class="rs-nextup-main">${nextMain}</div>
                <div class="rs-nextup-sub">${gpsNote || nextSub}</div>
            </div>
            ${ready ? '' : `<div class="rs-stats">${statsRow}</div>`}
        </div>
        <div class="st-controls">
            ${ready
                ? `<button class="st-btn" onclick="leaveRunSession(false)">Back</button>
                   <button class="st-btn st-btn--main" style="background:var(--primary);color:#0A0E27;" onclick="beginRun()">Start now</button>`
                : `<button class="st-btn" onclick="${RS.mode === 'program' ? 'exitRun()' : 'finishRun()'}">${RS.mode === 'program' ? 'End' : 'Finish'}</button>
                   <button class="st-btn st-btn--main" style="background:${color};color:#0A0E27;" onclick="pauseRun()">${RS.paused ? 'Resume' : 'Pause'}</button>`}
        </div>`;
}

function renderRunComplete(el) {
    const dur = Math.max(1, Math.round(getElapsed() / 60));
    const km  = runDistKm();
    const workSegs = RS.segs.filter(x => !x.warm && !x.cool).length;
    const sub = RS.mode === 'program' ? `${RUN_PROGRAMS[RS.program].name} \u00b7 Week ${RS.week}, Day ${RS.day}`
              : (RS.type === 'walk' ? 'Walk' : 'Free run') + (RS.target ? ' \u00b7 target met' : '');
    const metric = (v, l) => `<div class="rs-metric"><div class="rs-metric-v">${v}</div><div class="rs-metric-l">${l}</div></div>`;
    const distMetric = km > 0.05 ? metric(km.toFixed(2), 'km') : metric('\u2014', 'km (no GPS)');
    const fourth = RS.program === 'c25k' ? metric(`${workSegs}`, 'intervals') : metric(fmtPace(runPaceSec()), 'avg pace');
    el.innerHTML = `
        <div class="st-top">
            <button class="st-x" onclick="leaveRunSession(false)">\u2715</button>
            <div class="st-count">Complete</div>
            <div class="st-title">${RS.mode === 'program' ? `Wk ${RS.week} \u00b7 D${RS.day}` : ''}</div>
            <div class="st-bar" style="margin-top:12px;"><div class="st-bar-fill" style="width:100%;"></div></div>
        </div>
        <div class="st-body">
            <div style="text-align:center;padding-top:20px;">
                <div class="rs-done-icon">\ud83c\udfc3</div>
                <div class="rs-done-title">Nice work</div>
                <div class="rs-done-sub">${sub}</div>
            </div>
            <div class="rs-metricgrid">
                ${metric(fmtClock(getElapsed()), 'total time')}
                ${distMetric}
                ${metric(fmtPace(runPaceSec()), 'avg pace')}
                ${fourth}
            </div>
            <div class="rs-bridge" onclick="leaveRunSession(true)">
                <div class="rs-bridge-icon">\ud83e\uddd8</div>
                <div style="flex:1;">
                    <div class="rs-bridge-title">Matched cool-down ready</div>
                    <div class="rs-bridge-sub">Runner stretch \u00b7 legs &amp; hips</div>
                </div>
                <div class="rs-bridge-go">\u203a</div>
            </div>
        </div>
        <div class="st-controls">
            <button class="st-btn" onclick="leaveRunSession(false)">Skip</button>
            <button class="st-btn st-btn--main" onclick="leaveRunSession(true)">Cool-down stretch</button>
        </div>`;
}

// ── Segment labels ────────────────────────────────────────────────────────────
function segEyebrow(seg) { return seg.k === 'run' ? 'Running' : (seg.warm || seg.cool) ? 'Walking' : 'Walking'; }
function segNoun(seg) {
    if (seg.warm) return 'Warm-up walk';
    if (seg.cool) return 'Cool-down walk';
    if (seg.race) return 'Run to 10K';
    return seg.k === 'run' ? (RS.program === 'c210k' ? 'Run' : 'Jog') : 'Walk';
}
function segDurLabel(seg) {
    if (seg.open || !seg.s) return '';
    return seg.s >= 60 ? (seg.s % 60 === 0 ? (seg.s/60) + ' min' : Math.floor(seg.s/60) + ':' + String(seg.s%60).padStart(2,'0')) : seg.s + 's';
}
function nextFreeHint() {
    if (RS.target.kind === 'time') { const left = Math.max(0, RS.target.value - getElapsed()); return fmtClock(left) + ' to go'; }
    const left = Math.max(0, (RS.target.value - RS.dist) / 1000); return left.toFixed(2) + ' km to go';
}

// Bilateral stretches run 30s per side = ~60s accumulated. Meta-analyses find

// Flat lookup, keyed "Category|Name".
// NOT keyed by name alone: five stretches share a name across two categories
// but are genuinely different entries — the Chest and Shoulders versions of
// "Doorway Chest Stretch" have different targets AND different instructions.
// Name-keying silently dropped one of each pair.
// Stamp each pool entry with its own category, in place. Without this, a
// routine built from the pool has no way back to its composite key, so forking
// a preset into the builder silently produces an empty routine.
// Popular display names over validated stretches. The stretch keeps its real
// identity and provenance; this is only what the user sees, so search-familiar
// names (World's Greatest, Downward Dog) map onto sound content.
// Common name shown first (what a user searches for); the real/anatomical name is
// kept as the stretch's identity and shown underneath. Only stretches whose real
// name is clunkier than the common one get an entry — most already ARE their common
// name (Butterfly, Pigeon, Cobra...), so no entry means "the name is already fine".
const STRETCH_ALIAS = {
    'Half Splits Stretch':            'Half Splits',
    'Supine Knees to Chest':          'Knees to Chest',

    'Straight-Knee Calf Stretch':     'Standing Calf (Straight Knee)',
    'Deep Calf Stretch (Soleus)':     'Deep Calf (Soleus)',
    'Cross-Body Shoulder':            'Cross-Body Shoulder Stretch',
    'Wrist Flexor Stretch':           'Wrist Flexor Stretch',
};
// The common (or real) name, shown as the headline.
function displayName(s) { return STRETCH_ALIAS[s.n] || s.n; }
// The anatomical name shown underneath — only when it differs from the headline.
function subName(s) { return STRETCH_ALIAS[s.n] && STRETCH_ALIAS[s.n] !== s.n ? s.n : ''; }

const STRETCH_BY_KEY = {};
Object.entries(STRETCH_POOL).forEach(([cat, arr]) =>
    arr.forEach(s => { s.cat = cat; s.k = cat + '|' + s.n; STRETCH_BY_KEY[s.k] = s; }));

// ── CUSTOM ROUTINES ───────────────────────────────────────────────────────────
// Stored as names, not copies — if the library is ever re-reviewed, saved
// routines inherit the corrections instead of freezing old data.
function getCustomStretches() {

}

// than crashing on it.
function customRoutine(cid) {
    const c = customById(cid);
    if (!c) return [];

}
const isCustomStretch = id => typeof id === 'string' && id.startsWith('c:');


// ── "NOT FOR ME" ──────────────────────────────────────────────────────────────
// Mark a stretch once and it never gets auto-suggested again — presets,
// cool-downs, areas, everywhere. This is the Bend frustration solved at the
// root rather than per-routine.
//
// Note what this does NOT filter: a routine you built by hand. If you
// explicitly picked it, that's a choice, and the app has no business
// second-guessing it.
function getExclusions() {
    try { return JSON.parse(localStorage.getItem('sp_excluded') || '[]'); }
    catch (e) { return []; }
}
const isExcluded = k => getExclusions().includes(k);
function addExclusion(k) {
    const l = getExclusions();
    if (!l.includes(k)) { l.push(k); localStorage.setItem('sp_excluded', JSON.stringify(l)); }
}
function removeExclusion(k) {
    localStorage.setItem('sp_excluded', JSON.stringify(getExclusions().filter(x => x !== k)));
}

// Big muscles first — reads as a routine, not a random list.
// Top-down, big muscles first. EVERY category in STRETCH_POOL must appear here,
// or buildRoutine filters it out and those stretches silently never render.
const STRETCH_ORDER = ['Neck','Chest','Lats','Mid Back','Upper Back','Lower Back','Shoulders','Rear Delts',
                       'Triceps','Biceps','Forearms','Core','Quads','Hamstrings','Adductors','Glutes',
                       'Hip Flexors','Calves'];

// Variety: prefer what you haven't done lately. V1's reviewed scoring.
function stretchScore(name) {
    const h = JSON.parse(localStorage.getItem('sp_stretch_shown') || '[]');
    const i = h.indexOf(name);
    if (i === -1) return 10;
    if (i < 3)    return 5;
    return 8;
}
function noteShown(names) {
    const h = JSON.parse(localStorage.getItem('sp_stretch_shown') || '[]');
    localStorage.setItem('sp_stretch_shown', JSON.stringify([...names, ...h].slice(0, 24)));
}

// Two selection strategies, because they want opposite things.
//
// BREADTH (cool-down): one stretch per category. You trained chest, shoulders
//   and triceps — you want one of each, not three chest stretches.
// DEPTH (area routine): every stretch in the area. "Hips" should mean all the
//   hip stretches, not a sample of them.
// Same library, opposite goals. Using breadth for areas is what made a hips
// routine come out as 2 stretches and 2 minutes.
function buildRoutine(cats, mode) {
    const used = new Set(), out = [];
    STRETCH_ORDER.filter(c => cats.includes(c)).forEach(c => {
        const pool = (STRETCH_POOL[c] || [])
            .filter(s => !used.has(s.n) && !isExcluded(s.k))
            .map(s => ({ s, score: stretchScore(s.n) }))
            .sort((a, b) => b.score - a.score);
        if (mode === 'depth') pool.forEach(x => { out.push(x.s); used.add(x.s.n); });
        else if (pool[0])     { out.push(pool[0].s); used.add(pool[0].s.n); }
    });
    const r = mode === 'depth' ? out : out.slice(0, 8);
    // Ease in, then deepen. A routine that opens with its hardest stretch is a
    // routine people bail on — gentle first, cold body last.
    return r.slice().sort((a, b) => (a.diff || 1) - (b.diff || 1));
}

// ── PROGRAMS PER AREA ─────────────────────────────────────────────────────────
// Each area offers a small set of INTENT-LED programs, not numbered variants.
// The name makes a promise ("Quick Loosen = gentle, short"); programRoutine below
// keeps it by filtering the pool to match. "Deep & Strong" only appears where the
// area actually HAS harder stretches — no empty promises.
const PROGRAM_TYPES = {
    quick: { suffix: 'Quick Loosen', mins: 5,  maxDiff: 1,
        desc: 'A gentle, accessible set — good when you\'re short on time, easing in, or just waking up.' },
    full:  { suffix: 'Full Release', mins: 10, maxDiff: 3,
        desc: 'The complete set for this area — a thorough, unhurried session covering everything.' },
    deep:  { suffix: 'Deep & Strong', mins: 10, minDiff: 2,
        desc: 'A shorter, more intense set led by the deeper positions — for when you want to push further.' },
};

function areaEarnsDeep(area) {
    return buildRoutine(area.cats, 'depth').filter(s => (s.diff || 1) >= 2).length >= 2;
}

function areaPrograms(area) {
    const types = areaEarnsDeep(area) ? ['quick','full','deep'] : ['quick','full'];
    return types.map(t => ({
        id:    `a:${area.id}:${t}`,
        type:  t,
        name:  `${area.name} · ${PROGRAM_TYPES[t].suffix}`,
        short: PROGRAM_TYPES[t].suffix,
        desc:  PROGRAM_TYPES[t].desc,
        mins:  routineMinutes(programRoutine(`a:${area.id}:${t}`)),
        n:     programRoutine(`a:${area.id}:${t}`).length,
    }));
}

function programRoutine(pid) {
    const [, aid, type] = pid.split(':');
    const area = areaById(aid);
    const spec = PROGRAM_TYPES[type];
    if (!area || !spec) return [];

    let pool = buildRoutine(area.cats, 'depth');
    if (spec.maxDiff) pool = pool.filter(s => (s.diff || 1) <= spec.maxDiff);
    if (spec.minDiff) {
        // Deep leads with every harder stretch, then adds just enough easier ones to
        // warm into them — not the whole library reshuffled.
        const hard = pool.filter(s => (s.diff || 1) >= spec.minDiff);
        const easy = pool.filter(s => (s.diff || 1) < spec.minDiff);
        pool = hard.concat(easy.slice(0, Math.max(2, Math.ceil(hard.length / 2))));
    }
    if (!pool.length) pool = buildRoutine(area.cats, 'depth');

    // Deep = the hard-led subset once through (shorter, more intense — no padding).
    // Quick/Full fill to their target time, cycling only if the pool runs short.
    if (type === 'deep') return pool;

    const target = spec.mins * 60;
    const out = []; let secs = 0, i = 0;
    while (secs < target && out.length < 24) {
        const s = pool[i % pool.length];
        out.push(s);
        secs += s.b ? s.d * 2 : s.d;
        i++;
    }
    return out.slice().sort((a, b) => (a.diff || 1) - (b.diff || 1));
}

const isAreaRoutine = id => typeof id === 'string' && id.startsWith('a:');
function areaRoutineById(id) { return programRoutine(id); }
function areaRoutineName(id) {
    const [, aid, type] = id.split(':');
    const area = areaById(aid);
    if (!area || !PROGRAM_TYPES[type]) return 'Stretch';
    return `${area.name} · ${PROGRAM_TYPES[type].suffix}`;
}

// What stretches does this block actually contain?
// Order matters: an explicit choice (custom / a named area routine) always
// wins over anything inferred.
function routineFor(block) {
    if (isCustomStretch(block.id)) return customRoutine(block.id);
    if (isAreaRoutine(block.id))   return areaRoutineById(block.id);

    // A cool-down looks BACK at what you actually just did. That's the thread.
    // Breadth, not depth — one stretch per thing you trained.
    if (block.role === 'cooldown') {
        const blocks = todayBlocks();
        const prev = blocks.slice(0, blocks.indexOf(block)).reverse()
                     .find(b => b.type === 'lift' || b.type === 'cardio');
        return buildRoutine(SESSION_STRETCH[prev ? prev.id : block.id] || PROGRAM_STRETCH.full);
    }
    return buildRoutine(PROGRAM_STRETCH[block.id] || SESSION_STRETCH[block.id] || PROGRAM_STRETCH.full);
}

function routineMinutes(r) {
    // Uses the user's hold length so the estimate matches what actually runs.
    const hold = (typeof S !== 'undefined' && S.holdSecs) ? S.holdSecs : 30;
    return Math.max(1, Math.round(r.reduce((a, s) => a + (s.b ? hold * 2 : hold), 0) / 60));
}

                </div>
                <div class="sec-row-arrow">›</div>
            </div>`).join('')}

}

// A single stretch's detail — figure, name, muscle, full instructions.
function showStretchDetailFrom(from, key) {
    STR.detailBack = from; STR.detailKey = key; STR.view = 'detail'; renderStretch();
}
function renderStretchDetail(el) {
    const s = STRETCH_BY_KEY[STR.detailKey];
    if (!s) { STR.view = 'start'; return renderStretch(); }
    const sub = subName(s);
    const diffLabel = ['', 'Easy', 'Moderate', 'Advanced'][s.diff || 1];
    el.innerHTML = `<div class="today-body" style="text-align:center;">
        ${stretchImg(s)
            ? `<div class="detail-disc"><img src="${stretchImg(s)}" alt="${displayName(s)}"></div>`
            : `<div class="detail-disc detail-disc--empty">🧘</div>`}

        <div class="detail-sub">${sub ? sub + ' · ' : ''}${s.t}</div>
        <div class="detail-meta">${s.d}s${s.b ? ' each side' : ''} · ${diffLabel}</div>
        <ol class="detail-steps">${s.i.map(x => `<li>${x}</li>`).join('')}</ol>
    </div>`;
}

// The thing Bend won't let you do: take their routine and make it yours.
// Drops the whole thing into the builder, where you strip what you hate.
function forkRoutine(vid) {
    const r = areaRoutineById(vid);
    if (!r.length) return;
    const seen = new Set();
    CS.id = null;
    CS.name = areaRoutineName(vid) + ' (mine)';
    CS.picked = r.map(s => s.cat ? s.cat + '|' + s.n : null).filter(k => {
        if (!k || seen.has(k)) return false;   // a 2-round routine repeats — fork uniques only
        seen.add(k); return true;
    });
    STR.view = 'builder'; renderStretch();
    toast('Edit it however you like');
}

// ── BUILDER ───────────────────────────────────────────────────────────────────
// Same shape as the day sheet: your list on top, the library below, tap to add.
const CS = { id:null, name:'', picked:[] };

function newCustomStretch() {
    CS.id = null; CS.name = ''; CS.picked = []; CS_SEARCH = ''; CS_OPEN = null;
    STR.view = 'builder'; renderStretch();
}
function editCustomStretch(cid) {
    const c = customById(cid);
    if (!c) return;
    CS_SEARCH = ''; CS_OPEN = null; CS.id = c.id; CS.name = c.name; CS.picked = [...c.s];
    STR.view = 'builder'; renderStretch();
}
function deleteCustomStretch(cid) {
    saveCustomStretches(getCustomStretches().filter(c => c.id !== cid));
    renderStretch(); toast('Routine deleted');
}
function csName(v) { CS.name = v; }
function csToggle(key) {
    const i = CS.picked.indexOf(key);
    if (i === -1) CS.picked.push(key); else CS.picked.splice(i, 1);
    renderStretchBuilder(document.getElementById('stretch-content'));
}
// Explicit remove for the ✕ on a chosen row — always removes, never toggles back on.
function csRemove(key) {
    const i = CS.picked.indexOf(key);
    if (i !== -1) CS.picked.splice(i, 1);
    renderStretchBuilder(document.getElementById('stretch-content'));
}
function csMove(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= CS.picked.length) return;
    [CS.picked[i], CS.picked[j]] = [CS.picked[j], CS.picked[i]];
    renderStretchBuilder(document.getElementById('stretch-content'));
}
function csSave() {
    if (!CS.picked.length) { toast('Pick at least one stretch'); return; }
    const list = getCustomStretches();
    const name = (CS.name || '').trim() || 'My routine';
    if (CS.id) {
        const c = list.find(x => x.id === CS.id);
        c.name = name; c.s = [...CS.picked];
    } else {
        list.push({ id:'c:' + Date.now().toString(36), name, s:[...CS.picked] });
    }
    saveCustomStretches(list);
    STR.view = 'custom'; renderStretch();
    toast(`${name} saved`);
}

// Search state + which library row is expanded to show its instructions.
let CS_SEARCH = '';
let CS_OPEN = null;
function csSearch(v) { CS_SEARCH = v.toLowerCase(); renderLibraryList(); }
function csToggleInfo(key, ev) {

function renderStretchBuilder(el) {
    const mins = routineMinutes(CS.picked.map(k => STRETCH_BY_KEY[k]).filter(Boolean));

    const chosen = CS.picked.length ? CS.picked.map((key, i) => {
