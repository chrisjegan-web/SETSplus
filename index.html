<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sets+</title>
    <meta name="theme-color" content="#0A0E27">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sets+">
    <style>
        /* ── DESIGN SYSTEM ─────────────────────────────────────────────────── */
        :root {
            --bg:             #0A0E27;
            --surface:        rgba(255,255,255,0.045);
            --surface-mid:    rgba(255,255,255,0.08);
            --surface-high:   rgba(255,255,255,0.12);
            --border:         rgba(255,255,255,0.075);
            --border-mid:     rgba(255,255,255,0.14);

            --primary:        #FF6B35;
            --primary-dim:    rgba(255,107,53,0.13);
            --primary-border: rgba(255,107,53,0.32);

            --success:        #06D6A0;
            --success-dim:    rgba(6,214,160,0.10);
            --success-border: rgba(6,214,160,0.28);

            --run:            #3B9EFF;
            --run-dim:        rgba(59,158,255,0.10);
            --run-border:     rgba(59,158,255,0.28);

            --warning:        #FFD166;
            --warning-dim:    rgba(255,209,102,0.10);
            --warning-border: rgba(255,209,102,0.28);

            --info:           #667eea;
            --info-dim:       rgba(102,126,234,0.10);
            --info-border:    rgba(102,126,234,0.22);

            --text:           #FFFFFF;
            --text-sec:       rgba(255,255,255,0.55);
            --text-muted:     rgba(255,255,255,0.30);

            --tab-bg:         #0d1424;
            --tab-border:     rgba(255,255,255,0.07);
            --tab-active:     #FF6B35;
            --tab-inactive:   rgba(255,255,255,0.30);

            --radius-sm:      8px;
            --radius:         12px;
            --radius-lg:      16px;
            --safe-bottom:    env(safe-area-inset-bottom, 0px);
        }

        /* ── RESET ─────────────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button { font-family: inherit; cursor: pointer; }

        /* ── SHELL ──────────────────────────────────────────────────────────── */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 430px;
            margin: 0 auto;
        }

        .screens { flex: 1; position: relative; overflow: hidden; }

        .screen {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            display: none;
            scrollbar-width: none;
        }
        .screen::-webkit-scrollbar { display: none; }
        .screen.active { display: block; }
        /* Workout is the only screen that stretches — its body scrolls
           independently beneath a fixed header and the rest overlay. */
        #screen-workout.active { display: flex; flex-direction: column; }

        /* Content wrapper for each section tab. Normal flow — the .screen
           itself is the scroll container. */
        .tab-content { padding-bottom: 12px; }
        .tab-content--plan { padding: 0 14px 12px; }

        /* ── SCREEN HEADER ──────────────────────────────────────────────────── */
        .sh {
            padding: 52px 20px 14px;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
        }
        .sh-row { display: flex; align-items: center; justify-content: space-between; }
        .sh-greeting { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
        .sh-name { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
        .sh-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
        .wordmark { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
        .wordmark span { color: var(--primary); }
        .streak-pill {
            background: var(--primary-dim);
            border: 1px solid var(--primary-border);
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* ── THREAD ─────────────────────────────────────────────────────────── */
        .thread {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            margin: 0 20px 14px;
        }
        .thread-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .thread-text { font-size: 12px; font-weight: 600; line-height: 1.4; }

        .thread--success { background: var(--success-dim); border: 1px solid var(--success-border); }
        .thread--success .thread-dot { background: var(--success); }
        .thread--success .thread-text { color: var(--success); }

        .thread--primary { background: var(--primary-dim); border: 1px solid var(--primary-border); }
        .thread--primary .thread-dot { background: var(--primary); }
        .thread--primary .thread-text { color: #FF8B5A; }

        .thread--run { background: var(--run-dim); border: 1px solid var(--run-border); }
        .thread--run .thread-dot { background: var(--run); }
        .thread--run .thread-text { color: #6FB8FF; }

        .thread--warning { background: var(--warning-dim); border: 1px solid var(--warning-border); }
        .thread--warning .thread-dot { background: var(--warning); }
        .thread--warning .thread-text { color: var(--warning); }

        .thread--neutral {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.11);
        }
        .thread--neutral .thread-dot { background: rgba(255,255,255,0.35); }
        .thread--neutral .thread-text { color: rgba(255,255,255,0.52); }

        /* ── CONTENT WRAPPER ────────────────────────────────────────────────── */
        .content { padding: 0 20px 24px; }

        /* ── GENERIC CARD ───────────────────────────────────────────────────── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 8px;
        }
        .card-label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 5px;
        }
        .card-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
        .card-sub { font-size: 12px; color: var(--text-sec); }

        /* ── SECTION LABEL ──────────────────────────────────────────────────── */
        .section-label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--text-muted); margin: 16px 0 8px;
        }

        /* ── DIVIDER ────────────────────────────────────────────────────────── */
        .divider { height: 1px; background: var(--border); margin: 16px 0; }

        /* ── BUTTONS ────────────────────────────────────────────────────────── */
        .btn {
            display: flex; align-items: center; justify-content: center;
            gap: 6px; border: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 700; min-height: 48px;
            padding: 0 18px; transition: opacity 0.12s; width: 100%;
        }
        .btn:active { opacity: 0.75; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: #0A0E27; }
        .btn-run { background: var(--run); color: white; }
        .btn-ghost { background: var(--surface-mid); border: 1px solid var(--border-mid); color: var(--text-sec); }

        /* ── TODAY SCREEN ───────────────────────────────────────────────────── */
        #screen-today { display: none; }
        #screen-today.active { display: block; }

        .today-header {
            text-align: center;
            padding: 20px 20px 12px;
            flex-shrink: 0;
        }

        .today-wordmark {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text);
            margin-bottom: 4px;
        }
        .today-wordmark span { color: var(--primary); }

        .today-greeting {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ── 4-TILE GRID — Today / Lift / Run / Stretch ──────────────────────
           SINGLE SOURCE OF TRUTH. Tiles are a FIXED 148px tall. They do not
           stretch to fill the viewport — that is what pushed the tab bar
           below the fold. Do not reintroduce grid-template-rows or flex:1. */
        .today-tiles-wrap,
        .lift-tiles {
            padding: 4px 14px 12px;
        }

        .today-tiles-wrap .tile-grid,
        .lift-tiles .tile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 0;
        }

        .today-tiles-wrap .tile,
        .lift-tiles .tile {
            height: 148px;
            min-height: 0;
            border-radius: 18px;
            padding: 16px 14px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .today-tiles-wrap .tile-icon,
        .lift-tiles .tile-icon { font-size: 26px; margin-bottom: 8px; }

        .today-tiles-wrap .tile-label,
        .lift-tiles .tile-label { font-size: 17px; font-weight: 700; }

        .today-tiles-wrap .tile-sub,
        .lift-tiles .tile-sub { font-size: 11px; margin-top: 3px; color: var(--text-muted); }
        .tile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .tile {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 16px 16px;
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s;
            -webkit-tap-highlight-color: transparent;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tile:active { background: var(--surface-mid); }

        .tile-icon { font-size: 26px; margin-bottom: 10px; }
        .tile-label { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 3px; letter-spacing: -0.2px; }
        .tile-sub { font-size: 11px; color: var(--text-muted); line-height: 1.4; }

        /* Accent borders when something is live */
        .tile--lift { border-color: rgba(255,107,53,0.25); }
        .tile--run  { border-color: rgba(59,158,255,0.25); }
        .tile--stretch { border-color: rgba(6,214,160,0.25); }
        .tile--plan { border-color: rgba(255,255,255,0.1); }

        /* ── STATS STRIP ────────────────────────────────────────────────────── */
        .stats-strip {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .stat-tile {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 8px;
            text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: 700; margin-bottom: 3px; letter-spacing: -0.5px; }
        .stat-value--lift { color: var(--primary); }
        .stat-value--run  { color: var(--run); }
        .stat-value--warn { color: var(--warning); }
        .stat-value--ok   { color: var(--success); }
        .stat-label { font-size: 10px; color: var(--text-muted); line-height: 1.3; }

        /* ── AI CARD ────────────────────────────────────────────────────────── */
        .ai-card {
            background: var(--info-dim);
            border: 1px solid var(--info-border);
            border-radius: var(--radius);
            padding: 12px 14px;
            margin-bottom: 8px;
        }
        .ai-label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1.5px; color: rgba(160,148,255,0.65); margin-bottom: 5px;
        }
        .ai-text { font-size: 13px; color: rgba(255,255,255,0.78); line-height: 1.55; }

        /* ── WORKOUT ACTION CARDS (Lift + Run tabs) ─────────────────────────── */
        .wk-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 15px 16px;
            margin-bottom: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 62px;
            transition: background 0.1s, border-color 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .wk-card:active { background: var(--surface-mid); border-color: var(--border-mid); }
        .wk-card-body { flex: 1; }
        .wk-card-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
        .wk-card-meta { font-size: 12px; color: var(--text-muted); }
        .wk-card-arrow { font-size: 20px; color: var(--text-muted); flex-shrink: 0; }

        /* Featured card (C25K, custom, etc.) */
        .wk-card--featured {
            background: var(--surface-mid);
            border-color: var(--border-mid);
            min-height: 70px;
        }
        .wk-card--featured .wk-card-name { font-size: 16px; }

        /* ── LIST ITEMS ─────────────────────────────────────────────────────── */
        .list-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 13px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
            min-height: 48px;
            cursor: pointer;
        }
        .list-title { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 1px; }
        .list-sub { font-size: 11px; color: var(--text-muted); }
        .list-chevron { font-size: 16px; color: var(--text-muted); flex-shrink: 0; }

        /* ── WEEK GRID (Plan) ───────────────────────────────────────────────── */
        .week-nav {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 10px;
        }
        .week-nav-btn {
            background: none; border: none; color: var(--text-muted);
            font-size: 22px; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: var(--radius-sm);
        }
        .week-range { font-size: 12px; font-weight: 600; color: var(--text-sec); }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 14px;
        }
        .wday {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 3px;
            text-align: center;
            cursor: pointer;
            min-height: 54px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 3px;
            -webkit-tap-highlight-color: transparent;
        }
        .wday-name { font-size: 9px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
        .wday-content { font-size: 9px; font-weight: 600; color: var(--text-muted); line-height: 1.2; }
        .wday--done { background: var(--success-dim); border-color: var(--success-border); }
        .wday--done .wday-name { color: rgba(6,214,160,0.6); }
        .wday--done .wday-content { color: var(--success); }
        .wday--today { border: 1.5px solid var(--primary); }
        .wday--today .wday-name { color: rgba(255,107,53,0.7); }
        .wday--today .wday-content { color: var(--primary); font-size: 8px; }
        .wday--add .wday-content { color: rgba(255,107,53,0.35); font-size: 15px; }
        .wday--run .wday-content { color: var(--run); }
        .wday--run { background: var(--run-dim); border-color: var(--run-border); }

        /* ── LIFT / RUN / STRETCH SECTION ──────────────────────────────────── */
        /* Sub-header with back nav for inner screens */
        .sub-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 52px 20px 14px;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 22px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: -6px;
        }
        .sub-header-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.2px;
        }
        .sub-header-right {
            margin-left: auto;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Lift/Run/Stretch tiles are styled by the consolidated 4-tile block
           above. This section previously re-declared them and won on cascade
           order — that duplication is gone. Do not re-add it here. */

        /* Program cards */
        .prog-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .prog-card:active { background: var(--surface-mid); }
        .prog-card--active {
            background: var(--primary-dim);
            border-color: var(--primary-border);
        }
        .prog-card-name { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
        .prog-card-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
        .prog-card-desc { font-size: 13px; color: var(--text-sec); line-height: 1.5; }
        .prog-card-progress {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
        }

        /* History cards */
        .hist-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 8px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .hist-card:active { background: var(--surface-mid); }
        .hist-card-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .hist-card-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
        .hist-card-date { font-size: 12px; color: var(--text-muted); }
        .hist-card-meta { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
        .hist-card-exercises { font-size: 12px; color: var(--text-sec); margin-top: 4px; line-height: 1.5; }

        /* ── WORKOUT SCREEN ──────────────────────────────────────────────────── */
        #screen-workout {
            display: none;
            flex-direction: column;
        }
        #screen-workout.active { display: flex; }

        .workout-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 52px 20px 12px;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .workout-header-left { display: flex; align-items: center; gap: 10px; }
        .workout-name { font-size: 16px; font-weight: 700; color: var(--text); }
        .workout-timer { font-size: 14px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .workout-end-btn {
            background: none;
            border: 1px solid rgba(239,71,111,0.4);
            color: #EF476F;
            font-size: 13px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
        }

        .workout-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            padding: 16px 20px 120px;
        }
        .workout-body::-webkit-scrollbar { display: none; }

        /* Exercise block */
        .ex-block { margin-bottom: 24px; }
        .ex-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .ex-number { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
        .ex-name { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 2px; letter-spacing: -0.3px; }
        .ex-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

        /* Set row */
        .set-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            min-height: 52px;
            transition: background 0.1s, border-color 0.1s;
        }
        .set-row--done {
            background: var(--success-dim);
            border-color: var(--success-border);
        }
        .set-label { font-size: 12px; font-weight: 600; color: var(--text-muted); min-width: 38px; }
        .set-label--done { color: var(--success); }

        .set-inputs { display: flex; align-items: center; gap: 8px; flex: 1; }
        .set-val-group { display: flex; align-items: center; gap: 4px; }
        .set-adj-btn {
            background: var(--surface-mid);
            border: 1px solid var(--border-mid);
            color: var(--text);
            width: 30px; height: 30px;
            border-radius: 6px;
            font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
        }
        .set-input {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            width: 44px;
            font-family: inherit;
        }
        .set-input:focus { outline: none; }
        .set-sep { font-size: 12px; color: var(--text-muted); }

        .set-done-display {
            font-size: 15px;
            font-weight: 600;
            color: var(--success);
            flex: 1;
        }

        .set-done-btn {
            background: var(--primary);
            border: none;
            color: white;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            min-height: 36px;
        }
        .set-done-btn--done {
            background: transparent;
            border: 1px solid var(--success-border);
            color: var(--success);
            font-size: 18px;
            padding: 4px 10px;
        }

        /* Next exercise preview */
        .next-preview {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }
        .next-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .next-name { font-size: 13px; font-weight: 600; color: var(--text-sec); }

        /* Rest timer overlay */
        .rest-overlay {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: linear-gradient(135deg, #1a237e, #283593);
            padding: 12px 20px 20px;
            display: none;
            z-index: 100;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .rest-overlay.active { display: block; }
        .rest-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .rest-info { flex: 1; }
        .rest-label { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .rest-time { font-size: 38px; font-weight: 800; color: white; font-variant-numeric: tabular-nums; line-height: 1; }
        .rest-controls { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
        .rest-adj-row { display: flex; gap: 6px; }
        .rest-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            min-height: 34px;
        }
        .rest-skip-btn {
            background: white;
            border: none;
            color: #1a237e;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Workout complete screen */
        .workout-complete {
            text-align: center;
            padding: 48px 24px;
        }
        .wc-icon { font-size: 56px; margin-bottom: 16px; }
        .wc-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }
        .wc-sub { font-size: 14px; color: var(--text-sec); margin-bottom: 28px; }
        .wc-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 28px; }
        .wc-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 8px; text-align: center; }
        .wc-stat-val { font-size: 22px; font-weight: 700; margin-bottom: 3px; }
        .wc-stat-label { font-size: 10px; color: var(--text-muted); line-height: 1.3; }

        /* Empty state */
        .empty {
            text-align: center;
            padding: 48px 20px;
        }
        .empty-icon { font-size: 44px; margin-bottom: 16px; }
        .empty-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .empty-body { font-size: 13px; color: var(--text-sec); line-height: 1.6; max-width: 260px; margin: 0 auto 24px; }
        /* ── PLAN GRID ───────────────────────────────────────────────────────── */
        .plan-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            flex: 1;
            min-height: 0;
        }

        .plan-day {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s;
            padding: 10px 4px;
            min-height: 64px;
        }
        .plan-day:active { background: var(--surface-mid); }
        .plan-day-name { font-size: 11px; font-weight: 700; color: var(--text-muted); }
        .plan-day-date { font-size: 10px; color: var(--text-muted); }
        .plan-day-content { font-size: 11px; font-weight: 600; color: var(--text-muted); text-align: center; line-height: 1.3; }
        .plan-day--today { border: 2px solid var(--primary); }
        .plan-day--today .plan-day-name { color: rgba(255,107,53,0.8); }
        .plan-day--today .plan-day-date { color: rgba(255,107,53,0.6); }
        .plan-day--today .plan-day-content { color: var(--primary); }
        .plan-day--done { background: var(--success-dim); border-color: var(--success-border); }
        .plan-day--done .plan-day-name { color: rgba(6,214,160,0.7); }
        .plan-day--done .plan-day-date { color: rgba(6,214,160,0.5); }
        .plan-day--done .plan-day-content { color: var(--success); }
        .plan-day--run { background: var(--run-dim); border-color: var(--run-border); }
        .plan-day--run .plan-day-name { color: rgba(59,158,255,0.7); }
        .plan-day--run .plan-day-date { color: rgba(59,158,255,0.5); }
        .plan-day--run .plan-day-content { color: var(--run); }
        .plan-day--lift { background: var(--primary-dim); border-color: var(--primary-border); }
        .plan-day--lift .plan-day-name { color: rgba(255,107,53,0.7); }
        .plan-day--lift .plan-day-date { color: rgba(255,107,53,0.5); }
        .plan-day--lift .plan-day-content { color: var(--primary); }

        /* ── SPLASH ─────────────────────────────────────────────────────────── */
        .splash {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.4s ease;
        }
        .splash.hidden { opacity: 0; pointer-events: none; }
        .splash-mark { font-size: 52px; font-weight: 800; letter-spacing: -1.5px; }
        .splash-mark span { color: var(--primary); }
        .splash-tag { font-size: 11px; color: var(--text-muted); letter-spacing: 3px; text-transform: uppercase; margin-top: 10px; }

        /* ── TAB BAR ────────────────────────────────────────────────────────── */
        .tab-bar {
            background: var(--tab-bg);
            border-top: 1px solid var(--tab-border);
            display: flex; justify-content: space-around; align-items: center;
            padding: 8px 0 calc(8px + var(--safe-bottom));
            flex-shrink: 0;
        }
        .tab-btn {
            background: none; border: none;
            padding: 8px 10px; min-height: 44px;
            display: flex; align-items: center; justify-content: center;
        }
        .tab-label {
            font-size: 13px; font-weight: 400;
            color: var(--tab-inactive); letter-spacing: 0.1px;
            transition: color 0.12s, font-weight 0.12s;
        }
        .tab-btn.active .tab-label { color: var(--tab-active); font-weight: 700; }
    </style>
</head>
<body>

<div class="splash" id="splash">
    <div class="splash-mark">SETS<span>+</span></div>

    </div>

    <!-- Tab Bar -->

<script>
'use strict';

// ── STATE ─────────────────────────────────────────────────────────────────────
const S = {
    tab:              'today',
    userName:         localStorage.getItem('sp_name') || 'Athlete',
    streak:           parseInt(localStorage.getItem('sp_streak') || '0'),
    sessionsThisWeek: parseInt(localStorage.getItem('sp_sessions_week') || '0'),
    prsThisWeek:      parseInt(localStorage.getItem('sp_prs_week') || '0'),
    liftDoneToday:    false,
    liftWorkoutName:  null,
    runDoneToday:     false,
    runType:          null,   // 'run' | 'walk' | 'c25k'
    weekOffset:       0,
    weekSchedule:     JSON.parse(localStorage.getItem('sp_week') || '{}'),
};

function save() {
    localStorage.setItem('sp_name',           S.userName);
    localStorage.setItem('sp_streak',         S.streak);
    localStorage.setItem('sp_sessions_week',  S.sessionsThisWeek);
    localStorage.setItem('sp_prs_week',       S.prsThisWeek);
    localStorage.setItem('sp_week',           JSON.stringify(S.weekSchedule));
}

// ── LOOKUP ────────────────────────────────────────────────────────────────────
const WORKOUTS = {
    chest:     { label:'Chest & Triceps',  muscles:'Pecs · delts · tris',          time:45, exercises:6 },
    back:      { label:'Back & Biceps',    muscles:'Lats · rows · bis',             time:45, exercises:6 },
    legs:      { label:'Legs',             muscles:'Quads · glutes · hamstrings',   time:50, exercises:6 },
    shoulders: { label:'Shoulders & Arms', muscles:'Delts · tris · bis',            time:40, exercises:6 },
    push:      { label:'Push Day',         muscles:'Chest · shoulders · tris',      time:45, exercises:6 },
    pull:      { label:'Pull Day',         muscles:'Back · biceps · rear delts',    time:45, exercises:6 },
    upper:     { label:'Upper Body',       muscles:'Full upper body',               time:50, exercises:7 },
    fullbody:  { label:'Full Body',        muscles:'Everything',                    time:55, exercises:8 },
    walk:      { label:'Walk',             type:'walk',                             time:45 },
    run:       { label:'Run',              type:'run',                              time:30 },
    c25k:      { label:'Couch to 5K',      type:'c25k',                             time:30 },
    rest:      { label:'Rest',             type:'rest',                             time:0  },
};

// ── HELPERS ───────────────────────────────────────────────────────────────────
function greeting() {
    const h = new Date().getHours();
    return h < 12 ? 'Good morning,' : h < 17 ? 'Good afternoon,' : 'Good evening,';
}

function getWeekDates(offset) {
    const today = new Date();
    const dow = today.getDay();
    const mon = new Date(today);
    mon.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1) + (offset * 7));
    return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(mon);
        d.setDate(mon.getDate() + i);
        return d;
    });
}

function getTodayScheduled() {
    const dates = getWeekDates(0);
    const todayStr = new Date().toDateString();
    const idx = dates.findIndex(d => d.toDateString() === todayStr);
    const id = S.weekSchedule[idx];
    if (!id || id === 'rest') return null;
    const w = WORKOUTS[id];
    return w ? { id, ...w } : null;
}

function scheduledCount() {
    return Object.values(S.weekSchedule).filter(v => v && v !== 'rest').length;
}

// ── THREAD ────────────────────────────────────────────────────────────────────
function buildThread(colour, text) {
    return `<div class="thread thread--${colour}" style="margin:0 20px 14px;">
        <div class="thread-dot"></div>
        <div class="thread-text">${text}</div>
    </div>`;
}

function getThread(tab) {
    const sc = scheduledCount();
    const lifted = S.liftDoneToday;
    const ran    = S.runDoneToday;

    switch (tab) {
        case 'today':
            if (lifted && ran)  return buildThread('success', `${S.liftWorkoutName} + ${S.runType} done today`);
            if (lifted)         return buildThread('success', `${S.liftWorkoutName} done · ${S.prsThisWeek > 0 ? S.prsThisWeek + ' PRs this week' : 'great session'}`);
            if (ran)            return buildThread('run',     `${S.runType === 'c25k' ? 'C25K session' : S.runType === 'walk' ? 'Walk' : 'Run'} done today`);
            const sched = getTodayScheduled();
            if (sched)          return buildThread('primary', `${sched.label} scheduled today — ready when you are`);
            return buildThread('neutral', 'Choose what you\'re doing today');

        case 'lift':
            if (lifted) return buildThread('success', `Done today — ${S.liftWorkoutName}`);
            const ls = getTodayScheduled();
            if (ls && ls.type !== 'walk' && ls.type !== 'run' && ls.type !== 'c25k')
                return buildThread('primary', `${ls.label} scheduled today`);
            return buildThread('neutral', 'Choose a session to start');

        case 'run':
            if (ran) return buildThread('run', `${S.runType === 'walk' ? 'Walk' : S.runType === 'c25k' ? 'C25K session' : 'Run'} complete today`);
            return buildThread('neutral', 'Choose your session below');

        case 'stretch':
            if (lifted) return buildThread('success', `${S.liftWorkoutName} recovery routine ready`);
            if (ran)    return buildThread('run',     `Post-${S.runType === 'walk' ? 'walk' : 'run'} recovery routine ready`);
            const h = new Date().getHours();
            if (h < 10) return buildThread('neutral', 'Morning mobility — wake the body up');
            const ps = getTodayScheduled();
            if (ps)     return buildThread('primary', `Pre-${ps.id === 'walk' || ps.id === 'run' ? ps.id : 'session'} warmup ready`);
            return buildThread('neutral', 'Choose a stretch routine below');

        case 'plan':
            if (sc > 0) return buildThread('primary', `${sc} day${sc !== 1 ? 's' : ''} scheduled this week`);
            return buildThread('neutral', 'Tap a day to plan your week');
    }
    return '';
}

function renderThread(tab) {
    const el = document.getElementById('thread-' + tab);
    if (!el) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = getThread(tab);
    const inner = tmp.firstElementChild;
    if (inner) { el.className = inner.className; el.innerHTML = inner.innerHTML; }
}

// ── TODAY ─────────────────────────────────────────────────────────────────────
function renderToday() {
    const h = new Date().getHours();
    const greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    document.getElementById('greeting-name').textContent = `${greet}, ${S.userName}`;

    const sched       = getTodayScheduled();
    const isLiftSched = sched && !['walk','run','c25k','rest'].includes(sched.id);
    const isRunSched  = sched && ['walk','run','c25k'].includes(sched.id);
    const sc          = scheduledCount();

    const liftSub    = S.liftDoneToday ? '✓ Done today'
                     : isLiftSched     ? sched.label
                     :                   '8 sessions';

    const runSub     = S.runDoneToday  ? '✓ Done today'
                     : isRunSched      ? sched.label
                     :                   'Walk · Run · C25K';

    const stretchSub = S.liftDoneToday ? 'Recovery ready'
                     : S.runDoneToday  ? 'Recovery ready'
                     : h < 10          ? 'Morning mobility'
                     : sched           ? 'Pre-session warmup'
                     :                   'Choose a routine';

    const planSub = sc > 0 ? `${sc} day${sc !== 1 ? 's' : ''} this week` : 'Plan your week';

    document.getElementById('today-tiles').innerHTML = `
        <div class="tile tile--lift" onclick="switchTab('lift')">
            <div class="tile-icon">🏋️</div>
            <div class="tile-label">Lift</div>
            <div class="tile-sub">${liftSub}</div>
        </div>
        <div class="tile tile--run" onclick="switchTab('run')">
            <div class="tile-icon">🏃</div>
            <div class="tile-label">Run</div>
            <div class="tile-sub">${runSub}</div>
        </div>
        <div class="tile tile--stretch" onclick="switchTab('stretch')">
            <div class="tile-icon">🧘</div>
            <div class="tile-label">Stretch</div>
            <div class="tile-sub">${stretchSub}</div>
        </div>
        <div class="tile tile--plan" onclick="switchTab('plan')">
            <div class="tile-icon">📅</div>
            <div class="tile-label">Plan</div>
            <div class="tile-sub">${planSub}</div>
        </div>
    `;
}


// ── LIFT ──────────────────────────────────────────────────────────────────────
// ── SESSION DATA ──────────────────────────────────────────────────────────────
const SESSIONS = {

        { name:'Pull-ups',               muscles:'Lats · bis',          sets:4, reps:8,  weight:0,   rest:150, isBodyweight:true },

        { name:'Hammer Curls',           muscles:'Biceps · brachialis', sets:3, reps:12, weight:14,  rest:75  },

        { name:'Barbell Row',            muscles:'Back · bis',          sets:4, reps:8,  weight:60,  rest:150 },
        { name:'Overhead Press',         muscles:'Shoulders',           sets:3, reps:10, weight:40,  rest:120 },
        { name:'Lat Pulldown',           muscles:'Lats',                sets:3, reps:10, weight:55,  rest:120 },
        { name:'Lateral Raises',         muscles:'Side delts',          sets:3, reps:15, weight:10,  rest:75  },
        { name:'Dumbbell Curl',          muscles:'Biceps',              sets:3, reps:12, weight:14,  rest:75  },
    ]},
    fullbody:  { name:'Full Body',         muscles:'Everything',                    time:60, exercises:[
        { name:'Barbell Squat',          muscles:'Quads · glutes',      sets:3, reps:8,  weight:80,  rest:180 },
        { name:'Bench Press',            muscles:'Pecs · tris',         sets:3, reps:8,  weight:60,  rest:180 },

const PROGRAMS = [
    { id:'ppl',       name:'Push Pull Legs',  days:'6 days/week', length:'12 weeks', schedule:['push','pull','legs','push','pull','legs'],    desc:'The most popular strength and muscle-building split. Alternates pushing, pulling and leg sessions across 6 days.' },
    { id:'ul',        name:'Upper Lower',     days:'4 days/week', length:'12 weeks', schedule:['upper','lower','upper','lower'],              desc:'Trains full upper and full lower body on alternating days. Great balance of frequency and recovery for intermediate lifters.' },
    { id:'bro',       name:'Classic Split',   days:'5 days/week', length:'Ongoing',  schedule:['chest','back','legs','shoulders','pull'],     desc:'Chest · Back · Legs · Shoulders · Arms. The classic bodybuilding approach — high volume per muscle group each session.' },
    { id:'fullbody3', name:'Full Body 3×',    days:'3 days/week', length:'8 weeks',  schedule:['fullbody','fullbody','fullbody'],             desc:'Three full-body sessions per week with full rest between each. Highest frequency per muscle. Ideal for beginners.' },
];

// Lift navigation state
const L = { view:'tiles', sessionId:null, activeProgram:null, programDay:0 };

// Workout in-session state
const W = { active:false, sessionId:null, exercises:[], startTime:null, timerInterval:null, restInterval:null, restRemaining:0 };

// ── LIFT RENDER ROUTER ────────────────────────────────────────────────────────
function renderLift() {
    const el  = document.getElementById('lift-content');
    const hdr = document.getElementById('lift-header');
    if (!el || !hdr) return;

    if (L.view === 'tiles') {
        hdr.innerHTML = `<div class="today-wordmark">SETS<span style="color:var(--primary);">+</span> <span style="color:var(--text);font-size:26px;font-weight:700;letter-spacing:-0.5px;">Lift</span></div>`;
    } else {
        const titles = { start:'Start', programs:'Programs', custom:'Custom', history:'History' };
        hdr.innerHTML = `<div style="display:flex;align-items:center;gap:10px;">
            <button class="back-btn" onclick="liftBack()">←</button>
            <div class="today-wordmark" style="font-size:22px;">SETS<span style="color:var(--primary);">+</span> <span style="color:var(--text);font-size:18px;font-weight:700;">${titles[L.view]||''}</span></div>
        </div>`;
    }

    el.style.overflow = L.view === 'tiles' ? 'hidden' : 'auto';
    el.style.scrollbarWidth = 'none';

    if (L.view === 'tiles')    renderLiftTiles(el);
    if (L.view === 'start')    renderLiftStart(el);
    if (L.view === 'programs') renderLiftPrograms(el);
    if (L.view === 'custom')   renderLiftCustom(el);
    if (L.view === 'history')  renderLiftHistory(el);
}

function liftBack() { L.view = 'tiles'; renderLift(); }
function setLiftView(v) { L.view = v; renderLift(); }

// ── LIFT TILES ────────────────────────────────────────────────────────────────
function renderLiftTiles(el) {
    const sched = getTodayScheduled();
    const isLiftSched = sched && !['walk','run','c25k','rest'].includes(sched.id);
    const history = getLiftHistory();
    const queued  = L.sessionId || (isLiftSched ? sched.id : null) ||
                    (L.activeProgram ? getNextProgramSession() : null) ||
                    (history[0] ? history[0].id : 'chest');
    const qInfo   = SESSIONS[queued];

    const startSub  = qInfo ? qInfo.name : 'Choose a session';
    const progSub   = L.activeProgram ? getProgramName(L.activeProgram) : 'Browse programs';
    const customs   = getCustomWorkouts();
    const customSub = customs.length > 0 ? `${customs.length} saved workout${customs.length>1?'s':''}` : 'Build your own';
    const lastH     = history[0];
    const histSub   = lastH ? lastH.name : 'No sessions yet';

    el.innerHTML = `<div class="lift-tiles"><div class="tile-grid">
        <div class="tile tile--lift" onclick="setLiftView('start')">
            <div class="tile-icon">▶</div>
            <div class="tile-label">Start</div>
            <div class="tile-sub">${startSub}</div>
        </div>
        <div class="tile" style="border-color:rgba(255,255,255,0.1);" onclick="setLiftView('programs')">
            <div class="tile-icon">📋</div>
            <div class="tile-label">Programs</div>
            <div class="tile-sub">${progSub}</div>
        </div>
        <div class="tile" style="border-color:rgba(255,255,255,0.1);" onclick="setLiftView('custom')">
            <div class="tile-icon">✏️</div>
            <div class="tile-label">Custom</div>
            <div class="tile-sub">${customSub}</div>
        </div>
        <div class="tile" style="border-color:rgba(255,255,255,0.1);" onclick="setLiftView('history')">
            <div class="tile-icon">📊</div>
            <div class="tile-label">History</div>
            <div class="tile-sub">${histSub}</div>
        </div>
    </div></div>`;
}

// ── START ─────────────────────────────────────────────────────────────────────
function renderLiftStart(el) {
    const sched = getTodayScheduled();
    const isLiftSched = sched && !['walk','run','c25k','rest'].includes(sched.id);
    const queued  = L.sessionId || (isLiftSched ? sched.id : null) ||
                    (L.activeProgram ? getNextProgramSession() : null);
    let html = '<div style="padding:16px 20px 32px;">';

    if (queued && SESSIONS[queued]) {
        const sess = SESSIONS[queued];
        html += `
            <div style="margin-bottom:20px;">
                <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:6px;">${isLiftSched ? 'Scheduled today' : L.activeProgram ? 'Next in program' : 'Selected session'}</div>
                <div style="font-size:26px;font-weight:700;color:var(--text);letter-spacing:-0.5px;margin-bottom:4px;">${sess.name}</div>
                <div style="font-size:13px;color:var(--text-muted);">${sess.muscles} · ${sess.exercises.length} exercises · ~${sess.time} min</div>
            </div>
            <button class="btn btn-primary" style="margin-bottom:20px;font-size:16px;min-height:54px;" onclick="beginWorkout('${queued}')">Begin session →</button>
            <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:10px;">Exercises</div>
            ${sess.exercises.map((ex, i) => `
                <div style="display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;">
                    <div style="font-size:12px;font-weight:700;color:var(--text-muted);min-width:20px;">${i+1}</div>
                    <div style="flex:1;">
                        <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:1px;">${ex.name}</div>
                        <div style="font-size:11px;color:var(--text-muted);">${ex.sets} × ${ex.reps} · ${ex.isBodyweight ? 'Bodyweight' : ex.weight+'kg'}</div>
                    </div>
                </div>`).join('')}
            <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
                <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">Not today's session?</div>
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-ghost" style="flex:1;font-size:13px;" onclick="setLiftView('programs')">Programs</button>
                    <button class="btn btn-ghost" style="flex:1;font-size:13px;" onclick="setLiftView('custom')">Custom</button>
                </div>
            </div>`;
    } else {
        html += `<div class="empty"><div class="empty-icon">💪</div><div class="empty-title">Nothing selected yet</div>
            <div class="empty-body">Choose a program below, or pick any session to jump in.</div></div>
            <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:10px;">Sessions</div>`;
        Object.entries(SESSIONS).forEach(([id, s]) => {
            html += `<div class="wk-card" onclick="L.sessionId='${id}';beginWorkout('${id}')">
                <div class="wk-card-body"><div class="wk-card-name">${s.name}</div><div class="wk-card-meta">${s.muscles} · ${s.time} min</div></div>
                <div class="wk-card-arrow">›</div></div>`;
        });
    }

    html += '</div>';
    el.innerHTML = html;
}

// ── PROGRAMS ──────────────────────────────────────────────────────────────────
function renderLiftPrograms(el) {
    let html = '<div style="padding:16px 20px 32px;">';
    if (L.activeProgram) {
        const prog = PROGRAMS.find(p => p.id === L.activeProgram);
        const nextId = getNextProgramSession();
        const nextSess = nextId ? SESSIONS[nextId] : null;
        html += `<div class="prog-card prog-card--active" style="margin-bottom:16px;">
            <div class="prog-card-name">${prog.name}</div>
            <div class="prog-card-meta">${prog.days} · Week ${Math.floor(L.programDay/prog.schedule.length)+1}</div>
            ${nextSess ? `<div style="font-size:13px;color:var(--text-sec);">Next: <strong style="color:var(--text);">${nextSess.name}</strong></div>
            <div class="prog-card-progress">Day ${(L.programDay%prog.schedule.length)+1} of ${prog.schedule.length}</div>
            <button class="btn btn-primary" style="margin-top:12px;" onclick="L.sessionId='${nextId}';setLiftView('start')">Start next session →</button>` : ''}
        </div>
        <button class="btn btn-ghost" style="margin-bottom:20px;" onclick="L.activeProgram=null;renderLift()">Leave this program</button>`;
    }
    html += `<div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:10px;">${L.activeProgram?'Switch program':'Programs'}</div>`;
    PROGRAMS.forEach(prog => {
        const active = L.activeProgram === prog.id;
        html += `<div class="prog-card ${active?'prog-card--active':''}" onclick="selectProgram('${prog.id}')">
            <div class="prog-card-name">${prog.name}</div>
            <div class="prog-card-meta">${prog.days} · ${prog.length}</div>
            <div class="prog-card-desc">${prog.desc}</div>
            ${active ? '<div class="prog-card-progress">Currently following ✓</div>' : ''}
        </div>`;
    });
    html += '</div>';
    el.innerHTML = html;
}

function selectProgram(id) {
    L.activeProgram = id;
    L.programDay    = 0;
    L.sessionId     = PROGRAMS.find(p => p.id === id).schedule[0];
    renderLift();
    toast(`${getProgramName(id)} selected`);
}

function getNextProgramSession() {
    if (!L.activeProgram) return null;
    const prog = PROGRAMS.find(p => p.id === L.activeProgram);
    return prog ? prog.schedule[L.programDay % prog.schedule.length] : null;
}

function getProgramName(id) {
    const p = PROGRAMS.find(p => p.id === id);
    return p ? p.name : id;
}

// ── CUSTOM ────────────────────────────────────────────────────────────────────
function renderLiftCustom(el) {
    const customs = getCustomWorkouts();
    let html = '<div style="padding:16px 20px 32px;">';
    html += `<button class="btn btn-primary" style="margin-bottom:20px;" onclick="toast('Custom builder coming in Session 2')">+ Build a new workout</button>`;
    if (customs.length === 0) {
        html += `<div class="empty"><div class="empty-icon">✏️</div><div class="empty-title">No custom workouts yet</div>
            <div class="empty-body">Build your own routine from the full library of 317 exercises. Choose your exercises, sets, reps and order.</div></div>`;
    } else {
        html += `<div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:10px;">Your workouts</div>`;
        customs.forEach(c => {
            html += `<div class="wk-card" onclick="beginWorkout('${c.id}')">
                <div class="wk-card-body"><div class="wk-card-name">${c.name}</div><div class="wk-card-meta">${c.exercises.length} exercises · last done ${c.lastDone||'never'}</div></div>
                <div class="wk-card-arrow">›</div></div>`;
        });
    }
    html += '</div>';
    el.innerHTML = html;
}

function getCustomWorkouts() {
    try { return JSON.parse(localStorage.getItem('sp_custom_workouts') || '[]'); } catch { return []; }
}

// ── HISTORY ───────────────────────────────────────────────────────────────────
function renderLiftHistory(el) {
    const history = getLiftHistory();
    let html = '<div style="padding:16px 20px 32px;">';
    if (history.length === 0) {
        html += `<div class="empty"><div class="empty-icon">📊</div><div class="empty-title">No sessions yet</div>
            <div class="empty-body">Your completed sessions appear here — every exercise, set and weight. Useful before a session to know what you did last time.</div></div>`;
    } else {
        html += `<div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:10px;">Recent sessions</div>`;
        history.forEach(h => {
            html += `<div class="hist-card">
                <div class="hist-card-row">
                    <div><div class="hist-card-name">${h.name}</div><div class="hist-card-date">${h.date} · ${h.duration} min · ${h.sets} sets</div></div>
                    <span style="color:var(--text-muted);font-size:16px;">›</span>
                </div>
                <div class="hist-card-exercises">${h.exercises ? h.exercises.map(e=>e.name).join(' · ') : ''}</div>
                ${h.prs > 0 ? `<div style="font-size:11px;color:var(--warning);margin-top:6px;font-weight:600;">🏆 ${h.prs} PR${h.prs>1?'s':''}</div>` : ''}
            </div>`;
        });
    }
    html += '</div>';
    el.innerHTML = html;
}

function getLiftHistory() {
    try { return JSON.parse(localStorage.getItem('sp_lift_history') || '[]').slice(0,10); } catch { return []; }
}

// ── WORKOUT TRACKING ──────────────────────────────────────────────────────────
function beginWorkout(sessionId) {
    const sess = SESSIONS[sessionId];
    if (!sess) { toast('Session not found'); return; }

    W.active    = true;
    W.sessionId = sessionId;
    W.startTime = Date.now();
    W.exercises = sess.exercises.map(ex => ({
        ...ex,
        sets: Array.from({ length:ex.sets }, () => ({ weight:ex.weight, reps:ex.reps, done:false }))
    }));

    document.querySelector('.tab-bar').style.display = 'none';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-workout').classList.add('active');

    document.getElementById('wk-name').textContent = sess.name;
    startWTimer();
    renderWorkoutBody();
}

function startWTimer() {
    clearInterval(W.timerInterval);
    W.timerInterval = setInterval(() => {
        const e = Math.floor((Date.now() - W.startTime) / 1000);
        const el = document.getElementById('wk-timer');
        if (el) el.textContent = `${Math.floor(e/60)}:${String(e%60).padStart(2,'0')}`;
    }, 1000);
}

function renderWorkoutBody() {
    const body = document.getElementById('wk-body');
    if (!body) return;
    let html = '';
    W.exercises.forEach((ex, ei) => {
        html += `<div class="ex-block">
            <div class="ex-number">Exercise ${ei+1} of ${W.exercises.length}</div>
            <div class="ex-name">${ex.name}</div>
            <div class="ex-meta">${ex.muscles}</div>`;
        ex.sets.forEach((set, si) => {
            if (set.done) {
                html += `<div class="set-row set-row--done">
                    <div class="set-label set-label--done">Set ${si+1}</div>
                    <div class="set-done-display">${ex.isBodyweight ? `${set.reps} reps` : `${set.weight}kg × ${set.reps}`}</div>
                    <button class="set-done-btn set-done-btn--done" onclick="undoSet(${ei},${si})">✓</button>
                </div>`;
            } else {
                html += `<div class="set-row">
                    <div class="set-label">Set ${si+1}</div>
                    <div class="set-inputs">
                        ${!ex.isBodyweight ? `
                        <div class="set-val-group">
                            <button class="set-adj-btn" onclick="adjW(${ei},${si},-2.5)">−</button>
                            <input class="set-input" id="w-${ei}-${si}" type="number" value="${set.weight}" step="2.5" min="0" onchange="setW(${ei},${si},this.value)">
                            <span class="set-sep" style="font-size:11px;">kg</span>
                            <button class="set-adj-btn" onclick="adjW(${ei},${si},2.5)">+</button>
                        </div>
                        <span class="set-sep">×</span>` : ''}
                        <div class="set-val-group">
                            <button class="set-adj-btn" onclick="adjR(${ei},${si},-1)">−</button>
                            <input class="set-input" id="r-${ei}-${si}" type="number" value="${set.reps}" min="1" onchange="setR(${ei},${si},this.value)">
                            <span class="set-sep" style="font-size:11px;">reps</span>
                            <button class="set-adj-btn" onclick="adjR(${ei},${si},1)">+</button>
                        </div>
                    </div>
                    <button class="set-done-btn" onclick="doneSet(${ei},${si})">Done</button>
                </div>`;
            }
        });
        if (ei < W.exercises.length - 1) {
            html += `<div class="next-preview"><div>
                <div class="next-label">Up next</div>
                <div class="next-name">${W.exercises[ei+1].name}</div>
            </div></div>`;
        }
        html += '</div>';
    });
    body.innerHTML = html;
}

function adjW(ei, si, d) {
    W.exercises[ei].sets[si].weight = Math.max(0, parseFloat((W.exercises[ei].sets[si].weight + d).toFixed(1)));
    const el = document.getElementById(`w-${ei}-${si}`);
    if (el) el.value = W.exercises[ei].sets[si].weight;
}
function setW(ei, si, v) { W.exercises[ei].sets[si].weight = Math.max(0, parseFloat(v)||0); }
function adjR(ei, si, d) {
    W.exercises[ei].sets[si].reps = Math.max(1, W.exercises[ei].sets[si].reps + d);
    const el = document.getElementById(`r-${ei}-${si}`);
    if (el) el.value = W.exercises[ei].sets[si].reps;
}
function setR(ei, si, v) { W.exercises[ei].sets[si].reps = Math.max(1, parseInt(v)||1); }

function doneSet(ei, si) {
    const wEl = document.getElementById(`w-${ei}-${si}`);
    const rEl = document.getElementById(`r-${ei}-${si}`);
    if (wEl) W.exercises[ei].sets[si].weight = parseFloat(wEl.value)||0;
    if (rEl) W.exercises[ei].sets[si].reps   = parseInt(rEl.value)||1;
    W.exercises[ei].sets[si].done = true;
    renderWorkoutBody();
    showRestTimer(W.exercises[ei].rest || 90);
    setTimeout(() => {
        const next = document.querySelector('.set-row:not(.set-row--done)');
        if (next) next.scrollIntoView({ behavior:'smooth', block:'center' });
    }, 100);
}

function undoSet(ei, si) {
    W.exercises[ei].sets[si].done = false;
    skipRest();
    renderWorkoutBody();
}

function showRestTimer(secs) {
    W.restRemaining = secs;
    document.getElementById('rest-overlay').classList.add('active');
    updateRestDisplay();
    clearInterval(W.restInterval);
    W.restInterval = setInterval(() => {
        W.restRemaining--;
        if (W.restRemaining <= 0) { skipRest(); return; }
        updateRestDisplay();
    }, 1000);
}

function updateRestDisplay() {
    const el = document.getElementById('rest-time');
    if (el) el.textContent = `${Math.floor(W.restRemaining/60)}:${String(W.restRemaining%60).padStart(2,'0')}`;
}

function adjustRest(d) { W.restRemaining = Math.max(5, W.restRemaining + d); updateRestDisplay(); }
function skipRest() { clearInterval(W.restInterval); document.getElementById('rest-overlay').classList.remove('active'); }

function endWorkoutPrompt() {
    const sets = W.exercises.reduce((a, ex) => a + ex.sets.filter(s => s.done).length, 0);
    endWorkout(sets > 0);
}

function endWorkout(doSave) {
    clearInterval(W.timerInterval);
    skipRest();
    if (doSave && W.sessionId) {
        const dur  = Math.max(1, Math.round((Date.now() - W.startTime) / 60000));
        const sess = SESSIONS[W.sessionId];
        const sets = W.exercises.reduce((a, ex) => a + ex.sets.filter(s => s.done).length, 0);
        const hist = getLiftHistory();
        hist.unshift({ id:W.sessionId, name:sess.name, date:new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}), duration:dur, exercises:W.exercises, sets, prs:0 });
        localStorage.setItem('sp_lift_history', JSON.stringify(hist.slice(0,20)));
        S.liftDoneToday = true; S.liftWorkoutName = sess.name;
        S.sessionsThisWeek++; S.streak++;
        if (L.activeProgram) L.programDay++;
        save();
    }
    W.active = false; W.exercises = [];
    document.querySelector('.tab-bar').style.display = '';
    document.getElementById('screen-workout').classList.remove('active');
    L.view = 'tiles';
    switchTab(doSave ? 'stretch' : 'lift');
    if (doSave) toast('Session saved — time to stretch 🧘');
}

// ── RUN STATE ─────────────────────────────────────────────────────────────────
const R = { view:'tiles', programWeek:1, programDay:1 };

function renderRun() {
    const el  = document.getElementById('run-content');
    const hdr = document.getElementById('run-header');
    if (!el) return;

    // Header
    if (R.view === 'tiles') {
        hdr.innerHTML = `<div class="today-wordmark">SETS<span style="color:var(--primary);">+</span> <span style="color:var(--text);font-size:26px;font-weight:700;letter-spacing:-0.5px;">Run</span></div>`;
    } else {
        const titles = { start:'Start', programs:'Programs', custom:'Custom', history:'History' };
        hdr.innerHTML = `<div style="display:flex;align-items:center;gap:10px;">
            <button class="back-btn" onclick="runBack()">←</button>
            <div class="today-wordmark" style="font-size:22px;">SETS<span style="color:var(--primary);">+</span> <span style="color:var(--text);font-size:18px;font-weight:700;">${titles[R.view]||''}</span></div>
        </div>`;
    }

    if (R.view === 'tiles')    renderRunTiles(el);
    if (R.view === 'start')    renderRunStart(el);
    if (R.view === 'programs') renderRunPrograms(el);
    if (R.view === 'custom')   renderRunCustom(el);
    if (R.view === 'history')  renderRunHistory(el);

// ── PLAN ──────────────────────────────────────────────────────────────────────
function renderPlan() {
    const today    = new Date();
    const todayStr = today.toDateString();
    const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // Build 14 days starting from today's Monday (or today if it's Monday)
    const dow = today.getDay();
    const monday = new Date(today);
    monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1) + (S.weekOffset * 7));

    // Show 14 days (Mon → Sun of current week + next week)
    const days = Array.from({ length: 14 }, (_, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        return d;
    });

    // Date range label
    const startLabel = `${DAY_NAMES[days[0].getDay()]} ${days[0].getDate()} ${MONTH_SHORT[days[0].getMonth()]}`;
    const endLabel   = `${DAY_NAMES[days[13].getDay()]} ${days[13].getDate()} ${MONTH_SHORT[days[13].getMonth()]}`;

    let grid = '';
    days.forEach((d, i) => {
        const isToday = d.toDateString() === todayStr;
        const isPast  = d < today && !isToday;
        // Week schedule key: use offset-aware index
        const schedKey = `${S.weekOffset}-${i}`;
        const absIdx   = (S.weekOffset * 14) + i;
        const id       = S.weekSchedule[absIdx];
        const sess     = id && id !== 'rest' ? (SESSIONS[id] || WORKOUTS[id]) : null;
        const isRun    = id && ['walk','run','c25k'].includes(id);
        const isRest   = id === 'rest';

        let cls = 'plan-day';
        if (isToday)             cls += ' plan-day--today';
        else if (isPast && sess) cls += ' plan-day--done';
        else if (sess && isRun)  cls += ' plan-day--run';
        else if (sess)           cls += ' plan-day--lift';

        const dayName  = DAY_NAMES[d.getDay()];
        const dateNum  = d.getDate();
        const sessName = sess ? (id === 'c25k' ? 'C25K' : id === 'walk' ? 'Walk' : id === 'run' ? 'Run' : (sess.name || sess.label || id).split(' ')[0])
                        : isRest ? 'Rest' : '+';

        grid += `<div class="${cls}" onclick="openDaySheet(${absIdx}, '${d.toDateString()}')">
            <div class="plan-day-name">${dayName}</div>
            <div class="plan-day-date">${dateNum}</div>
            <div class="plan-day-content">${sessName}</div>
        </div>`;
    });

    document.getElementById('plan-content').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-shrink:0;">
            <button class="week-nav-btn" onclick="navWeek(-1)">‹</button>
            <span class="week-range" style="font-size:12px;">${startLabel} – ${endLabel}</span>
            <button class="week-nav-btn" onclick="navWeek(1)">›</button>
        </div>
        <div class="plan-grid">${grid}</div>
    `;
}

function openDaySheet(absIdx, dateStr) {
    const d = new Date(dateStr);
    const dayLabel = d.toLocaleDateString('en-GB',{ weekday:'long', day:'numeric', month:'short' });
    const current = S.weekSchedule[absIdx];

    const liftOptions = Object.entries(SESSIONS).map(([id, s]) =>
        `<div class="wk-card ${current===id?'wk-card--featured':''}" style="margin-bottom:6px;" onclick="setDaySession(${absIdx},'${id}')">
            <div class="wk-card-body"><div class="wk-card-name">${s.name}</div><div class="wk-card-meta">${s.muscles}</div></div>
            ${current===id ? '<span style="color:var(--primary);font-size:16px;">✓</span>' : '<div class="wk-card-arrow">›</div>'}
        </div>`).join('');

    const sheet = document.createElement('div');
    sheet.id = 'day-sheet';
    sheet.style.cssText = `position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,0.55);`;
    sheet.innerHTML = `

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <div style="font-size:16px;font-weight:700;color:var(--text);">${dayLabel}</div>
                <button onclick="closeDaySheet()" style="background:none;border:none;color:var(--text-muted);font-size:22px;cursor:pointer;">✕</button>
            </div>
            <div class="section-label">Lift</div>

                <div class="wk-card-body"><div class="wk-card-name">Run</div></div>
                ${current==='run' ? '<span style="color:var(--run);font-size:16px;">✓</span>' : '<div class="wk-card-arrow">›</div>'}

            <div class="wk-card ${current==='walk'?'wk-card--featured':''}" style="margin-bottom:6px;" onclick="setDaySession(${absIdx},'walk')">
                <div class="wk-card-body"><div class="wk-card-name">Walk</div></div>
                ${current==='walk' ? '<span style="color:var(--run);font-size:16px;">✓</span>' : '<div class="wk-card-arrow">›</div>'}
            </div>
            <div class="wk-card ${current==='c25k'?'wk-card--featured':''}" style="margin-bottom:6px;" onclick="setDaySession(${absIdx},'c25k')">
                <div class="wk-card-body"><div class="wk-card-name">C25K session</div></div>
                ${current==='c25k' ? '<span style="color:var(--run);font-size:16px;">✓</span>' : '<div class="wk-card-arrow">›</div>'}
            </div>
            <div class="section-label" style="margin-top:14px;">Rest</div>
            <div class="wk-card ${current==='rest'?'wk-card--featured':''}" style="margin-bottom:6px;" onclick="setDaySession(${absIdx},'rest')">
                <div class="wk-card-body"><div class="wk-card-name">Rest day</div></div>
                ${current==='rest' ? '<span style="color:var(--text-muted);font-size:16px;">✓</span>' : '<div class="wk-card-arrow">›</div>'}
            </div>
            ${current ? `<button class="btn btn-ghost" style="margin-top:8px;" onclick="setDaySession(${absIdx},null)">Clear day</button>` : ''}
        </div>`;
    sheet.addEventListener('click', e => { if (e.target === sheet) closeDaySheet(); });
    document.body.appendChild(sheet);
}

function closeDaySheet() {
    const s = document.getElementById('day-sheet');
    if (s) s.remove();
}

function setDaySession(idx, sessionId) {
    S.weekSchedule[idx] = sessionId;
    save();
    closeDaySheet();
    renderPlan();
    renderToday();
}

// ── AI COACH ──────────────────────────────────────────────────────────────────
function getAI() {
    const h = new Date().getHours();
    if (S.prsThisWeek > 0 && S.liftDoneToday)
        return `${S.prsThisWeek} personal record${S.prsThisWeek !== 1 ? 's' : ''} today. Eat enough protein in the next 2 hours — your muscles are primed for recovery.`;
    if (S.liftDoneToday || S.runDoneToday)
        return 'Session done. Stretching now matters — the work you did needs time to consolidate. Your body adapts during recovery, not during the session.';
    if (S.streak >= 7)
        return `${S.streak} days straight. Consistent training is the single most reliable predictor of long-term progress. Keep the habit.`;
    if (h < 10)
        return 'Morning sessions have a real advantage — cortisol peaks in the first hour after waking and supports performance.';
    if (S.sessionsThisWeek === 0 && h > 16)
        return 'No session yet this week. Even a short one today beats waiting for the perfect conditions.';
    return 'Track your weights consistently. The data tells you when to push harder and when to recover — without it you\'re guessing.';
}

// ── TAB SWITCHING ─────────────────────────────────────────────────────────────
const TABS = ['today','lift','run','stretch','plan'];

function switchTab(id) {
    TABS.forEach(t => {
        document.getElementById('screen-' + t).classList.toggle('active', t === id);
        document.getElementById('tab-' + t).classList.toggle('active', t === id);
    });
    S.tab = id;
    if (id !== 'lift' && id !== 'run' && id !== 'stretch' && id !== 'plan') renderThread(id);
    if (id === 'today')   renderToday();
    if (id === 'lift')    renderLift();
    if (id === 'run')     renderRun();
    if (id === 'stretch') renderStretch();
    if (id === 'plan')    renderPlan();
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────

function doStartRun(type) {
    S.runDoneToday = true;
    S.runType      = type;
    S.sessionsThisWeek++;
    S.streak++;
    save();
    toast(`${type === 'c25k' ? 'C25K session' : type === 'walk' ? 'Walk' : 'Run'} logged ✓`);
    switchTab('today');
}

function navWeek(dir) {
    S.weekOffset += dir;
    renderPlan();
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let _toastT;
function toast(msg) {
    let el = document.getElementById('sp-toast');
    if (!el) {
        el = document.createElement('div');
        el.id = 'sp-toast';
        Object.assign(el.style, {
            position:'fixed', bottom:'80px', left:'50%', transform:'translateX(-50%)',
            background:'#1a2240', border:'1px solid rgba(255,255,255,0.12)',
            color:'white', padding:'10px 18px', borderRadius:'20px',
            fontSize:'13px', fontWeight:'600', zIndex:'9999',
            pointerEvents:'none', whiteSpace:'nowrap', transition:'opacity 0.25s',
            fontFamily:'-apple-system,sans-serif'
        });
        document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(_toastT);
    _toastT = setTimeout(() => { el.style.opacity = '0'; }, 2400);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
    switchTab('today');
    setTimeout(() => document.getElementById('splash').classList.add('hidden'), 700);
});
</script>
</body>
